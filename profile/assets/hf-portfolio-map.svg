<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SZL Holdings portfolio map</title>
  <desc id="desc">Four connected product lanes for command, intelligence, models and data, and evidence, centered on a governed decision loop.</desc>
  <!-- SZL KANCHAY v1.1.0, founder direction (szl-design-system.css sha256 9e5e6e3ae2a5).
       Literal token hex (SVG cannot read CSS variables):
       #030F29 bg token (color-space-900), #061536 color-space-800, #0A1E47 color-space-700, #10151C color-gray-900
       #02091C bg-deep token, #1B222C surface token (color-gray-800), #F5F7FA text token (color-gray-50)
       #C9D2DF text-sub token (color-gray-200), #A4B1C4 color-gray-300, #76859B text-ghost token (color-gray-400)
       #E9EEF6 color-silver-100, #9AA7BD color-silver-300, #5C6B86 color-silver-500
       #DF735F accent token (color-coral-400), #F0917E color-coral-300, #C4543F color-coral-500 (orbit-mark node only)
       #FFFFFF color-white (orbit mark monogram). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030F29"/>
      <stop offset=".55" stop-color="#061536"/>
