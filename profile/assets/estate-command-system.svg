        <text x="18" y="30" fill="#BA98FA" font-size="12" font-weight="760" letter-spacing="2">VERIFY</text>
        <text x="18" y="57" fill="#AAB5C2" font-size="14">Evidence, limits,</text><text x="18" y="78" fill="#AAB5C2" font-size="14">and exact revisions.</text>
