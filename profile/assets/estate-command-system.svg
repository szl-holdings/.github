<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SZL governed AI command fabric</title>
  <desc id="desc">A restrained dark command surface with the SZL orbit mark in a holographic evidence chamber, and clear paths for decision makers, builders, and reviewers.</desc>
  <!-- SZL KANCHAY v1.1.1, founder direction (szl-design-system.css sha256 e05d19baa021).
       Literal token hex (SVG cannot read CSS variables):
       #030F29 bg token (color-space-900), #0a0f1e color-gray-950, #10151c color-gray-900
       #1b222c surface token (color-gray-800), #3c4757 border token (color-gray-600)
       #f5f7fa text token (color-gray-50), #c9d2df text-sub token (color-gray-200)
       #a4b1c4 color-gray-300, #E9EEF6 color-silver-100, #9AA7BD color-silver-300
       #5C6B86 color-silver-500, #DF735F accent token (color-coral-400), #F0917E color-coral-300
       #C4543F color-coral-500 (orbit-mark node only)
       #FFFFFF color-white (orbit mark monogram). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030F29"/>
      <stop offset="0.58" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#10151c"/>
    </linearGradient>
    <linearGradient id="signal" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="1250" y2="0">
      <stop offset="0" stop-color="#E9EEF6"/>
      <stop offset="0.48" stop-color="#9AA7BD"/>
      <stop offset="0.78" stop-color="#9AA7BD"/>
      <stop offset="1" stop-color="#5C6B86"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b222c" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#10151c" stop-opacity="0.7"/>
    </linearGradient>
    <pattern id="microgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E9EEF6" stroke-opacity="0.038"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" rx="30" fill="url(#bg)"/>
  <rect width="1280" height="720" rx="30" fill="url(#microgrid)"/>
  <rect x="1" y="1" width="1278" height="718" rx="29" fill="none" stroke="#9AA7BD" stroke-opacity="0.3"/>
