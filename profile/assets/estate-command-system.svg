        <text x="18" y="30" fill="#5EE7B7" font-size="12" font-weight="760" letter-spacing="2">UNDERSTAND</text>
        <text x="18" y="57" fill="#AAB5C2" font-size="14">Products, boundaries,</text><text x="18" y="78" fill="#AAB5C2" font-size="14">and operating outcomes.</text>
