    <path d="M205 12V42M411 12V42" stroke="#8C98A8" stroke-opacity="0.22"/>
    <text x="238" y="34" fill="#B5BFCA" font-size="13" letter-spacing="1.8">github.com/szl-holdings</text>
    <text x="445" y="34" fill="#B5BFCA" font-size="13" letter-spacing="1.8">huggingface.co/SZLHOLDINGS</text>
