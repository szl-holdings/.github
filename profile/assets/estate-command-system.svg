<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SZL governed AI command fabric</title>
  <desc id="desc">A restrained dark command surface with a pixel-built SZL mark, a holographic evidence chamber, and clear paths for decision makers, builders, and reviewers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A0E"/>
      <stop offset="0.58" stop-color="#0A1017"/>
      <stop offset="1" stop-color="#0C1118"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="0.55" stop-color="#E9E2D3"/>
      <stop offset="1" stop-color="#BEB7AA"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EE7B7"/>
      <stop offset="0.48" stop-color="#44B7FF"/>
      <stop offset="0.78" stop-color="#9B72F2"/>
      <stop offset="1" stop-color="#D9A85D"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17202A" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#0B1016" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#44B7FF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#44B7FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="microgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#C8D0DB" stroke-opacity="0.038"/>
    </pattern>
    <pattern id="pixels" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#071018" stroke-opacity="0.34"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" rx="30" fill="url(#bg)"/>
