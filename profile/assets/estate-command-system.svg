    <text x="2" y="190" fill="#C5CED9" font-size="22" font-weight="410">Frontier infrastructure for decisions that must</text>
    <text x="2" y="222" fill="#C5CED9" font-size="22" font-weight="410">remain bounded, inspectable, and reproducible.</text>

    <g transform="translate(0 260)">
