        <text x="18" y="30" fill="#69C7FF" font-size="12" font-weight="760" letter-spacing="2">BUILD</text>
        <text x="18" y="57" fill="#AAB5C2" font-size="14">Source, contracts,</text><text x="18" y="78" fill="#AAB5C2" font-size="14">tests, and quick starts.</text>
