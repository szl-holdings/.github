    <text x="34" y="510" fill="#a4b1c4" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'IBM Plex Mono', 'Liberation Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="2.2">BOUNDED ACTION / PORTABLE EVIDENCE</text>
