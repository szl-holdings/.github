        <text x="18" y="99" fill="#8491A0" font-size="12">Operate systems.</text>
      </g>
      <g transform="translate(166)">
        <rect width="154" height="122" rx="16" fill="url(#glass)" stroke="#44B7FF" stroke-opacity="0.27"/>
        <g fill="#44B7FF"><circle cx="28" cy="29" r="4"/><circle cx="48" cy="21" r="4"/><circle cx="50" cy="43" r="4"/><path d="M31 28l13-6M31 31l15 10M48 25l2 14" stroke="#44B7FF" stroke-width="2"/></g>
        <text x="18" y="76" fill="#E9E2D3" font-size="14" font-weight="720" letter-spacing="1.4">MODELS</text>
        <text x="18" y="99" fill="#8491A0" font-size="12">Reason with context.</text>
      </g>
      <g transform="translate(332)">
        <rect width="154" height="122" rx="16" fill="url(#glass)" stroke="#D9A85D" stroke-opacity="0.29"/>
        <g fill="none" stroke="#D9A85D" stroke-width="2"><path d="M22 22h32v32H22z"/><path d="M30 14v8M46 14v8M30 54v8M46 54v8M14 30h8M14 46h8M54 30h8M54 46h8"/></g>
        <text x="18" y="76" fill="#E9E2D3" font-size="14" font-weight="720" letter-spacing="1.4">KERNELS</text>
        <text x="18" y="99" fill="#8491A0" font-size="12">Execute efficiently.</text>
      </g>
      <g transform="translate(498)">
        <rect width="154" height="122" rx="16" fill="url(#glass)" stroke="#9B72F2" stroke-opacity="0.31"/>
        <path d="M22 23h32v30H22zM28 29h20M28 36h20M28 43h13" fill="none" stroke="#BA98FA" stroke-width="2"/>
        <text x="18" y="76" fill="#E9E2D3" font-size="14" font-weight="720" letter-spacing="1.4">EVIDENCE</text>
        <text x="18" y="99" fill="#8491A0" font-size="12">Prove what happened.</text>
