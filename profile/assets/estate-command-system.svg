        <g fill="none" stroke="#9AA7BD" stroke-width="2"><path d="M22 22h32v32H22z"/><path d="M30 14v8M46 14v8M30 54v8M46 54v8M14 30h8M14 46h8M54 30h8M54 46h8"/></g>
