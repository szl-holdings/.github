  <rect x="1" y="1" width="1278" height="718" rx="29" fill="none" stroke="#C9D2DE" stroke-opacity="0.16"/>
  <path d="M30 30H1250" stroke="url(#signal)" stroke-width="2" stroke-opacity="0.82"/>

