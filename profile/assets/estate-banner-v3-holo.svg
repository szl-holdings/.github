<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="SZL Holdings - sovereign governed AI; a tilted silver orbit with a single coral node; the estate that receipts its own thinking">
  <title>SZL Holdings — sovereign governed AI</title>
  <desc>Navy estate banner: a silver receipt orbit tilted -22 degrees with five receipt nodes, one coral node and the Lambda glyph; the orbit slowly drifts.</desc>
  <defs>
    <radialGradient id="holo-bg" cx="68%" cy="46%" r="75%">
      <stop offset="0%" stop-color="#0c1734"/>
      <stop offset="55%" stop-color="#030f29"/>
      <stop offset="100%" stop-color="#020913"/>
    </radialGradient>
    <linearGradient id="orbit-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c6b86" stop-opacity="0.15"/>
      <stop offset="30%" stop-color="#9aa7bd" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#e9eef6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5c6b86" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="holo-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#9aa7bd" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="node-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#holo-bg)"/>
  <rect width="1200" height="360" fill="url(#holo-scan)"/>

  <g transform="rotate(-22 600 190)">
    <ellipse cx="600" cy="190" rx="470" ry="125" fill="none" stroke="#9aa7bd" stroke-opacity="0.12" stroke-width="1"/>
    <ellipse cx="600" cy="190" rx="300" ry="80" fill="none" stroke="#9aa7bd" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="3 6"/>
    <ellipse id="receipt-orbit" cx="600" cy="190" rx="390" ry="105" fill="none" stroke="url(#orbit-fade)" stroke-width="1.6" stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="24s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g fill="#9aa7bd">
    <circle cx="247" cy="294" r="3"/>
    <circle cx="337" cy="209" r="3"/>
    <circle cx="499" cy="120" r="3"/>
    <circle cx="687" cy="49" r="3"/>
    <circle cx="894" cy="268" r="3"/>
  </g>
  <g fill="none" stroke="#9aa7bd" stroke-opacity="0.5" stroke-width="1">
    <circle cx="247" cy="294" r="6.5"/>
    <circle cx="337" cy="209" r="6.5"/>
    <circle cx="499" cy="120" r="6.5"/>
    <circle cx="687" cy="49" r="6.5"/>
    <circle cx="894" cy="268" r="6.5"/>
  </g>

  <g filter="url(#node-glow)">
    <circle cx="953" cy="86" r="6" fill="#df735f">
      <animate attributeName="opacity" values="1;0.82;1" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="953" cy="86" r="12" fill="none" stroke="#df735f" stroke-opacity="0.45" stroke-width="1">
      <animate attributeName="r" values="12;16;12" dur="24s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.45;0.1;0.45" dur="24s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(306 268)">
    <path d="M -9 8 L 0 -8 L 9 8 M -5 3 L 5 3" stroke="#e9eef6" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>

  <text x="72" y="166" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" letter-spacing="3" fill="#e9eef6">SZL HOLDINGS</text>
  <text x="74" y="202" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" letter-spacing="7" fill="#9aa7bd">SOVEREIGN GOVERNED AI</text>
  <text x="74" y="232" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#5c6b86">The estate that receipts its own thinking.</text>
  <text x="74" y="330" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', monospace" font-size="11" fill="#5c6b86"> governed models · receipted benchmarks · hash-chained evidence ledger · Λ = Conjecture 1 (open) </text>
</svg>
