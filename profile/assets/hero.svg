    <text x="535" y="210" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a4b1c4">Cryptographic proof</text>
    <text x="60" y="250" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#76859b">TypeScript &#x00B7; React &#x00B7; PostgreSQL &#x00B7; szlholdings.com</text>
