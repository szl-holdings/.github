<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280">
    <!-- SZL Kanchay v1.0.0 (tokens.json); literal hex because SVG cannot read CSS variables:
         #0a0f1e color-a11oy-bg, #10151c color-a11oy-deep, #f5f7fa color-a11oy-text,
         #c9d2df color-a11oy-text-sub, #a4b1c4 color-gray-300, #76859b color-a11oy-text-ghost,
         #d7b96b color-a11oy-gold (hatun-300), #e4cf99 gold-bright (hatun-200). -->
    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#0a0f1e"/>
        <stop offset="100%" style="stop-color:#10151c"/>
      </linearGradient>
      <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#d7b96b"/>
        <stop offset="100%" style="stop-color:#e4cf99"/>
      </linearGradient>
    </defs>
    <rect width="800" height="280" fill="url(#bg)" rx="12"/>
    <rect x="60" y="168" width="80" height="3" fill="url(#accent)" rx="1.5"/>
    <text x="60" y="100" font-family="'Space Grotesk', system-ui, sans-serif" font-size="42" font-weight="700" fill="#f5f7fa" letter-spacing="-1">SZL Holdings</text>
    <text x="60" y="145" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#c9d2df" letter-spacing="0.5">Governed AI decision infrastructure</text>
    <text x="60" y="210" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a4b1c4">Signal detection</text>
    <text x="194" y="210" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#76859b">&#x2192;</text>
    <text x="214" y="210" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a4b1c4">AI recommendation</text>
    <text x="370" y="210" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#76859b">&#x2192;</text>
    <text x="390" y="210" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a4b1c4">Human approval</text>
