<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">SZL Holdings — control before action, evidence after</title>
  <desc id="desc">A compact dark portfolio banner with a governed-loop trace connecting control and evidence.</desc>
  <!-- SZL KANCHAY v1.1.0, founder direction (szl-design-system.css sha256 9e5e6e3ae2a5).
