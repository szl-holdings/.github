<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="SZL governance substrate — receipt flow">
  <!-- SZL KANCHAY v1.1.1, founder direction (szl-design-system.css sha256 e05d19baa021).
       Literal token hex (SVG cannot read CSS variables):
       #030F29 bg token (color-space-900), #10151c color-gray-900
       #1b222c surface token (color-gray-800), #3c4757 border token (color-gray-600)
       #f5f7fa text token (color-gray-50), #a4b1c4 color-gray-300, #E9EEF6 color-silver-100
       #9AA7BD color-silver-300, #5C6B86 color-silver-500, #DF735F accent token (color-coral-400). -->
  <defs>
