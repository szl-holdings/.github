      .flow{ stroke-dasharray:10 8; animation:szl-flow 1.4s linear infinite; }
      @keyframes szl-flow{ to{ stroke-dashoffset:-36; } }
      @media (prefers-reduced-motion: reduce){ .flow{ animation:none; } }
      .foot{ font-size:11px; fill:#a4b1c4; font-family:ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'IBM Plex Mono', 'Liberation Mono', Menlo, Consolas, monospace; }
    </style>
