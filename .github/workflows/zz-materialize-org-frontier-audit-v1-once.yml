name: Materialize organization frontier audit v1 once

on:
  push:
    branches:
      - feat/org-frontier-audit-v1
    paths:
      - .github/workflows/zz-materialize-org-frontier-audit-v1-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/org-frontier-audit-v1
          fetch-depth: 1
      - name: Decode exact reviewed payload blob
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_BLOB: c87a5c5a7b5e1a1edcce229c738313e906c1aa6c
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${PAYLOAD_BLOB}" --jq .content \
            | tr -d '\n' | base64 --decode > /tmp/org-frontier-audit.tgz
          tar -xzf /tmp/org-frontier-audit.tgz -C .
      - name: Prove the materialized implementation
        run: |
          set -euo pipefail
          python -m unittest tests.test_audit_org_frontier -v
          python -m py_compile scripts/audit_org_frontier.py tests/test_audit_org_frontier.py
          python -m json.tool docs/architecture/org-frontier-authorities.v1.json >/dev/null
          git diff --check
      - name: Commit only durable audit controls
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-materialize-org-frontier-audit-v1-once.yml
          git add scripts/audit_org_frontier.py tests/test_audit_org_frontier.py docs/architecture/org-frontier-authorities.v1.json .github/workflows/org-frontier-audit.yml
          git config user.name "SZL Frontier Operator"
          git config user.email "stephenlutar2@gmail.com"
          git commit -m "feat(audit): install the organization frontier census" -m "Add a read-only authenticated audit of repository metadata, community health, workflows, action pinning, rulesets, branch protection, duplicates, vertical authority and the locked-eight formula contract." -m "Signed-off-by: Stephen P. Lutar Jr. <stephenlutar2@gmail.com>"
          git push origin HEAD:feat/org-frontier-audit-v1
