name: Repair kernel transport commit message

on:
  push:
    branches:
      - chore/native-solo-builder-provenance-20260831
    paths:
      - .github/workflows/repair-kernel-hub-commit-message.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repair-kernel-hub-commit-message
  cancel-in-progress: false

jobs:
  repair:
    name: Remove empty commit-message argument and verify transport
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Apply exact bounded repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/kernel_hub_git.py')
          text = path.read_text(encoding='utf-8')
          old = '''                            "Card/contract-only update; first-class build variants are preserved.",
                            "-m",
                        ],'''
          new = '''                            "Card/contract-only update; first-class build variants are preserved.",
                        ],'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one dangling commit-message argument')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          test "$(git diff --name-only)" = ".github/scripts/kernel_hub_git.py"
          git diff --check
          python3 -m py_compile \
            .github/scripts/kernel_hub_git.py \
            .github/scripts/test_kernel_hub_git.py
          PYTHONPATH=.github/scripts python3 .github/scripts/test_kernel_hub_git.py
          python3 .github/scripts/test_solo_builder_provenance.py
          python3 .github/scripts/verify_forge9_governance.py
          python3 .github/scripts/run_forge9_gate.py gate/verify-all

      - name: Commit tested permanent repair
        shell: bash
        env:
          BRANCH: chore/native-solo-builder-provenance-20260831
        run: |
          set -euo pipefail
          git config user.name 'SZL Governance Bot'
          git config user.email 'noreply@szlholdings.com'
          git add .github/scripts/kernel_hub_git.py
          git diff --cached --quiet && { echo 'Kernel transport already repaired.'; exit 0; }
          git commit -m 'fix(hf): remove empty Kernel card commit-message argument'
          git push origin "HEAD:${BRANCH}"
