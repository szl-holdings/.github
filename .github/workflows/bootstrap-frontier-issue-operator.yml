name: Bootstrap frontier issue operator

on:
  push:
    branches:
      - feat/frontier-issue-operator-v1-20260902
    paths:
      - ".github/workflows/bootstrap-frontier-issue-operator.yml"

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: bootstrap-frontier-issue-operator
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/frontier-issue-operator-v1-20260902
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prove the operator before promotion
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_frontier_issue_operator.py
          python -m py_compile .github/scripts/frontier_issue_operator.py
          git diff --check

      - name: Remove this one-shot controller from the candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-frontier-issue-operator.yml
          git config user.name "SZL Frontier Promotion Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add .github/workflows/bootstrap-frontier-issue-operator.yml
          git commit -s -m "chore(ops): remove one-shot frontier bootstrap"
          git push origin HEAD:feat/frontier-issue-operator-v1-20260902

      - name: Resolve the exact open pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head feat/frontier-issue-operator-v1-20260902 --json number --jq '.[0].number // empty')"
          test -n "$number"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Wait for all checks on the replacement head
        shell: bash
        run: |
          set -euo pipefail
          gh pr checks "${{ steps.pr.outputs.number }}" --repo "$GITHUB_REPOSITORY" --watch --fail-fast --interval 10

      - name: Merge through ordinary repository protection
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --subject "feat(ops): install the bounded frontier issue operator"
