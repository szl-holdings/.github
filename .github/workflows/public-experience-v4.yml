name: SZL Public Experience v4 Audience Readiness

on:
  pull_request:
    paths:
      - .github/scripts/audit_public_experience_v4.py
      - .github/tests/test_public_experience_v4.py
      - .github/workflows/public-experience-v4.yml
      - docs/PUBLIC_EXPERIENCE_V4.md
  push:
    branches: [main]
    paths:
      - .github/scripts/audit_public_experience_v4.py
      - .github/tests/test_public_experience_v4.py
      - .github/workflows/public-experience-v4.yml
      - docs/PUBLIC_EXPERIENCE_V4.md
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      soft:
        description: Record evidence without failing the run
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: public-experience-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Verify v4 audit source contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prove audit scope and no provider mutation
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==9.0.3'
          python -m pytest .github/tests/test_public_experience_v4.py -q
          python -m py_compile .github/scripts/audit_public_experience_v4.py
          git diff --check

  live-audit:
    name: Audit users, developers, investors, mobile, and zoom
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      REPORT_DIR: public-experience-v4
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned browser client
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Run the full read-only estate matrix
        id: audit
        shell: bash
        env:
          SOFT_INPUT: ${{ inputs.soft || false }}
        run: |
          set +e
          args=(--output-dir "$REPORT_DIR" --concurrency 3)
          if [ "$SOFT_INPUT" = true ]; then
            args+=(--soft)
          fi
          python .github/scripts/audit_public_experience_v4.py "${args[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload immutable browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-experience-v4-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-experience-v4/
          if-no-files-found: error
          retention-days: 180
      - name: Update current estate issue
        if: always()
        shell: bash
        env:
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}
        run: |
          set -euo pipefail
          test -f "$REPORT_DIR/public-experience-v4.md"
          test -f "$REPORT_DIR/public-experience-v4.json"
          title='Public Experience v4 — current audience readiness'
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "$title in:title" --json number,title --jq '.[] | select(.title == $title) | .number' --arg title "$title" | head -n1)"
          {
            echo '<!-- szl-public-experience-v4-current -->'
            cat "$REPORT_DIR/public-experience-v4.md"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/public-experience-v4-issue.md
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file /tmp/public-experience-v4-issue.md
            if [ "${AUDIT_EXIT:-2}" = 0 ]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed || true
            else
              gh issue reopen "$issue" --repo "$GITHUB_REPOSITORY" || true
            fi
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/public-experience-v4-issue.md
          fi
      - name: Enforce rendered estate contract
        if: always()
        shell: bash
        env:
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}
          SOFT_INPUT: ${{ inputs.soft || false }}
        run: |
          set -euo pipefail
          if [ "$SOFT_INPUT" != true ] && [ "${AUDIT_EXIT:-2}" -ne 0 ]; then
            exit "${AUDIT_EXIT:-2}"
          fi
