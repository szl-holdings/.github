name: SZL Public Experience v3

on:
  pull_request:
    paths:
      - "design/responsive-v3/**"
      - ".github/scripts/audit_public_experience_v3.py"
      - ".github/scripts/responsive_space_contract.py"
      - ".github/scripts/holographic_target_contract.py"
      - ".github/scripts/run_holographic_spaces_v2.py"
      - ".github/tests/test_public_experience_v3.py"
      - ".github/tests/test_responsive_space_contract.py"
      - ".github/tests/test_holographic_target_contract.py"
      - ".github/workflows/public-experience-v3.yml"
      - ".github/workflows/rollout-holographic-space-fabric-v2.yml"
      - "docs/PUBLIC_EXPERIENCE_V3.md"
  push:
    branches: [main]
    paths:
      - "design/responsive-v3/**"
      - ".github/scripts/audit_public_experience_v3.py"
      - ".github/scripts/responsive_space_contract.py"
      - ".github/scripts/holographic_target_contract.py"
      - ".github/scripts/run_holographic_spaces_v2.py"
      - ".github/tests/test_public_experience_v3.py"
      - ".github/tests/test_responsive_space_contract.py"
      - ".github/tests/test_holographic_target_contract.py"
      - ".github/workflows/public-experience-v3.yml"
      - ".github/workflows/rollout-holographic-space-fabric-v2.yml"
      - "docs/PUBLIC_EXPERIENCE_V3.md"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      target_regex:
        description: "Optional case-insensitive target filter"
        required: false
        type: string
        default: ""
      max_spaces:
        description: "Maximum public Hugging Face Spaces to audit"
        required: false
        type: number
        default: 100
  workflow_run:
    workflows:
      - Roll out Holographic Space Fabric v2
      - HF Living Constellation Operator
    types: [completed]

permissions:
  contents: read

concurrency:
  group: public-experience-v3-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  contract:
    name: Public Experience v3 offline contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile controllers
        run: >-
          python -m py_compile
          .github/scripts/audit_public_experience_v3.py
          .github/scripts/responsive_space_contract.py
          .github/scripts/holographic_target_contract.py
          .github/scripts/run_holographic_spaces_v2.py
      - name: Verify JavaScript syntax
        run: node --check design/responsive-v3/szl-responsive-v3.js
      - name: Run network-free contracts
        run: |
          python .github/tests/test_public_experience_v3.py
          python .github/tests/test_responsive_space_contract.py
          python .github/tests/test_holographic_target_contract.py
      - name: Whitespace integrity
        run: git diff --check

  live:
    name: Phone-to-theatre live browser audit
    needs: contract
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      issues: write
    env:
      REPORT_JSON: reports/public-experience-v3.json
      REPORT_MD: reports/public-experience-v3.md
      SCREENSHOTS: reports/public-experience-v3-screenshots
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install exact browser auditor
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: Audit both origins and every public Space
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p "$SCREENSHOTS"
          args=(
            --output "$REPORT_JSON"
            --markdown "$REPORT_MD"
            --screenshots-dir "$SCREENSHOTS"
            --max-spaces "${{ github.event_name == 'workflow_dispatch' && inputs.max_spaces || 100 }}"
            --concurrency 6
            --timeout-ms 30000
          )
          target_filter="${{ github.event_name == 'workflow_dispatch' && inputs.target_regex || '' }}"
          if [ -n "$target_filter" ]; then args+=(--target-regex "$target_filter"); fi
          python .github/scripts/audit_public_experience_v3.py "${args[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish readable summary
        if: always()
        run: |
          test -f "$REPORT_MD"
          cat "$REPORT_MD" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable responsive evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-experience-v3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.REPORT_JSON }}
            ${{ env.REPORT_MD }}
            ${{ env.SCREENSHOTS }}
          if-no-files-found: error
          retention-days: 90
      - name: Reconcile the exact runtime exception issue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$REPORT_JSON"
          title='[Public Experience v3] live responsive exceptions'
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "$title in:title" --json number,title --jq '.[] | select(.title == "[Public Experience v3] live responsive exceptions") | .number' | head -n1)"
          failed="$(python -c 'import json,os; print(json.load(open(os.environ["REPORT_JSON"]))["summary"]["failed_cases"])')"
          {
            echo '<!-- szl-public-experience-v3 -->'
            echo '# Public Experience v3 runtime receipt'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat "$REPORT_MD"
          } > /tmp/public-experience-v3-issue.md
          if [ "$failed" -gt 0 ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file /tmp/public-experience-v3-issue.md
              gh issue reopen "$number" --repo "$GITHUB_REPOSITORY" || true
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/public-experience-v3-issue.md
            fi
          elif [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file /tmp/public-experience-v3-issue.md
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed --comment 'All measured phone-through-theatre cases passed.' || true
          fi
      - name: Enforce the measured result
        if: always()
        shell: bash
        run: |
          code="${{ steps.audit.outputs.exit_code }}"
          test -n "$code"
          if [ "$code" -ne 0 ]; then
            echo "::error::Public Experience v3 live audit found exact runtime exceptions."
            exit "$code"
          fi
