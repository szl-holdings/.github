name: Public Estate Convergence

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/public_estate_convergence.py
      - tests/test_public_estate_convergence.py
      - .github/workflows/public-estate-convergence.yml
  push:
    branches: [main]
    paths:
      - .github/scripts/public_estate_convergence.py
      - tests/test_public_estate_convergence.py
      - .github/workflows/public-estate-convergence.yml
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      repair:
        description: Request only bounded deploy paths when live readback fails
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  REPORT_PATH: /tmp/public-estate-convergence-v2.json

concurrency:
  group: public-estate-convergence-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  contract:
    name: Convergence boundary contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Compile and run network-free contracts
        run: |
          python -I -P -m py_compile .github/scripts/public_estate_convergence.py tests/test_public_estate_convergence.py
          python -I -P tests/test_public_estate_convergence.py

      - name: Verify action pins and whitespace
        shell: bash
        run: |
          set -euo pipefail
          python -I -P <<'PY'
          from pathlib import Path
          import re

          text = Path(".github/workflows/public-estate-convergence.yml").read_text(encoding="utf-8")
          uses = re.findall(r"^\s*uses:\s*(\S+)\s*(?:#.*)?$", text, re.MULTILINE)
          bad = [value for value in uses if not re.fullmatch(r"[^@\s]+@[0-9a-f]{40}", value)]
          if bad:
              raise SystemExit(f"unpinned actions: {bad}")
          print("action pins: PASS")
          PY
          git diff --check

  converge:
    name: Verify and selectively repair both public origins
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      SZL_GITHUB_TOKEN: ${{ secrets.SZL_GITHUB_TOKEN || github.token }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout protected convergence policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Probe, request bounded repair, and read back
        id: converge
        shell: bash
        env:
          INPUT_REPAIR: ${{ github.event_name != 'workflow_dispatch' || inputs.repair }}
        run: |
          set +e
          args=(--report "$REPORT_PATH" --wait-seconds 360)
          if [ "$INPUT_REPAIR" = "true" ]; then args+=(--repair); fi
          python -I -P .github/scripts/public_estate_convergence.py "${args[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          printf '%s' "$code" > "$RUNNER_TEMP/public-estate-convergence-exit-code"
          exit 0

      - name: Publish exact origin summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -I -P <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8"))
          summary = report["summary"]
          print("## Canonical public origins")
          print()
          print(f"- Operational: **{summary['origins_operational']} / {summary['origins_total']}**")
          print(f"- Complete: **{summary['complete']}**")
          print()
          for row in report["after"]:
              print(
                  f"- `{row['name']}` — `{'OPERATIONAL' if row['operational'] else 'NOT PROVEN'}`; "
                  f"root `{row['root']['http_status']}`; surface probe `{row['spectral_asset']['http_status']}`; "
                  f"controller `{row['controller_asset']['http_status']}`; health `{row['advisory_health']['http_status']}`"
              )
          if report["repairs"]:
              print()
              print("### Repair requests")
              for row in report["repairs"]:
                  print(f"- `{row['origin']}` — `{row['action']}` / `{row['state']}`")
          PY

      - name: Emit the public-origin drift receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -I -P <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["REPORT_PATH"])
          report = json.loads(report_path.read_text(encoding="utf-8"))
          summary = report["summary"]
          complete = summary["complete"]
          if type(complete) is not bool:
              raise SystemExit("convergence complete flag is not a boolean")
          origins = []
          for row in report["after"]:
              origins.append(
                  {
                      "name": row["name"],
                      "operational": bool(row["operational"]),
                      "root_http_status": row["root"]["http_status"],
                      "surface_http_status": row["spectral_asset"]["http_status"],
                      "controller_http_status": row["controller_asset"]["http_status"],
                      "health_http_status": row["advisory_health"]["http_status"],
                  }
              )
          receipt = {
              "schema": "szl.public-origin-drift-receipt.v1",
              "issue_write": False,
              "permission": "contents: read",
              "complete": complete,
              "run_url": (
                  os.environ["GITHUB_SERVER_URL"]
                  + "/"
                  + os.environ["GITHUB_REPOSITORY"]
                  + "/actions/runs/"
                  + os.environ["GITHUB_RUN_ID"]
              ),
              "origins": origins,
              "dns_mutation": False,
              "cloudflare_mutation": False,
          }
          text = json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          destination = Path("/tmp/public-origin-drift.json")
          destination.write_text(text, encoding="utf-8")
          reread = json.loads(destination.read_text(encoding="utf-8"))
          if reread.get("issue_write") is not False or reread.get("complete") is not complete:
              raise SystemExit("drift receipt did not round-trip")
          print(text, end="")
          PY

      - name: Upload immutable convergence evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-estate-convergence-v2
          path: |
            ${{ env.REPORT_PATH }}
            /tmp/public-origin-drift.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce canonical origins
        if: always()
        shell: bash
        run: |
          code="$(cat "$RUNNER_TEMP/public-estate-convergence-exit-code")"
          test -n "$code"
          if [ "$code" -ne 0 ]; then
            echo "::error::One or more canonical origins were not proven operational; inspect the exact artifact."
            exit "$code"
          fi
