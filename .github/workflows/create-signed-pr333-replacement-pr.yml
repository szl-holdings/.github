name: Create Signed PR 333 Replacement — Controlled

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/create_signed_pr333_replacement.py
      - .github/workflows/create-signed-pr333-replacement-pr.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: create-signed-pr333-replacement-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  REPORT_PATH: reports/pr333-signed-tree-normalization.json

jobs:
  normalize:
    name: Exact-tree GitHub-signed replacement branch
    if: >-
      github.repository == 'szl-holdings/.github' &&
      github.event.pull_request.head.repo.full_name == 'szl-holdings/.github' &&
      github.event.pull_request.head.ref == 'diag/sign-pr333-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the exact diagnostic controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Compile and constrain the normalization envelope
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/create_signed_pr333_replacement.py
          python - <<'PY'
          from pathlib import Path

          source = Path(
              ".github/scripts/create_signed_pr333_replacement.py"
          ).read_text(encoding="utf-8")
          required = (
              "SOURCE_PR = 333",
              "ba8d7537960a730d6b2ff78853cfd0ab1254fa61",
              "8b5a09fa05cc98768b4d6004db52972b91b160b3",
              "createCommitOnBranch",
              "expectedHeadOid",
              "SIGNED_TREE_IDENTICAL",
              "candidate signature is not valid",
              "credential_value_recorded",
          )
          forbidden = (
              "mergePullRequest",
              "enqueuePullRequest",
              "statuses/",
              "check-runs/",
              "rulesets/",
              "branches/main/protection",
              '"force": True',
              "secrets/",
              "print(token",
              "len(token",
              "hashlib",
          )
          for marker in required:
              assert marker in source, marker
          for marker in forbidden:
              assert marker not in source, marker
          PY
          git diff --check

      - name: Create and verify the exact signed replacement
        id: normalization
        shell: bash
        run: |
          set +e
          python .github/scripts/create_signed_pr333_replacement.py
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable normalization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr333-signed-tree-normalization-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Enforce exact signed normalization
        if: always()
        env:
          EXIT_CODE: ${{ steps.normalization.outputs.exit_code }}
        run: |
          code="${EXIT_CODE:-2}"
          if [ "$code" -ne 0 ]; then
            echo "::error::PR #333 signed normalization failed closed. No source, protection, queue, or merge mutation was attempted."
            exit "$code"
          fi
          echo "PR #333 now has a tree-identical, exact-parent, GitHub-signed replacement branch."
