name: Inspect central DCO compatibility remnants

on:
  push:
    branches:
      - chore/native-solo-builder-provenance-20260831
    paths:
      - .github/workflows/inspect-central-dco-remnants.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    name: Inventory exact DCO references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Print bounded DCO reference inventory
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DCO filenames ==='
          find .github .governance -type f \( -iname '*dco*' -o -iname '*signoff*' \) -print | sort || true
          echo '=== DCO content references ==='
          grep -RInE --exclude='inspect-central-dco-remnants.yml' \
            'DCO|dco_check|test_dco|reusable-dco|doctrine-required-dco|Signed-off-by' \
            .github .governance WORKFLOWS.md CONTRIBUTING.md 2>/dev/null || true
