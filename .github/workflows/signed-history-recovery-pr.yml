name: Signed PR History Recovery — Controlled

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/rewrite_unsigned_pr_history.py
      - .github/workflows/signed-history-recovery-pr.yml

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: signed-pr-history-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  REPORT_PATH: reports/signed-pr-history-recovery.json
  TARGETS_JSON: >-
    [
      {
        "number": 322,
        "expected_head_sha": "a71c4e3cc3d46779243515a038cccdf5220cb951",
        "expected_base_sha": "a03122857a1bc77f348c3db01d0be00ca39e6d69",
        "headline": "fix(hf): serialize publication readiness and estate evidence"
      },
      {
        "number": 323,
        "expected_head_sha": "1f28f614f364bebd07e1dbf6e0cf8dac86d23227",
        "expected_base_sha": "a03122857a1bc77f348c3db01d0be00ca39e6d69",
        "headline": "fix(security): replace stale drift PAT with qillqaq app auth"
      }
    ]

jobs:
  recover:
    name: Exact-tree GitHub-signed snapshot replacement
    if: >-
      github.repository == 'szl-holdings/.github' &&
      github.event.pull_request.number == 324 &&
      github.event.pull_request.head.repo.full_name == 'szl-holdings/.github' &&
      github.event.pull_request.head.ref == 'diag/merge-queue-state-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the reviewed recovery controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Compile and statically constrain the controller
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/rewrite_unsigned_pr_history.py
          python - <<'PY'
          from pathlib import Path

          source = Path(
              ".github/scripts/rewrite_unsigned_pr_history.py"
          ).read_text(encoding="utf-8")
          required = (
              "createCommitOnBranch",
              "wasSignedByGitHub",
              "tree mismatch",
              "head moved",
              '"force": True',
              "expected_head_sha",
              "expected_base_sha",
          )
          forbidden = (
              "rulesets/",
              "branches/main/protection",
              "statuses/",
              "reviews",
              "secrets/",
              "actions/permissions",
          )
          for marker in required:
              assert marker in source, marker
          for marker in forbidden:
              assert marker not in source, marker
          PY
          git diff --check

      - name: Prepare, verify, and replace only the declared unsigned heads
        id: recovery
        shell: bash
        run: |
          set +e
          python .github/scripts/rewrite_unsigned_pr_history.py
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-pr-history-recovery-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish recovery summary
        if: always()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["REPORT_PATH"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Controlled signed-history recovery\n\n")
              if not path.exists():
                  out.write("- status: `FAILED_CLOSED`\n- evidence: missing\n")
              else:
                  report = json.loads(path.read_text(encoding="utf-8"))
                  out.write(f"- status: `{report.get('status')}`\n")
                  for target in report.get("targets", []):
                      out.write(
                          f"- PR #{target.get('pull_request')}: "
                          f"updated=`{target.get('updated')}`, "
                          f"tree_parity=`{target.get('tree_parity')}`, "
                          f"signed_commit=`{target.get('signed_commit_sha')}`\n"
                      )

      - name: Enforce the recovery result
        if: always()
        env:
          EXIT_CODE: ${{ steps.recovery.outputs.exit_code }}
        run: |
          code="${EXIT_CODE:-2}"
          if [ "$code" -ne 0 ]; then
            echo "::error::Controlled signed-history recovery failed closed. No protection was weakened."
            exit "$code"
          fi
          echo "Both declared PR branches now contain one tree-identical GitHub-signed commit."
