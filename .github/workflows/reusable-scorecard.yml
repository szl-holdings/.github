name: Reusable — OSSF Scorecard

# Runs the OpenSSF Scorecard against the repo and uploads results to the
# Security tab. Provides a public supply-chain hygiene score.
#
# NOTE: We deliberately do NOT include `branch_protection_rule` as a trigger
# in caller workflows because that event runs without a checked-out commit
# context and produces a `startup_failure` on the Scorecard analysis job.
# Use `schedule` + `push: branches: [main]` instead.

on:
  workflow_call:
    inputs:
      publish-results:
        description: 'Publish scorecard results to the public OSSF database'
        required: false
        type: boolean
        default: true

# Top-level permissions set to read-only; security-events/id-token granted at job level only.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish-results }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
