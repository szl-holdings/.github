name: Reusable — OSSF Scorecard

# Runs the OpenSSF Scorecard against the repo and uploads results to the
# Security tab. Provides a public supply-chain hygiene score.
#
# NOTE: We deliberately do NOT include `branch_protection_rule` as a trigger
# in caller workflows because that event runs without a checked-out commit
# context and produces a `startup_failure` on the Scorecard analysis job.
# Use `schedule` + `push: branches: [main]` instead.

on:
  workflow_call:
    inputs:
      publish-results:
        description: 'Publish scorecard results to the public OSSF database'
        required: false
        type: boolean
        default: true

# Top-level permissions set to read-only; security-events/id-token granted at job level only.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish-results }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
