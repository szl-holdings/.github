name: Reusable — Dependency Review

# Blocks PRs that introduce vulnerable dependencies or non-permissive licenses.
# Runs only on pull_request events.

on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: 'Lowest severity that fails the job (low, moderate, high, critical)'
        required: false
        type: string
        default: 'high'
      allow-licenses:
        description: 'Comma-separated SPDX license identifiers allowed in dependencies'
        required: false
        type: string
        default: 'Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, CC0-1.0, Unlicense, 0BSD, MPL-2.0, CC-BY-4.0, BlueOak-1.0.0, Python-2.0, Zlib'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          allow-licenses: ${{ inputs.allow-licenses }}
          comment-summary-in-pr: on-failure
