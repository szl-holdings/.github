name: Finalize Public Experience v3 branch

on:
  push:
    branches:
      - feat/public-experience-v3
    paths:
      - ".github/workflows/patch-public-experience-v3-branch.yml"

permissions:
  contents: write

concurrency:
  group: finalize-public-experience-v3-branch
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/public-experience-v3
          fetch-depth: 0
      - name: Install the focused test runner
        run: python -m pip install --disable-pip-version-check "pytest==8.4.2"
      - name: Apply the exact final source repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          operator = Path('.github/scripts/hf_living_constellation_operator.py')
          text = operator.read_text(encoding='utf-8')
          text = text.replace('\nimport sys\n', '\n')
          operator.write_text(text, encoding='utf-8')

          audit = Path('.github/scripts/audit_public_experience_v3.py')
          text = audit.read_text(encoding='utf-8')
          old = """    if (rect.width + 0.5 < 44 || rect.height + 0.5 < 44) {\n      smallTargets.push({"""
          new = """    const inlineProseLink = node.tagName === 'A' && style.display === 'inline' &&\n      Boolean(node.closest('p,li,dd,dt,figcaption,blockquote'));\n    if (!inlineProseLink && (rect.width + 0.5 < 44 || rect.height + 0.5 < 44)) {\n      smallTargets.push({"""
          if old not in text:
              raise SystemExit('touch-target audit patch point is missing')
          audit.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/patch-public-experience-v3-branch.yml
      - name: Verify the complete offline estate contract
        run: |
          python -m py_compile \
            .github/scripts/audit_public_experience_v3.py \
            .github/scripts/hf_living_constellation_operator.py \
            .github/scripts/responsive_space_contract.py \
            .github/scripts/holographic_target_contract.py \
            .github/scripts/run_holographic_spaces_v2.py
          node --check design/responsive-v3/szl-responsive-v3.js
          python .github/tests/test_public_experience_v3.py
          python .github/tests/test_responsive_space_contract.py
          python .github/tests/test_holographic_target_contract.py
          python tests/test_hf_living_constellation_operator.py
          git diff --check
      - name: Commit the exact signed branch finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SZL Public Experience Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add \
            .github/scripts/audit_public_experience_v3.py \
            .github/scripts/hf_living_constellation_operator.py \
            .github/workflows/patch-public-experience-v3-branch.yml
          git commit -s -m "fix(experience): finalize touch audit and operator hygiene"
          git push origin HEAD:feat/public-experience-v3
