name: Resolve Public Experience v3 review findings

on:
  push:
    branches:
      - feat/public-experience-v3
    paths:
      - ".github/workflows/fix-public-experience-v3-review.yml"

permissions:
  contents: write

concurrency:
  group: resolve-public-experience-v3-review-findings
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/public-experience-v3
          fetch-depth: 0
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check "pytest==8.4.2"
      - name: Apply behavior-preserving review cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/audit_public_experience_v3.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('\nimport sys\n', '\n')
          text = text.replace(
              'from typing import Any, Iterable, Mapping, Sequence',
              'from typing import Any, Mapping, Sequence',
          )
          text = text.replace(
              '        console_errors: list[str] = []\n',
              '        console_errors: list[str] = []\n        navigation_warnings: list[str] = []\n',
              1,
          )
          old = '''        try:\n            await page.wait_for_load_state("networkidle", timeout=min(timeout_ms, 5000))\n        except Exception:\n            pass\n'''
          new = '''        try:\n            await page.wait_for_load_state("networkidle", timeout=min(timeout_ms, 5000))\n        except Exception as exc:\n            # Live dashboards may retain intentional polling or streaming connections.\n            navigation_warnings.append(\n                f"networkidle not reached before bounded timeout: {exc}"[:500]\n            )\n'''
          if old not in text:
              raise SystemExit('bounded networkidle cleanup point is missing')
          text = text.replace(old, new, 1)
          old = '''        result.failures, result.warnings = classify_findings(\n            metrics,\n            touch=case.touch,\n            require_v3=target.require_v3,\n            page_errors=page_errors,\n        )\n'''
          new = old + '        result.warnings.extend(navigation_warnings)\n'
          if old not in text:
              raise SystemExit('warning aggregation point is missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-public-experience-v3-review.yml
      - name: Verify complete branch contract
        run: |
          python -m py_compile \
            .github/scripts/audit_public_experience_v3.py \
            .github/scripts/hf_living_constellation_operator.py \
            .github/scripts/responsive_space_contract.py \
            .github/scripts/holographic_target_contract.py \
            .github/scripts/run_holographic_spaces_v2.py
          node --check design/responsive-v3/szl-responsive-v3.js
          python .github/tests/test_public_experience_v3.py
          python .github/tests/test_responsive_space_contract.py
          python .github/tests/test_holographic_target_contract.py
          python tests/test_hf_living_constellation_operator.py
          git diff --check
      - name: Commit exact signed cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SZL Public Experience Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add \
            .github/scripts/audit_public_experience_v3.py \
            .github/workflows/fix-public-experience-v3-review.yml
          git commit -s -m "fix(audit): resolve Public Experience v3 review findings"
          git push origin HEAD:feat/public-experience-v3
