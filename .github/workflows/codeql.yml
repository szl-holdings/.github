name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for analyzable code
        id: check-code
        run: |
          # Check if there's any code to analyze
          JS_FILES=$(find . -name "*.js" -o -name "*.ts" -o -name "*.jsx" -o -name "*.tsx" 2>/dev/null | grep -v node_modules | grep -v ".git" | wc -l)
          echo "js_files=$JS_FILES" >> "$GITHUB_OUTPUT"
          echo "Found $JS_FILES JS/TS files"
      - name: Initialize CodeQL
        if: steps.check-code.outputs.js_files != '0'
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
      - name: Autobuild
        if: steps.check-code.outputs.js_files != '0'
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      - name: Perform CodeQL Analysis
        if: steps.check-code.outputs.js_files != '0'
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      - name: CodeQL skipped (no analyzable code)
        if: steps.check-code.outputs.js_files == '0'
        run: echo "No JavaScript/TypeScript files found — CodeQL analysis not applicable for this repo type."