name: Estate dead-man supervisor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: estate-deadman-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    name: Observe, confirm, incident, and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact scheduled default-branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Require exact schedule authority
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --porcelain)" = ""

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Re-prove dead-man contracts before live observation
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/estate_deadman.py tests/test_estate_deadman.py
          python -m unittest discover -s tests -p 'test_estate_deadman.py' -v
          python .github/scripts/estate_deadman.py \
            --offline-contract-only \
            --output reports/estate-deadman-contract.json
          git diff --check

      - name: Observe and reconcile the critical scheduled control planes
        id: supervisor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python .github/scripts/estate_deadman.py \
            --output reports/estate-deadman.json
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write operator summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('reports/estate-deadman.json')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as stream:
              stream.write('# SZL estate dead-man\n\n')
              if not path.exists():
                  stream.write('The supervisor receipt was not produced.\n')
                  raise SystemExit(0)
              report = json.loads(path.read_text(encoding='utf-8'))
              stream.write(f"- Confirmed healthy: `{report.get('confirmed_healthy')}`\n")
              stream.write(
                  f"- Healthy targets: `{report.get('healthy_target_count', 0)}/"
                  f"{report.get('target_count', 0)}`\n"
              )
              stream.write(f"- Samples: `{report.get('sample_count', 0)}`\n")
              stream.write(
                  f"- Incident action: `{(report.get('incident') or {}).get('action', 'UNAVAILABLE')}`\n"
              )
              stream.write(
                  f"- Receipt SHA-256: `{report.get('receipt_sha256', 'UNAVAILABLE')}`\n\n"
              )
              stream.write('| Target | State | Latest run | Conclusion | Success age |\n')
              stream.write('|---|---|---:|---|---:|\n')
              for row in report.get('final_sample', []):
                  age = row.get('success_age_minutes')
                  stream.write(
                      f"| {row.get('id')} | {row.get('state')} | "
                      f"{row.get('latest_run_id') or '—'} | "
                      f"{row.get('latest_conclusion') or row.get('latest_status') or '—'} | "
                      f"{str(age) + 'm' if age is not None else '—'} |\n"
                  )
          PY

      - name: Upload immutable supervisor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: estate-deadman-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/estate-deadman-contract.json
            reports/estate-deadman.json
            reports/estate-deadman.json.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Require a confirmed healthy control plane
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schema == "szl.estate-deadman-receipt/v1"' reports/estate-deadman.json >/dev/null
          jq -e '.secret_values_recorded == false' reports/estate-deadman.json >/dev/null
          jq -e '.authority.workflow_mutation == false and .authority.deployment_mutation == false' reports/estate-deadman.json >/dev/null
          jq -e '.incident.ok == true' reports/estate-deadman.json >/dev/null
          jq -e '.confirmed_healthy == true' reports/estate-deadman.json >/dev/null
