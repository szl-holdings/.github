name: Apply org-card alignment P1 once

on:
  push:
    branches:
      - feat/estate-alignment-current-main-20260905
    paths:
      - .github/workflows/_apply_org_card_alignment_once.yml

permissions:
  contents: write

concurrency:
  group: apply-org-card-alignment-p1-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'szl-holdings/.github' && github.ref == 'refs/heads/feat/estate-alignment-current-main-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact successor head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/estate-alignment-current-main-20260905
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded org-card source-binding repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/feat/estate-alignment-current-main-20260905 | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path

          script_path = Path('.github/scripts/estate_alignment_contract.py')
          text = script_path.read_text(encoding='utf-8')

          old = 'RUNTIME_BINDING_PATHS = ("/api/build-info", "/deployment.json")\nRUNTIME_OBSERVATIONS = 2\n'
          new = '''RUNTIME_BINDING_PATHS = ("/api/build-info", "/deployment.json")
          ORG_CARD_SPACE_ID = "SZLHOLDINGS/README"
          ORG_CARD_SOURCE_REPOSITORY = "szl-holdings/.github"
          ORG_CARD_ORIGIN = "https://szlholdings-readme.static.hf.space"
          ORG_CARD_BINDING_PATHS = ("/deployment.json",)
          RUNTIME_OBSERVATIONS = 2
          '''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('runtime constants insertion point changed')
          text = text.replace(old, new, 1)

          old = '''    origin = runtime_origin(repo_id)
              attempts: list[dict[str, Any]] = []
              for path in RUNTIME_BINDING_PATHS:
          '''.replace('              ', '')
          new = '''    configured_origin = row.get("runtime_origin")
              raw_binding_paths = row.get("binding_paths")
              if repo_id == ORG_CARD_SPACE_ID:
                  if repository != ORG_CARD_SOURCE_REPOSITORY:
                      raise AlignmentError("organization-card deployment source must be .github")
                  if configured_origin != ORG_CARD_ORIGIN:
                      raise AlignmentError("organization-card binding must use the exact static origin")
                  if raw_binding_paths != list(ORG_CARD_BINDING_PATHS):
                      raise AlignmentError("organization-card binding must use deployment.json only")
                  origin = ORG_CARD_ORIGIN
                  binding_paths = ORG_CARD_BINDING_PATHS
              else:
                  if configured_origin is not None or raw_binding_paths is not None:
                      raise AlignmentError("custom runtime binding is reserved for the organization card")
                  origin = runtime_origin(repo_id)
                  binding_paths = RUNTIME_BINDING_PATHS
              url_origin(origin)
              attempts: list[dict[str, Any]] = []
              for path in binding_paths:
          '''.replace('              ', '')
          if text.count(old) != 1:
              raise SystemExit('runtime source-binding insertion point changed')
          text = text.replace(old, new, 1)

          marker = '\n\ndef canonical_repositories(contract: Mapping[str, Any]) -> set[str]:\n'
          helper = '''

          def org_card_runtime_row() -> dict[str, Any]:
              """Return the static organization-card control surface outside portfolio count."""
              return {
                  "repo_id": ORG_CARD_SPACE_ID,
                  "class": "organization_card_control_surface",
                  "canonical_source": ORG_CARD_SOURCE_REPOSITORY,
                  "deployment_source": ORG_CARD_SOURCE_REPOSITORY,
                  "runtime_origin": ORG_CARD_ORIGIN,
                  "binding_paths": list(ORG_CARD_BINDING_PATHS),
                  "portfolio_member": False,
              }
          '''.replace('          ', '')
          if text.count(marker) != 1:
              raise SystemExit('org-card helper insertion point changed')
          text = text.replace(marker, helper + marker, 1)

          old = '''    runtime_rows = list(
                  contract["huggingface_inventory_snapshot"]["portfolio_spaces"]
              )
          '''.replace('          ', '')
          new = '''    runtime_rows = list(
                  contract["huggingface_inventory_snapshot"]["portfolio_spaces"]
              )
              runtime_rows.append(org_card_runtime_row())
          '''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('live runtime-row insertion point changed')
          text = text.replace(old, new, 1)
          script_path.write_text(text, encoding='utf-8')

          test_path = Path('.github/scripts/test_estate_alignment_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '    def test_inconsistent_runtime_observations_fail_closed(self) -> None:\n'
          method = '''    def test_org_card_uses_static_deployment_receipt_and_fails_closed(self) -> None:
              row = alignment.org_card_runtime_row()
              expected = "9" * 40
              requested: list[tuple[str, str | None]] = []

              def good_fetch(url: str, **kwargs) -> bytes:
                  requested.append((url, kwargs.get("required_origin")))
                  parsed = alignment.urllib.parse.urlsplit(url)
                  self.assertEqual(parsed.netloc, "szlholdings-readme.static.hf.space")
                  self.assertEqual(parsed.path, "/deployment.json")
                  return json.dumps(
                      {
                          "source": {
                              "repository": "szl-holdings/.github",
                              "revision": expected,
                          }
                      }
                  ).encode()

              observation = alignment.runtime_source_binding(row, expected, fetch=good_fetch)
              self.assertTrue(observation["matched"])
              self.assertEqual(observation["binding_path"], "/deployment.json")
              self.assertEqual(len(requested), alignment.RUNTIME_OBSERVATIONS)
              self.assertTrue(
                  all(origin == alignment.ORG_CARD_ORIGIN for _, origin in requested)
              )

              missing = alignment.runtime_source_binding(
                  row,
                  expected,
                  fetch=lambda *_args, **_kwargs: (_ for _ in ()).throw(OSError("missing")),
              )
              self.assertFalse(missing["matched"])

              stale = alignment.runtime_source_binding(
                  row,
                  expected,
                  fetch=lambda *_args, **_kwargs: json.dumps(
                      {
                          "source": {
                              "repository": "szl-holdings/.github",
                              "revision": "8" * 40,
                          }
                      }
                  ).encode(),
              )
              self.assertFalse(stale["matched"])
              self.assertEqual(stale["observed_revision"], "8" * 40)

              revisions = iter((expected, "7" * 40))
              conflicting = alignment.runtime_source_binding(
                  row,
                  expected,
                  fetch=lambda *_args, **_kwargs: json.dumps(
                      {
                          "source": {
                              "repository": "szl-holdings/.github",
                              "revision": next(revisions),
                          }
                      }
                  ).encode(),
              )
              self.assertFalse(conflicting["matched"])
              self.assertFalse(conflicting["attempts"][0]["stable"])

              wrong_origin = dict(row)
              wrong_origin["runtime_origin"] = "https://szlholdings-readme.hf.space"
              with self.assertRaisesRegex(alignment.AlignmentError, "exact static origin"):
                  alignment.runtime_source_binding(wrong_origin, expected, fetch=good_fetch)

              wrong_path = dict(row)
              wrong_path["binding_paths"] = ["/api/build-info"]
              with self.assertRaisesRegex(alignment.AlignmentError, "deployment.json only"):
                  alignment.runtime_source_binding(wrong_path, expected, fetch=good_fetch)

          '''.replace('          ', '')
          if tests.count(marker) != 1:
              raise SystemExit('org-card test insertion point changed')
          tests = tests.replace(marker, method + marker, 1)

          tests = tests.replace(
              '"https://szlholdings-terra.hf.space/deployment.json",\n                attempts=1,\n                required_origin="https://szlholdings-terra.hf.space",',
              'alignment.ORG_CARD_ORIGIN + "/deployment.json",\n                attempts=1,\n                required_origin=alignment.ORG_CARD_ORIGIN,',
          )
          tests = tests.replace(
              'self.assertEqual(set(seen), alignment.EXPECTED_PORTFOLIO_SPACES)\n        self.assertEqual(len(observation["runtime_source_bindings"]), 16)',
              'self.assertEqual(\n            set(seen), alignment.EXPECTED_PORTFOLIO_SPACES | {alignment.ORG_CARD_SPACE_ID}\n        )\n        self.assertEqual(len(observation["runtime_source_bindings"]), 17)',
          )
          old_order = '''            [
                      row["repo_id"]
                      for row in self.contract["huggingface_inventory_snapshot"][
                          "portfolio_spaces"
                      ]
                  ],
          '''.replace('          ', '')
          new_order = '''            [
                      row["repo_id"]
                      for row in self.contract["huggingface_inventory_snapshot"][
                          "portfolio_spaces"
                      ]
                  ]
                  + [alignment.ORG_CARD_SPACE_ID],
          '''.replace('          ', '')
          if tests.count(old_order) != 1:
              raise SystemExit('runtime evidence ordering assertion changed')
          tests = tests.replace(old_order, new_order, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Prove bounded repair offline
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            .github/scripts/estate_alignment_contract.py \
            .github/scripts/test_estate_alignment_contract.py
          python .github/scripts/test_estate_alignment_contract.py
          git diff --check

      - name: Commit verified repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/estate-alignment-current-main-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git rm .github/workflows/_apply_org_card_alignment_once.yml
          git add \
            .github/scripts/estate_alignment_contract.py \
            .github/scripts/test_estate_alignment_contract.py
          git diff --cached --check
          git config user.name 'Lutar, Stephen P.'
          git config user.email 'stephenlutar2@gmail.com'
          git commit -s -m 'fix(alignment): source-bind the org-card control surface'
          git push origin "HEAD:refs/heads/$branch"
