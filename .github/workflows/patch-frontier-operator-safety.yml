name: Patch frontier operator safety contracts

on:
  push:
    branches:
      - feat/frontier-issue-operator-v1-20260902
    paths:
      - ".github/workflows/patch-frontier-operator-safety.yml"

permissions:
  contents: write

concurrency:
  group: patch-frontier-operator-safety-v1
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/frontier-issue-operator-v1-20260902
          fetch-depth: 0

      - name: Apply fail-closed repository and label boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path(".github/scripts/frontier_issue_operator.py")
          source = source_path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one old block, found {count}")
              return text.replace(old, new, 1)

          source = replace_once(
              source,
              '''    def add_label(self, full_name: str, number: int, label: str) -> None:
                  if not self.apply:
                      return
                  self.ensure_label(full_name, label)
                  self.request(
                      "POST",
                      f"/repos/{full_name}/issues/{number}/labels",
                      {"labels": [label]},
                      expected=(200,),
                  )
          ''',
              '''    def set_classification(
                  self,
                  full_name: str,
                  number: int,
                  label: str,
                  existing_labels: Iterable[str],
              ) -> None:
                  """Preserve human labels while enforcing exactly one estate label."""
                  if not self.apply:
                      return
                  self.ensure_label(full_name, label)
                  preserved = [
                      name
                      for name in existing_labels
                      if name and not name.startswith("estate:")
                  ]
                  labels = sorted(set([*preserved, label]))
                  self.request(
                      "PATCH",
                      f"/repos/{full_name}/issues/{number}",
                      {"labels": labels},
                      expected=(200,),
                  )
          ''',
              "classification replacement",
          )

          source = replace_once(
              source,
              '''        result, _headers, _status = self.request(
                  "POST",
                  f"/repos/{org}/.github/issues",
                  {"title": COMMAND_CENTER_TITLE, "body": body, "labels": ["estate:execution-ledger"]},
                  expected=(201,),
              )
          ''',
              '''        self.ensure_label(f"{org}/.github", "estate:execution-ledger")
                  result, _headers, _status = self.request(
                  "POST",
                  f"/repos/{org}/.github/issues",
                  {"title": COMMAND_CENTER_TITLE, "body": body, "labels": ["estate:execution-ledger"]},
                  expected=(201,),
              )
          ''',
              "command-center label admission",
          )

          source = replace_once(
              source,
              '''    by_fingerprint: dict[str, list[dict[str, Any]]] = defaultdict(list)
              for row in raw:
                  fingerprint = issue_fingerprint(str(row.get("title") or ""), row.get("body"))
                  if fingerprint:
                      by_fingerprint[fingerprint].append(row)

              canonical_for: dict[str, dict[str, Any]] = {}
              for fingerprint, group in by_fingerprint.items():
          ''',
              '''    # Duplicate closure is repository-local. Identical text can represent an
              # independently valid defect when filed against two different components.
              by_fingerprint: dict[tuple[str, str], list[dict[str, Any]]] = defaultdict(list)
              for row in raw:
                  repository = repository_from_api_url(str(row["repository_url"]))
                  fingerprint = issue_fingerprint(str(row.get("title") or ""), row.get("body"))
                  if fingerprint:
                      by_fingerprint[(repository, fingerprint)].append(row)

              canonical_for: dict[tuple[str, str], dict[str, Any]] = {}
              for fingerprint, group in by_fingerprint.items():
          ''',
              "repository-local duplicate grouping",
          )

          source = replace_once(
              source,
              '''            canonical = canonical_for.get(fingerprint or "")
          ''',
              '''            canonical = canonical_for.get((repository, fingerprint or ""))
          ''',
              "repository-local canonical lookup",
          )

          source = replace_once(
              source,
              '''                api.add_label(repository, state.number, classification)
                  state.action = "WOULD_CLASSIFY" if not api.apply else "CLASSIFIED"
          ''',
              '''                api.set_classification(
                      repository, state.number, classification, labels
                  )
                  state.action = "WOULD_CLASSIFY" if not api.apply else "CLASSIFIED"
          ''',
              "single classification call",
          )

          source_path.write_text(source, encoding="utf-8", newline="\n")

          test_path = Path("tests/test_frontier_issue_operator.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace("assert api.add_label.call_count == 2", "assert api.set_classification.call_count == 2")
          marker = "def test_identical_issues_in_different_repositories_are_not_closed()"
          if marker not in tests:
              tests += r'''


def test_identical_issues_in_different_repositories_are_not_closed() -> None:
    api = mock.create_autospec(operator.GitHub, instance=True)
    api.apply = True
    body = "This exact long issue text is valid independently for two repository components."
    api.search.return_value = [
        {
            "repository_url": "https://api.github.com/repos/szl-holdings/alpha",
            "number": 1,
            "title": "Same component defect",
            "body": body,
            "html_url": "https://github.com/szl-holdings/alpha/issues/1",
            "updated_at": "2026-09-01T00:00:00Z",
            "labels": [],
        },
        {
            "repository_url": "https://api.github.com/repos/szl-holdings/beta",
            "number": 1,
            "title": "Same component defect",
            "body": body,
            "html_url": "https://github.com/szl-holdings/beta/issues/1",
            "updated_at": "2026-09-02T00:00:00Z",
            "labels": [],
        },
    ]
    rows = operator.reconcile_issues(api, "szl-holdings", limit=10)
    assert all(row.action == "CLASSIFIED" for row in rows)
    api.close_duplicate.assert_not_called()
    assert api.set_classification.call_count == 2


def test_classification_replaces_stale_estate_labels_and_preserves_human_labels() -> None:
    api = operator.GitHub("test-token", apply=True)
    api.ensure_label = mock.Mock()
    api.request = mock.Mock(return_value=({}, {}, 200))
    api.set_classification(
        "szl-holdings/example",
        9,
        "estate:runtime-drift",
        ["bug", "estate:backlog", "estate:code-actionable"],
    )
    api.ensure_label.assert_called_once_with(
        "szl-holdings/example", "estate:runtime-drift"
    )
    api.request.assert_called_once_with(
        "PATCH",
        "/repos/szl-holdings/example/issues/9",
        {"labels": ["bug", "estate:runtime-drift"]},
        expected=(200,),
    )
'''
          test_path.write_text(tests, encoding="utf-8", newline="\n")
          PY

      - name: Run complete operator contracts
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_frontier_issue_operator.py
          python -m py_compile .github/scripts/frontier_issue_operator.py
          git diff --check

      - name: Commit repaired candidate and remove one-shot controller
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-frontier-operator-safety.yml
          git config user.name "SZL Frontier Safety Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git commit -s -m "fix(ops): constrain duplicate closure and estate labels"
          git push origin HEAD:feat/frontier-issue-operator-v1-20260902
