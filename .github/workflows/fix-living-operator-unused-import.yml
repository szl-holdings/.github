name: Fix Living Constellation operator import

on:
  push:
    branches:
      - feat/living-constellation-operational-v2
    paths:
      - ".github/workflows/fix-living-operator-unused-import.yml"

permissions:
  contents: write

concurrency:
  group: fix-living-operator-unused-import
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/living-constellation-operational-v2
          fetch-depth: 0
      - name: Remove the dead import and verify the operator
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^import sys$/d' .github/scripts/hf_living_constellation_operator.py
          python -m py_compile .github/scripts/hf_living_constellation_operator.py tests/test_hf_living_constellation_operator.py
          python -m pytest -q tests/test_hf_living_constellation_operator.py
          rm .github/workflows/fix-living-operator-unused-import.yml
          git diff --check
      - name: Commit the exact reviewed repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SZL Living Constellation Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add .github/scripts/hf_living_constellation_operator.py .github/workflows/fix-living-operator-unused-import.yml
          git commit -s -m "fix(hf): remove unused operator import"
          git push origin HEAD:feat/living-constellation-operational-v2
