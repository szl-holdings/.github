name: Apply final frontier operator review fixes

on:
  push:
    branches:
      - feat/frontier-issue-operator-v1-20260902
    paths:
      - .github/workflows/patch-frontier-operator-final.yml

permissions:
  contents: write

concurrency:
  group: patch-frontier-operator-final
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/frontier-issue-operator-v1-20260902
          fetch-depth: 0

      - name: Apply bounded code corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script = Path('.github/scripts/frontier_issue_operator.py')
          source = script.read_text(encoding='utf-8')
          old = 'import os\nimport re\nimport sys\nimport time\n'
          new = 'import os\nimport re\nimport time\n'
          if old in source:
              source = source.replace(old, new, 1)
          if 'import sys\n' in source:
              raise SystemExit('unexpected remaining sys import')
          script.write_text(source, encoding='utf-8')

          tests = Path('tests/test_frontier_issue_operator.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = '\ndef test_source_contains_no_protection_visibility_archive_or_secret_mutation() -> None:\n'
          addition = '''\ndef test_workflow_accepts_the_established_org_token_alias() -> None:\n    workflow = (ROOT / ".github" / "workflows" / "frontier-issue-operator.yml").read_text(encoding="utf-8")\n    assert "secrets.SZL_GITHUB_TOKEN" in workflow\n    assert "github.token" in workflow\n\n\n'''
          if marker not in test_text:
              raise SystemExit('test insertion marker is missing')
          if 'test_workflow_accepts_the_established_org_token_alias' not in test_text:
              test_text = test_text.replace(marker, addition + marker, 1)
          tests.write_text(test_text, encoding='utf-8')
          PY

      - name: Verify exact candidate
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_frontier_issue_operator.py
          python -m py_compile .github/scripts/frontier_issue_operator.py
          git diff --check

      - name: Commit reviewed code corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SZL Frontier Operator Review Fix'
          git config user.email 'stephenlutar2@gmail.com'
          git add .github/scripts/frontier_issue_operator.py \
                  tests/test_frontier_issue_operator.py
          if git diff --cached --quiet; then
            echo 'No code correction remained to commit.'
            exit 0
          fi
          git commit -m 'fix(ops): clear frontier operator review finding' \
            -m 'Remove the unused import and lock the established organization token alias in the operator contract.' \
            -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:feat/frontier-issue-operator-v1-20260902
