name: SZL Responsive Estate v3

on:
  pull_request:
    paths:
      - "scripts/audit_responsive_estate_v3.mjs"
      - "scripts/normalize_responsive_estate_v31.mjs"
      - "scripts/responsive_audit_policy_v31.mjs"
      - "tests/test_responsive_audit_policy_v31.mjs"
      - "tests/test_responsive_probe_v31.mjs"
      - ".github/workflows/responsive-estate-v3.yml"
  merge_group:
  push:
    branches: [main]
    paths:
      - "scripts/audit_responsive_estate_v3.mjs"
      - "scripts/normalize_responsive_estate_v31.mjs"
      - "scripts/responsive_audit_policy_v31.mjs"
      - "tests/test_responsive_audit_policy_v31.mjs"
      - "tests/test_responsive_probe_v31.mjs"
      - ".github/workflows/responsive-estate-v3.yml"
  schedule:
    - cron: "17 4,16 * * *"
  workflow_dispatch:

# Reports have no source-rollout, merge, issue, or provider mutation authority.
permissions:
  contents: read

concurrency:
  group: szl-responsive-estate-v3-${{ github.ref }}
  cancel-in-progress: false

env:
  LIVE_RAW_JSON: reports/responsive-estate-v3-live-raw.json
  LIVE_JSON: reports/responsive-estate-v3-live.json
  LIVE_HTML: reports/responsive-estate-v3-live.html
  LIVE_EVIDENCE: reports/responsive-estate-v3-evidence

jobs:
  contract:
    name: Responsive browser evidence contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Run fail-closed policy and CLI contracts
        run: |
          set -euo pipefail
          node --check scripts/audit_responsive_estate_v3.mjs
          node --check scripts/normalize_responsive_estate_v31.mjs
          node --check scripts/responsive_audit_policy_v31.mjs
          node --test tests/test_responsive_audit_policy_v31.mjs
          git diff --check

      - name: Install exact browser harness
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify real DOM observation semantics without public requests
        run: node --test tests/test_responsive_probe_v31.mjs

  browser-audit:
    name: Read-only browser audit of public origins and Spaces
    needs: contract
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install exact browser harness
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Measure broad public geometry
        id: raw
        run: |
          set +e
          rm -f "$LIVE_RAW_JSON" "$LIVE_JSON" "$LIVE_HTML"
          node scripts/audit_responsive_estate_v3.mjs \
            --json-out "$LIVE_RAW_JSON" \
            --html-out /tmp/responsive-estate-v3-raw.html \
            --evidence-dir "$LIVE_EVIDENCE" \
            --concurrency 3
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Normalize observed failures and supported warnings
        id: live
        run: |
          set +e
          node scripts/normalize_responsive_estate_v31.mjs \
            --input "$LIVE_RAW_JSON" \
            --json-out "$LIVE_JSON" \
            --html-out "$LIVE_HTML"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: responsive-estate-v3-live
          path: |
            ${{ env.LIVE_RAW_JSON }}
            ${{ env.LIVE_JSON }}
            ${{ env.LIVE_HTML }}
            ${{ env.LIVE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 90

      - name: Enforce complete measured evidence
        if: always()
        env:
          RAW_EXIT: ${{ steps.raw.outputs.exit_code }}
          NORMALIZED_EXIT: ${{ steps.live.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ "$RAW_EXIT" != "0" ] && [ "$RAW_EXIT" != "1" ]; then
            echo "::error::The browser probe did not complete."
            exit 1
          fi
          if [ "$NORMALIZED_EXIT" != "0" ]; then
            echo "::error::Responsive evidence is incomplete or contains blocking failures."
            exit 1
          fi
