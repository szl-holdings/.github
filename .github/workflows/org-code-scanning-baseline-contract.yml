name: Organization CodeQL baseline contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/org_code_scanning_baseline_v2.py"
      - ".github/workflows/org-code-scanning-baseline.yml"
      - ".github/workflows/org-code-scanning-baseline-contract.yml"
      - "tests/test_org_code_scanning_baseline_v2.py"
  push:
    branches: [main]
    paths:
      - ".github/scripts/org_code_scanning_baseline_v2.py"
      - ".github/workflows/org-code-scanning-baseline.yml"
      - ".github/workflows/org-code-scanning-baseline-contract.yml"
      - "tests/test_org_code_scanning_baseline_v2.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Native setup only; existing analyses preserved
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run network-free CodeQL operator contracts
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_org_code_scanning_baseline_v2.py
          python -m py_compile .github/scripts/org_code_scanning_baseline_v2.py

      - name: Validate the workflow authority and mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path(".github/workflows/org-code-scanning-baseline.yml").read_text(encoding="utf-8")
          artifact_template = (
              "org-code-scanning-baseline-$"
              + "{{ github.run_id }}-$"
              + "{{ github.run_attempt }}"
          )
          token_chain = (
              "secrets.SZL_ORG_ADMIN_TOKEN || secrets.ORG_ADMIN_TOKEN || "
              "secrets.SZL_GITHUB_TOKEN || secrets.GH_PAT || github.token"
          )
          required = (
              "permissions: read-all",
              "python .github/scripts/org_code_scanning_baseline_v2.py",
              "--apply",
              "if-no-files-found: error",
              artifact_template,
              token_chain,
          )
          permission_block = re.search(
              r"^  converge:\n    permissions:\n((?:      [^\n]+\n)+)",
              workflow,
              flags=re.MULTILINE,
          )
          expected_permissions = {"contents": "read", "issues": "write", "security-events": "write"}
          actual_permissions = (
              dict(line.strip().split(": ", 1) for line in permission_block.group(1).splitlines())
              if permission_block else {}
          )
          if actual_permissions != expected_permissions:
              raise SystemExit("CodeQL converge job permissions differ from the explicit boundary")
          for token in required:
              if workflow.count(token) != 1:
                  raise SystemExit(f"missing or repeated CodeQL workflow contract: {token}")
          for forbidden in (
              "continue-on-error: true",
              "|| true",
              "permissions: write-all",
              "contents: write",
              "pull-requests: write",
          ):
              if forbidden in workflow:
                  raise SystemExit(f"forbidden CodeQL workflow weakening: {forbidden}")
          PY

      - name: Restrict mutation to native default setup and command issue
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E '/branches/.*/protection|/rulesets|/git/refs|actions/secrets|dependabot/secrets|codespaces/secrets|"(visibility|private|archived)"[[:space:]]*:' \
            .github/scripts/org_code_scanning_baseline_v2.py
          grep -F '/code-scanning/default-setup' .github/scripts/org_code_scanning_baseline_v2.py

      - name: Diff hygiene
        run: git diff --check
