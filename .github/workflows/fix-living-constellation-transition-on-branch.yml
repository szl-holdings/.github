name: Fix Living Constellation transition handling

on:
  push:
    branches:
      - fix/living-constellation-transition-state
    paths:
      - ".github/workflows/fix-living-constellation-transition-on-branch.yml"

permissions:
  contents: write

concurrency:
  group: fix-living-constellation-transition-state
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/living-constellation-transition-state
          fetch-depth: 0
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check "pytest==8.4.2"
      - name: Apply exact operator and workflow repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          operator = Path('.github/scripts/hf_living_constellation_operator.py')
          text = operator.read_text(encoding='utf-8')
          text = text.replace(
              '        "APP_STARTING",\n        "CREATING",',
              '        "APP_STARTING",\n        "RUNNING_APP_STARTING",\n        "RUNNING_CONTAINER_STARTING",\n        "CREATING",',
          )
          text = text.replace(
              '        "NO_APP_FILE",\n        "UNKNOWN",\n        "UNAVAILABLE",',
              '        "NO_APP_FILE",',
          )
          old = '''    stage = space.stage\n    hosts = space.host_candidates\n\n    if repair and stage in RESTART_ELIGIBLE_STAGES:\n        if not token:\n            result.blockers.append("repair requested but no supported Hugging Face token is configured")\n        else:\n            result.restart_attempted = True\n            try:\n                result.restart_http_status = restart_space(space.repo_id, token)\n            except OperatorError as exc:\n                result.blockers.append(str(exc))\n\n    if stage not in HEALTHY_STAGES or result.restart_attempted:\n        try:\n            stage, hosts, polls = wait_for_terminal(\n                space.repo_id,\n                token,\n                deadline=time.monotonic() + wait_seconds,\n                initial_hosts=hosts,\n            )\n            result.final_stage = stage\n            result.polls = polls\n        except OperatorError as exc:\n            result.blockers.append(str(exc))\n\n    if result.final_stage in HEALTHY_STAGES:\n        url, status, blockers = probe_runtime(hosts)\n        result.runtime_url = url\n        result.runtime_http_status = status\n        result.blockers.extend(blockers[-2:] if url else blockers)\n        result.operational = bool(url and status == 200)\n    else:\n        result.blockers.append(f"runtime stage is {result.final_stage}")\n'''
          new = '''    stage = space.stage\n    hosts = space.host_candidates\n\n    # The organization inventory frequently omits runtime.stage. Resolve exact\n    # Space detail before deciding whether any mutation is justified.\n    if stage in {"UNKNOWN", "UNAVAILABLE"}:\n        try:\n            current = fetch_space(space.repo_id, token)\n            stage = current.stage\n            hosts = tuple(dict.fromkeys((*current.host_candidates, *hosts)))\n            result.final_stage = stage\n        except OperatorError as exc:\n            result.blockers.append(str(exc))\n\n    # Static Spaces have no restartable container. Their operational contract is\n    # the public static origin itself, so probe it directly and never POST.\n    if space.sdk == "static":\n        url, status, blockers = probe_runtime(hosts)\n        result.runtime_url = url\n        result.runtime_http_status = status\n        result.blockers.extend(blockers[-2:] if url else blockers)\n        result.operational = bool(url and status == 200)\n    else:\n        should_wait = stage in TRANSITIONAL_STAGES\n        if repair and stage in RESTART_ELIGIBLE_STAGES:\n            if not token:\n                result.blockers.append("repair requested but no supported Hugging Face token is configured")\n            else:\n                result.restart_attempted = True\n                try:\n                    result.restart_http_status = restart_space(space.repo_id, token)\n                    should_wait = True\n                except OperatorError as exc:\n                    result.blockers.append(str(exc))\n\n        if should_wait:\n            try:\n                stage, hosts, polls = wait_for_terminal(\n                    space.repo_id,\n                    token,\n                    deadline=time.monotonic() + wait_seconds,\n                    initial_hosts=hosts,\n                )\n                result.final_stage = stage\n                result.polls = polls\n            except OperatorError as exc:\n                result.blockers.append(str(exc))\n\n        if result.final_stage in HEALTHY_STAGES:\n            url, status, blockers = probe_runtime(hosts)\n            result.runtime_url = url\n            result.runtime_http_status = status\n            result.blockers.extend(blockers[-2:] if url else blockers)\n            result.operational = bool(url and status == 200)\n        elif not should_wait and result.final_stage in {"UNKNOWN", "UNAVAILABLE"}:\n            # Read-only reachability can still prove an application is serving\n            # when provider stage metadata is temporarily absent.\n            url, status, blockers = probe_runtime(hosts)\n            result.runtime_url = url\n            result.runtime_http_status = status\n            result.blockers.extend(blockers[-2:] if url else blockers)\n            result.operational = bool(url and status == 200)\n\n    if not result.operational and result.final_stage not in HEALTHY_STAGES:\n        result.blockers.append(f"runtime stage is {result.final_stage}")\n'''
          if old not in text:
              raise SystemExit('operator decision block patch point is missing')
          operator.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_hf_living_constellation_operator.py')
          text = tests.read_text(encoding='utf-8')
          addition = '''\n\ndef test_provider_app_starting_stage_is_transitional() -> None:\n    assert "RUNNING_APP_STARTING" in operator.TRANSITIONAL_STAGES\n    assert "RUNNING_CONTAINER_STARTING" in operator.TRANSITIONAL_STAGES\n    assert "UNAVAILABLE" not in operator.RESTART_ELIGIBLE_STAGES\n    assert "UNKNOWN" not in operator.RESTART_ELIGIBLE_STAGES\n\n\ndef test_static_space_is_probed_without_restart() -> None:\n    space = operator.Space(\n        repo_id="SZLHOLDINGS/proof",\n        slug="proof",\n        sdk="static",\n        stage="UNAVAILABLE",\n        private=False,\n        host_candidates=("https://szlholdings-proof.static.hf.space/",),\n    )\n    detail = operator.Space(\n        repo_id=space.repo_id,\n        slug=space.slug,\n        sdk="static",\n        stage="RUNNING",\n        private=False,\n        host_candidates=space.host_candidates,\n    )\n    with mock.patch.object(operator, "fetch_space", return_value=detail), mock.patch.object(\n        operator, "restart_space"\n    ) as restart, mock.patch.object(\n        operator, "probe_runtime", return_value=(space.host_candidates[0], 200, [])\n    ):\n        result = operator.operate_one(space, token="hf_secret", repair=True, wait_seconds=30)\n    restart.assert_not_called()\n    assert result.operational is True\n    assert result.state == "OPERATIONAL"\n\n\ndef test_unknown_inventory_stage_resolves_detail_before_mutation() -> None:\n    space = operator.Space(\n        repo_id="SZLHOLDINGS/lyte",\n        slug="lyte",\n        sdk="docker",\n        stage="UNAVAILABLE",\n        private=False,\n        host_candidates=("https://szlholdings-lyte.hf.space/",),\n    )\n    detail = operator.Space(\n        repo_id=space.repo_id,\n        slug=space.slug,\n        sdk="docker",\n        stage="RUNNING",\n        private=False,\n        host_candidates=space.host_candidates,\n    )\n    with mock.patch.object(operator, "fetch_space", return_value=detail) as fetch, mock.patch.object(\n        operator, "restart_space"\n    ) as restart, mock.patch.object(\n        operator, "probe_runtime", return_value=(space.host_candidates[0], 200, [])\n    ):\n        result = operator.operate_one(space, token="hf_secret", repair=True, wait_seconds=30)\n    fetch.assert_called_once_with(space.repo_id, "hf_secret")\n    restart.assert_not_called()\n    assert result.operational is True\n\n\ndef test_running_app_starting_waits_instead_of_restarting() -> None:\n    space = operator.Space(\n        repo_id="SZLHOLDINGS/lyte",\n        slug="lyte",\n        sdk="docker",\n        stage="RUNNING_APP_STARTING",\n        private=False,\n        host_candidates=("https://szlholdings-lyte.hf.space/",),\n    )\n    with mock.patch.object(operator, "restart_space") as restart, mock.patch.object(\n        operator, "wait_for_terminal", return_value=("RUNNING", space.host_candidates, 5)\n    ) as wait, mock.patch.object(\n        operator, "probe_runtime", return_value=(space.host_candidates[0], 200, [])\n    ):\n        result = operator.operate_one(space, token="hf_secret", repair=True, wait_seconds=540)\n    restart.assert_not_called()\n    wait.assert_called_once()\n    assert result.polls == 5\n    assert result.operational is True\n'''
          marker = '\n\nif __name__ == "__main__":\n'
          if marker not in text:
              raise SystemExit('operator test insertion point is missing')
          tests.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')

          workflow = Path('.github/workflows/hf-living-constellation-operator.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '''          title='[runtime] Living Constellation public Space drift'\n          issue="$(gh issue list --state open --search \\\"$title in:title\\\" --json number,title --jq '.[] | select(.title == "'"$title"'") | .number' | head -n1)"\n'''
          new = '''          title='[runtime] Living Constellation public Space drift'\n          issue="$(gh issue list --state all --limit 100 --json number,title --jq '.[] | select(.title == "[runtime] Living Constellation public Space drift") | .number' | head -n1)"\n'''
          if old not in text:
              raise SystemExit('runtime issue lookup patch point is missing')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-living-constellation-transition-on-branch.yml
      - name: Verify the exact operator repair
        run: |
          python -m py_compile .github/scripts/hf_living_constellation_operator.py tests/test_hf_living_constellation_operator.py
          python -m pytest -q tests/test_hf_living_constellation_operator.py
          git diff --check
      - name: Commit signed repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SZL Living Constellation Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add \
            .github/scripts/hf_living_constellation_operator.py \
            tests/test_hf_living_constellation_operator.py \
            .github/workflows/hf-living-constellation-operator.yml \
            .github/workflows/fix-living-constellation-transition-on-branch.yml
          git commit -s -m "fix(hf): wait for app startup and never restart static Spaces"
          git push origin HEAD:fix/living-constellation-transition-state
