name: Reusable — Production Readiness v5

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: production-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate profile
        run: >
          python3 tools/production/szl_production_auditor_v5.py
          --profile tools/production/szl_production_readiness_profile_v5.json
          --validate-only

      - name: Unit tests
        run: python3 -m unittest -v tools/production/test_szl_production_auditor_v5.py
