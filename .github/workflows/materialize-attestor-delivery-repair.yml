name: Materialize Signed Attestor Delivery Repair

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/materialize-attestor-delivery-repair.yml
      - .github/scripts/materialize_attestor_delivery_repair.py

permissions:
  contents: write

concurrency:
  group: materialize-signed-attestor-delivery-repair
  cancel-in-progress: false

jobs:
  materialize:
    name: Publish one signed protected-delivery repair
    if: >-
      github.repository == 'szl-holdings/.github' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diag/enqueue-legacy-green-prs-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TARGET_BRANCH: fix/attestor-delivery-recovery-v1-signed
      EXPECTED_PARENT: 5aa61bb92ba4a1cd1b59c09c4f82b902d1bf7917
    steps:
      - name: Checkout exact recovery source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Build, test, and publish the signed permanent tree
        run: python .github/scripts/materialize_attestor_delivery_repair.py

      - name: Upload immutable materialization receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-attestor-delivery-${{ github.run_id }}
          path: signed-attestor-delivery.json
          if-no-files-found: error
          retention-days: 90
