name: Materialize Signed Attestor Delivery Repair

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/materialize-attestor-delivery-repair.yml
      - .github/scripts/materialize_attestor_delivery_repair.py

permissions:
  contents: write

concurrency:
  group: materialize-signed-attestor-delivery-repair
  cancel-in-progress: false

jobs:
  materialize:
    name: Publish one signed protected-delivery repair
    if: >-
      github.repository == 'szl-holdings/.github' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diag/enqueue-legacy-green-prs-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TARGET_BRANCH: fix/attestor-delivery-recovery-v1-signed
      EXPECTED_PARENT: 5aa61bb92ba4a1cd1b59c09c4f82b902d1bf7917
    steps:
      - name: Checkout exact recovery source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Reconcile exact source-contract predicates
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/scripts/materialize_attestor_delivery_repair.py')
          source = path.read_text(encoding='utf-8')
          replacements = (
              (
                  'echo "Protected Merge Queue Enqueue owns native enqueuePullRequest delivery."',
                  'echo "Protected Merge Queue Enqueue owns the native queue mutation."',
              ),
              (
                  'self.assertNotIn("pull_request_target", self.attestor)',
                  'self.assertNotIn("pull_request_target:", self.attestor)',
              ),
              (
                  'if "pull_request_target" in attestor_template:',
                  'if "pull_request_target:" in attestor_template:',
              ),
          )
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact source-contract marker, found {count}: {old}')
              source = source.replace(old, new, 1)

          old_guard_patch = '''    source = source.replace(
              r'^(\\.github/workflows/(attest-and-approve|gates|forge9-staging)'
              r'\\.ya?ml|\\.governance/)',
              r'^(\\.github/workflows/(attest-and-approve|gates|forge9-staging|merge-queue-enqueue)'
              r'\\.ya?ml|\\.governance/)',
              1,
          )
          '''
          new_guard_patch = '''    old_guard = r''' + "'''" + '''ATTESTOR_SELF_EDIT_GUARD = (
              r"^(\\.github/workflows/(attest-and-approve|gates|forge9-staging)"
              r"\\.ya?ml|\\.governance/)"
          )''' + "'''" + '''
              new_guard = r''' + "'''" + '''ATTESTOR_SELF_EDIT_GUARD = (
              r"^(\\.github/workflows/(attest-and-approve|gates|forge9-staging|merge-queue-enqueue)"
              r"\\.ya?ml|\\.governance/)"
          )''' + "'''" + '''
              if old_guard not in source:
                  raise SystemExit("governance verifier self-edit guard changed unexpectedly")
              source = source.replace(old_guard, new_guard, 1)
          '''
          count = source.count(old_guard_patch)
          if count != 1:
              raise SystemExit(f'expected one verifier guard patch block, found {count}')
          source = source.replace(old_guard_patch, new_guard_patch, 1)
          path.write_text(source, encoding='utf-8')

      - name: Build, test, and publish the signed permanent tree
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/materialize_attestor_delivery_repair.py \
            2>&1 | tee signed-attestor-delivery.log

      - name: Upload immutable materialization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-attestor-delivery-${{ github.run_id }}
          path: |
            signed-attestor-delivery.log
            signed-attestor-delivery.json
          if-no-files-found: error
          retention-days: 90
