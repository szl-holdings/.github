# Organization-wide required GitHub Actions secret-name audit.
#
# Pull requests execute only the secretless static contract. GitHub deliberately
# withholds Actions secrets from Dependabot and other untrusted PR contexts, so
# a live organization audit there can prove only UNAVAILABLE—not secret health.
# Trusted push, schedule, and manual events retain the App-first, fail-closed
# live audit. The retired SECRET_HEALTH_TOKEN PAT is never consumed.

name: Governed Secret Health

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/secret-health.yml
      - .github/data/required_actions_secrets.json
      - .github/scripts/secret_health.py
      - .github/scripts/test_secret_health.py
  push:
    branches: [main]
    paths:
      - .github/workflows/secret-health.yml
      - .github/data/required_actions_secrets.json
      - .github/scripts/secret_health.py
      - .github/scripts/test_secret_health.py

permissions:
  contents: read

concurrency:
  group: governed-secret-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Governed organization secret-name health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout governed policy and auditor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile and test the fail-closed contract
        run: |
          set -euo pipefail
          python -m py_compile \
            .github/scripts/secret_health.py \
            .github/scripts/test_secret_health.py
          python .github/scripts/test_secret_health.py
          git diff --check

      - name: Confirm untrusted pull-request boundary
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          echo "Static secret-health contract verified without requesting unavailable PR secrets."
          echo "The live organization audit remains mandatory on the protected main push."

      - name: Mint preferred qillqaq secret-name reader
        if: github.event_name != 'pull_request'
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.QILLQAQ_CLIENT_ID }}
          private-key: ${{ secrets.QILLQAQ_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read
          permission-secrets: read

      - name: Select governed machine identity without serializing it
        if: github.event_name != 'pull_request'
        id: auth
        env:
          APP_OUTCOME: ${{ steps.app-token.outcome }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GOVERNED_FALLBACK: ${{ secrets.SZL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$APP_OUTCOME" = 'success' ] && [ -n "$APP_TOKEN" ]; then
            echo 'source=qillqaq-app' >> "$GITHUB_OUTPUT"
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif [ -n "$GOVERNED_FALLBACK" ]; then
            echo 'source=governed-fallback' >> "$GITHUB_OUTPUT"
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'source=UNAVAILABLE' >> "$GITHUB_OUTPUT"
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Audit required names and emit a redacted receipt
        if: github.event_name != 'pull_request'
        id: audit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SZL_GITHUB_TOKEN }}
          SECRET_HEALTH_AUTH_SOURCE: ${{ steps.auth.outputs.source }}
        run: |
          set +e
          python .github/scripts/secret_health.py \
            --policy .github/data/required_actions_secrets.json \
            --report reports/secret-health.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable secret-name health receipt
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governed-secret-health-${{ github.run_id }}
          path: reports/secret-health.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce verified coverage
        if: always() && github.event_name != 'pull_request'
        env:
          EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
          AUTH_AVAILABLE: ${{ steps.auth.outputs.available }}
          AUTH_SOURCE: ${{ steps.auth.outputs.source }}
        run: |
          set -euo pipefail
          code="${EXIT_CODE:-2}"
          if [ "$code" -ne 0 ]; then
            echo "::error::secret-health is not verified (source=${AUTH_SOURCE:-UNAVAILABLE}, available=${AUTH_AVAILABLE:-false}, exit=$code)."
            exit "$code"
          fi
          echo "Secret-name health verified through ${AUTH_SOURCE}."