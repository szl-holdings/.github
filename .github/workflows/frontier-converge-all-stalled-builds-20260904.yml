name: Frontier converge all stalled builds — 2026-09-04

on:
  push:
    branches:
      - frontier/converge-all-stalled-builds-20260904
    paths:
      - scripts/frontier_converge_20260904.py
      - .github/workflows/frontier-converge-all-stalled-builds-20260904.yml
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: Bounded dependency and protection wait
        required: false
        default: "75"

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: frontier-converge-all-stalled-builds-20260904
  cancel-in-progress: false

jobs:
  converge:
    name: Audit, reconcile, merge, deploy, verify, receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FRONTIER_OPERATOR_TOKEN_CANDIDATE: ${{ secrets.FRONTIER_OPERATOR_TOKEN }}
      FRONTIER_GITHUB_TOKEN_CANDIDATE: ${{ secrets.FRONTIER_GITHUB_TOKEN }}
      OPERATOR_GITHUB_TOKEN_CANDIDATE: ${{ secrets.OPERATOR_GITHUB_TOKEN }}
      AUTONOMY_GITHUB_TOKEN_CANDIDATE: ${{ secrets.AUTONOMY_GITHUB_TOKEN }}
      SZL_GITHUB_TOKEN_CANDIDATE: ${{ secrets.SZL_GITHUB_TOKEN }}
      SZL_ORG_ADMIN_TOKEN_CANDIDATE: ${{ secrets.SZL_ORG_ADMIN_TOKEN }}
      ORG_ADMIN_TOKEN_CANDIDATE: ${{ secrets.ORG_ADMIN_TOKEN }}
      GH_ADMIN_TOKEN_CANDIDATE: ${{ secrets.GH_ADMIN_TOKEN }}
      GITHUB_ADMIN_TOKEN_CANDIDATE: ${{ secrets.GITHUB_ADMIN_TOKEN }}
      GH_PAT_CANDIDATE: ${{ secrets.GH_PAT }}
      ORG_PAT_CANDIDATE: ${{ secrets.ORG_PAT }}
      ADMIN_PAT_CANDIDATE: ${{ secrets.ADMIN_PAT }}
      GITHUB_PAT_CANDIDATE: ${{ secrets.GITHUB_PAT }}
      PAT_CANDIDATE: ${{ secrets.PAT }}
      PERSONAL_ACCESS_TOKEN_CANDIDATE: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      REPO_TOKEN_CANDIDATE: ${{ secrets.REPO_TOKEN }}
      GITHUB_TOKEN_CANDIDATE: ${{ github.token }}
      HF_ORG_TOKEN_CANDIDATE: ${{ secrets.HF_ORG_TOKEN }}
      HF_ORG_TOKEN1_CANDIDATE: ${{ secrets.HF_ORG_TOKEN1 }}
      HF_WRITE_TOKEN_CANDIDATE: ${{ secrets.HF_WRITE_TOKEN }}
      HF_TOKEN_CANDIDATE: ${{ secrets.HF_TOKEN }}
      HUGGINGFACEHUB_API_TOKEN_CANDIDATE: ${{ secrets.HUGGINGFACEHUB_API_TOKEN }}
      HUGGING_FACE_HUB_TOKEN_CANDIDATE: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
      REPORT_JSON: reports/frontier-convergence-20260904.json
      REPORT_MD: reports/frontier-convergence-20260904.md

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact one-shot controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Mask every present credential candidate before use
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r name value; do
            case "$name" in
              *_TOKEN_CANDIDATE|*_PAT_CANDIDATE)
                if [ -n "$value" ]; then
                  echo "::add-mask::$value"
                fi
                ;;
            esac
          done < <(env)

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          check-latest: false

      - name: Prove controller syntax and immutable authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python -I -m py_compile scripts/frontier_converge_20260904.py
          python - <<'PY'
          from pathlib import Path
          source = Path('scripts/frontier_converge_20260904.py').read_text(encoding='utf-8')
          required = (
              'direct_main_write',
              'force_push',
              'admin_bypass',
              'credential_values_recorded',
              'SUCCESSOR_STACK',
              'INDEPENDENT_TARGETS',
              'PUBLIC_PROBES',
              'HF_SPACES',
              'Sentra remains the sole Assurance Command',
          )
          for marker in required:
              assert marker in source, marker
          forbidden = (
              'git push --force',
              'git push -f',
              '--admin',
              'delete_repo(',
              'delete_space',
              '/branches/main/protection',
          )
          for marker in forbidden:
              assert marker not in source, marker
          PY
          git diff --check

      - name: Execute full convergence
        id: execute
        shell: bash
        env:
          WAIT_MINUTES: ${{ inputs.wait_minutes || '75' }}
        run: |
          set +e
          mkdir -p reports
          python -I -P scripts/frontier_converge_20260904.py \
            --execute \
            --wait-minutes "$WAIT_MINUTES" \
            --json-output "$REPORT_JSON" \
            --markdown-output "$REPORT_MD" \
            > reports/frontier-convergence-stdout.json \
            2> reports/frontier-convergence-stderr.txt
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ ! -s "$REPORT_JSON" ]; then
            python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          stderr = Path('reports/frontier-convergence-stderr.txt')
          error = stderr.read_text(encoding='utf-8', errors='replace')[-4000:] if stderr.exists() else 'controller did not emit a receipt'
          receipt = {
              'schema': 'szl.frontier-convergence-failure/v1',
              'completed_at': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'terminal_success': False,
              'error': error,
              'credential_values_recorded': False,
              'direct_main_write': False,
              'force_push': False,
              'admin_bypass': False,
          }
          raw = json.dumps(receipt, sort_keys=True, separators=(',',':')).encode()
          receipt['receipt_sha256'] = hashlib.sha256(raw).hexdigest()
          Path(os.environ['REPORT_JSON']).write_text(json.dumps(receipt, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          Path(os.environ['REPORT_MD']).write_text('# SZL Frontier Convergence\n\nThe controller failed closed. Inspect the JSON artifact.\n', encoding='utf-8')
          PY
          fi
          exit 0

      - name: Write operator summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path(os.environ['REPORT_JSON']).read_text(encoding='utf-8'))
          truth = report.get('final_truth') or report
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as stream:
              stream.write('# SZL Frontier Convergence\n\n')
              stream.write(f"- Terminal success: `{truth.get('terminal_success', False)}`\n")
              stream.write(f"- Open PR count: `{truth.get('open_pr_count', 'UNAVAILABLE')}`\n")
              stream.write(f"- Runtime/main matches: `{json.dumps(truth.get('runtime_matches_main'), sort_keys=True)}`\n")
              stream.write(f"- Cloudflare public contract: `{truth.get('cloudflare_public_contract', False)}`\n")
              stream.write(f"- Receipt SHA-256: `{report.get('receipt_sha256')}`\n")
              stream.write(f"- Controller exit: `{os.environ.get('EXECUTION_EXIT', '')}`\n")
          PY
        env:
          EXECUTION_EXIT: ${{ steps.execute.outputs.exit_code }}

      - name: Upload immutable secret-free convergence evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontier-convergence-20260904-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.REPORT_JSON }}
            ${{ env.REPORT_MD }}
            reports/frontier-convergence-stdout.json
            reports/frontier-convergence-stderr.txt
          if-no-files-found: error
          retention-days: 180

      - name: Preserve fail-closed terminal verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path(os.environ['REPORT_JSON']).read_text(encoding='utf-8'))
          truth = report.get('final_truth') or report
          if truth.get('terminal_success') is not True:
              raise SystemExit(2)
          PY
