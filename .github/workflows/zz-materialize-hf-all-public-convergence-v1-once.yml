name: Materialize HF all-public convergence v1 once

on:
  push:
    branches:
      - feat/hf-all-public-convergence-v1
    paths:
      - .github/workflows/zz-materialize-hf-all-public-convergence-v1-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/hf-all-public-convergence-v1
          fetch-depth: 1
      - name: Decode reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/hf-public.tgz.b64 <<'PAYLOAD'

PAYLOAD
          base64 --decode /tmp/hf-public.tgz.b64 > /tmp/hf-public.tgz
          tar -xzf /tmp/hf-public.tgz -C .
      - name: Prove implementation
        run: |
          set -euo pipefail
          python .github/scripts/test_hf_all_public_converge.py
          python -m py_compile .github/scripts/hf_all_public_converge.py .github/scripts/test_hf_all_public_converge.py .github/scripts/render_hf_all_public_comment.py
          git diff --check
      - name: Commit durable controls only
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-materialize-hf-all-public-convergence-v1-once.yml
          git add .github/scripts/hf_all_public_converge.py .github/scripts/test_hf_all_public_converge.py .github/scripts/render_hf_all_public_comment.py .github/workflows/hf-all-public-convergence.yml
          git config user.name "SZL Frontier Operator"
          git config user.email "stephenlutar2@gmail.com"
          git commit -m "feat(hf): converge policy Spaces to public operational state" -m "Add exact-state planning, pre-publication secret scanning, public/ungated mutation, existing-allocation restart, runtime proof and immutable receipts. Unsafe targets block individually; no hardware, storage, variable, secret, upload, create or delete authority is introduced." -m "Signed-off-by: Stephen P. Lutar Jr. <stephenlutar2@gmail.com>"
          git push origin HEAD:feat/hf-all-public-convergence-v1
