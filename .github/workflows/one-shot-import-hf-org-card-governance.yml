# SPDX-License-Identifier: Apache-2.0
name: One-shot import HF organization-card governance

on:
  push:
    branches:
      - fix/hf-org-card-preserve-governance-20260904
    paths:
      - .github/workflows/one-shot-import-hf-org-card-governance.yml

permissions:
  contents: write

concurrency:
  group: one-shot-import-hf-org-card-governance
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-org-card-preserve-governance-20260904
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install exact Hub client
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface_hub==1.19.0"

      - name: Import immutable remote files and bind manifest
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_ORG_TOKEN1 || secrets.HF_TOKEN || secrets.HF_WRITE_TOKEN }}
          BRANCH: fix/hf-org-card-preserve-governance-20260904
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || {
            echo "::error::No Hugging Face credential is available in the central repository secret scope."
            exit 2
          }
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          import yaml
          from huggingface_hub import HfApi, hf_hub_download

          repo_id = "SZLHOLDINGS/README"
          remote_paths = [
              "GOVERNANCE.md",
              "MODELS.txt",
              "SEVEN_SPACES.md",
              "SPACE_PROVENANCE_FRONTIER.json",
              "seven-spaces.yaml",
          ]
          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          info = api.repo_info(repo_id=repo_id, repo_type="space")
          revision = str(info.sha)
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit(f"invalid source Space revision: {revision!r}")

          destination_root = Path("huggingface/org-card")
          destination_root.mkdir(parents=True, exist_ok=True)
          secret_pattern = re.compile(
              rb"(?:hf_[A-Za-z0-9]{16,}|Bearer\s+[A-Za-z0-9._~+/-]{16,}|"
              rb"gh[oprsu]_[A-Za-z0-9_]{16,}|github_pat_[A-Za-z0-9_]{16,})",
              re.IGNORECASE,
          )
          imported: list[dict[str, object]] = []
          for remote_path in remote_paths:
              downloaded = Path(
                  hf_hub_download(
                      repo_id=repo_id,
                      filename=remote_path,
                      repo_type="space",
                      revision=revision,
                      token=token,
                  )
              )
              data = downloaded.read_bytes()
              if not data or len(data) > 2_000_000:
                  raise SystemExit(f"unsafe imported size for {remote_path}: {len(data)}")
              if secret_pattern.search(data):
                  raise SystemExit(f"secret-like material rejected in {remote_path}")
              text = data.decode("utf-8", errors="strict")
              if remote_path.endswith(".json"):
                  json.loads(text)
              if remote_path.endswith((".yaml", ".yml")):
                  yaml.safe_load(text)
              destination = destination_root / remote_path
              destination.write_bytes(data)
              imported.append(
                  {
                      "path": remote_path,
                      "sha256": hashlib.sha256(data).hexdigest(),
                      "size": len(data),
                  }
              )

          manifest_path = Path("huggingface/org-card.manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          files = manifest["files"]
          by_destination = {row["destination"]: row for row in files}
          for remote_path in remote_paths:
              expected = {
                  "source": f"huggingface/org-card/{remote_path}",
                  "destination": remote_path,
              }
              current = by_destination.get(remote_path)
              if current is not None and current != expected:
                  raise SystemExit(f"conflicting manifest entry for {remote_path}: {current!r}")
              if current is None:
                  files.append(expected)
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          receipt_path = Path("docs/evidence/hf-org-card-governance-import.json")
          receipt_path.parent.mkdir(parents=True, exist_ok=True)
          receipt = {
              "schema": "szl.hf-org-card-governance-import/v1",
              "source": {
                  "repo_id": repo_id,
                  "repo_type": "space",
                  "revision": revision,
              },
              "observed_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "files": imported,
              "claim": "Existing public governance artifacts imported without mutation before canonical publication.",
          }
          receipt_path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

          python .github/scripts/hf_static_space_deploy.py \
            --repo-root . \
            --manifest huggingface/org-card.manifest.json \
            --source-sha "$(git rev-parse HEAD)" \
            --materialize "$(mktemp -d)" \
            --report /tmp/hf-org-card-import-materialization.json

          git config user.name "szl-frontier-bot"
          git config user.email "stephenlutar2+frontier@gmail.com"
          git add \
            huggingface/org-card/GOVERNANCE.md \
            huggingface/org-card/MODELS.txt \
            huggingface/org-card/SEVEN_SPACES.md \
            huggingface/org-card/SPACE_PROVENANCE_FRONTIER.json \
            huggingface/org-card/seven-spaces.yaml \
            huggingface/org-card.manifest.json \
            docs/evidence/hf-org-card-governance-import.json
          git diff --cached --quiet && {
            echo "::error::Import produced no source-controlled changes."
            exit 3
          }
          git commit \
            -m "fix(hf): preserve existing organization-card governance artifacts" \
            -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin "HEAD:${BRANCH}"
