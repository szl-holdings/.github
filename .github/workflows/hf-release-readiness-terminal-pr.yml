name: HF Release Readiness Terminal — Pull Request Verification

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/hf_release_readiness_terminal.py
      - .github/scripts/test_hf_release_readiness_terminal.py
      - .github/workflows/hf-release-readiness-terminal.yml
      - .github/workflows/hf-release-readiness-terminal-pr.yml
      - .github/workflows/hf-release-finalization.yml
      - .github/workflows/final-estate-reconciliation-v5.yml
      - .github/workflows/hf-release-readiness.yml
      - .github/scripts/hf_release_readiness_verify.py
      - .github/scripts/test_hf_release_readiness_verify.py

permissions:
  contents: read

concurrency:
  group: hf-release-readiness-terminal-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REPORT_PATH: reports/hf-release-readiness-prerelease.json

jobs:
  verify:
    name: Credentialless readiness source and chain verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install source-test dependencies only
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "huggingface_hub==1.19.0" \
            "requests==2.32.5"

      - name: Compile and test without credentials or external mutation
        run: |
          set -euo pipefail
          python -m py_compile \
            .github/scripts/hf_release_readiness_terminal.py \
            .github/scripts/test_hf_release_readiness_terminal.py
          python .github/scripts/test_hf_release_readiness_terminal.py
          git diff --check

      - name: Write immutable pull-request boundary evidence
        run: |
          mkdir -p reports
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          report = {
              "schema": "szl.hf-release-readiness/v1-prerelease",
              "generation": os.environ.get("GITHUB_SHA"),
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "publish": False,
              "source_and_chain_tests": "PASSED",
              "summary": {"ok": 1, "warning": 0, "error": 0, "dry_run": 1},
              "boundaries": [
                  "No Hugging Face credential is referenced by this workflow.",
                  "The workflow token has contents:read only.",
                  "No Hugging Face asset, GitHub issue, or downstream workflow is mutated on pull_request.",
              ],
          }
          Path(os.environ["REPORT_PATH"]).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload immutable pull-request evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-release-readiness-pr-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 30
