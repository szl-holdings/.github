name: Apply HF source-binding existing receipt fix v2

on:
  push:
    branches:
      - fix/hf-source-binding-existing-receipt-20260904
    paths:
      - .github/workflows/apply-hf-source-binding-existing-receipt-fix-v2.yml

permissions:
  contents: write

concurrency:
  group: hf-source-binding-existing-receipt-fix-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-source-binding-existing-receipt-20260904
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Apply exact verifier and regression transformations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('.github/scripts/hf_space_source_binding.py')
          test_path = Path('.github/scripts/test_hf_space_source_binding.py')

          source = source_path.read_text(encoding='utf-8')
          constants_old = '''SHA40 = re.compile(r"^[0-9a-f]{40}$")
          VARIABLE = re.compile(r"^[A-Z][A-Z0-9_]{0,63}$")
          REPO_ID = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$")
          '''
          constants_new = '''SHA40 = re.compile(r"^[0-9a-f]{40}$")
          SHA256 = re.compile(r"^[0-9a-f]{64}$")
          ATTESTATION_ID = re.compile(r"^[0-9]+$")
          VARIABLE = re.compile(r"^[A-Z][A-Z0-9_]{0,63}$")
          REPO_ID = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$")
          '''
          if source.count(constants_old) != 1:
              raise SystemExit('source constants precondition failed')
          source = source.replace(constants_old, constants_new, 1)

          probe_anchor = '''def _runtime_probe_observation(
          '''
          helper = '''def _reported_receipt_status(
              payload: Mapping[str, Any], expected_revision: str
          ) -> dict[str, Any]:
              """Validate a read-only receipt observation without requiring absence.

              A GET probe must never mint a receipt, but it may observe a release
              attestation that the runtime loaded at startup. An asserted receipt is
              admitted only when it is exact-source bound and has a canonical GitHub
              OIDC attestation reference.
              """

              minted = payload.get("receipt_minted")
              if minted is False:
                  return {
                      "minted": False,
                      "valid": True,
                      "state": "NOT_REPORTED_AS_MINTED",
                  }
              if minted is not True:
                  return {
                      "minted": minted,
                      "valid": False,
                      "state": "INVALID_RECEIPT_FLAG",
                  }

              receipt = payload.get("release_receipt")
              if not isinstance(receipt, Mapping):
                  return {
                      "minted": True,
                      "valid": False,
                      "state": "MISSING_RELEASE_RECEIPT",
                  }

              source_revision = str(receipt.get("source_revision") or "").lower()
              subject = str(receipt.get("subject") or "")
              digest = str(receipt.get("subject_sha256") or "").lower()
              attestation_id = str(receipt.get("attestation_id") or "")
              attestation_url = str(receipt.get("attestation_url") or "")
              parsed = urlsplit(attestation_url)
              parts = [part for part in parsed.path.split("/") if part]
              canonical_url = (
                  parsed.scheme == "https"
                  and parsed.netloc == "github.com"
                  and parsed.username is None
                  and parsed.password is None
                  and not parsed.query
                  and not parsed.fragment
                  and len(parts) == 4
                  and parts[2] == "attestations"
                  and parts[3] == attestation_id
              )
              valid = (
                  str(receipt.get("state") or "").upper() == "GITHUB_OIDC_ATTESTED"
                  and source_revision == expected_revision
                  and subject == "hf-deploy-manifest.json"
                  and SHA256.fullmatch(digest) is not None
                  and ATTESTATION_ID.fullmatch(attestation_id) is not None
                  and canonical_url
              )
              return {
                  "minted": True,
                  "valid": valid,
                  "state": "GITHUB_OIDC_ATTESTED" if valid else "INVALID_RELEASE_RECEIPT",
              }


          def _runtime_probe_observation(
          '''
          if source.count(probe_anchor) != 1:
              raise SystemExit('source probe anchor precondition failed')
          source = source.replace(probe_anchor, helper, 1)

          match_old = '''    receipt_minted = payload.get("receipt_minted")
              matched = (
                  observed == binding["revision"]
                  and state == "OBSERVED"
                  and receipt_minted is False
              )
              observation.update(
                  {
                      "build_state": state,
                      "observed_revision": observed,
                      "receipt_minted": receipt_minted,
                      "matched": matched,
                  }
              )
          '''
          match_new = '''    receipt = _reported_receipt_status(payload, binding["revision"])
              matched = (
                  observed == binding["revision"]
                  and state == "OBSERVED"
                  and receipt["valid"] is True
              )
              observation.update(
                  {
                      "build_state": state,
                      "observed_revision": observed,
                      "receipt_minted": receipt["minted"],
                      "receipt_state": receipt["state"],
                      "receipt_valid": receipt["valid"],
                      "matched": matched,
                  }
              )
          '''
          if source.count(match_old) != 1:
              raise SystemExit('source match block precondition failed')
          source = source.replace(match_old, match_new, 1)
          source_path.write_text(source, encoding='utf-8', newline='\n')

          tests = test_path.read_text(encoding='utf-8')
          helper_old = '''    @staticmethod
              def observed_payload(revision: str) -> dict[str, object]:
                  return {
                      "status": "OBSERVED",
                      "build": {"state": "OBSERVED", "revision": revision},
                      "runtime": {"python": "3.12"},
                      "receipt_minted": False,
                  }
          '''
          helper_new = '''    @staticmethod
              def observed_payload(
                  revision: str,
                  *,
                  receipt_minted: bool = False,
                  release_receipt: dict[str, object] | None = None,
              ) -> dict[str, object]:
                  payload: dict[str, object] = {
                      "status": "OBSERVED",
                      "build": {"state": "OBSERVED", "revision": revision},
                      "runtime": {"python": "3.12"},
                      "receipt_minted": receipt_minted,
                  }
                  if release_receipt is not None:
                      payload["release_receipt"] = release_receipt
                  return payload

              def valid_receipt(self, revision: str | None = None) -> dict[str, object]:
                  source_revision = revision or self.sha
                  attestation_id = "123456789"
                  return {
                      "state": "GITHUB_OIDC_ATTESTED",
                      "source_revision": source_revision,
                      "subject": "hf-deploy-manifest.json",
                      "subject_sha256": "c" * 64,
                      "attestation_id": attestation_id,
                      "attestation_url": (
                          "https://github.com/szl-holdings/killinchu/attestations/"
                          + attestation_id
                      ),
                  }
          '''
          if tests.count(helper_old) != 1:
              raise SystemExit('test helper precondition failed')
          tests = tests.replace(helper_old, helper_new, 1)

          insertion_anchor = '''    def test_runtime_probe_preserves_caller_query_verbatim(self):
          '''
          new_tests = '''    def test_runtime_probe_accepts_valid_existing_oidc_receipt(self):
                  payload = self.observed_payload(
                      self.sha,
                      receipt_minted=True,
                      release_receipt=self.valid_receipt(),
                  )
                  report = binding.verify_runtime_probe(
                      self.normalized,
                      session=FakeSession(FakeResponse(payload)),
                  )
                  observation = report["observations"][0]
                  self.assertTrue(report["matched"])
                  self.assertTrue(observation["receipt_minted"])
                  self.assertTrue(observation["receipt_valid"])
                  self.assertEqual(observation["receipt_state"], "GITHUB_OIDC_ATTESTED")

              def test_runtime_probe_rejects_unbound_or_malformed_existing_receipt(self):
                  invalid_receipts = [
                      None,
                      self.valid_receipt("b" * 40),
                      {**self.valid_receipt(), "subject_sha256": "short"},
                      {**self.valid_receipt(), "attestation_id": "not-numeric"},
                      {
                          **self.valid_receipt(),
                          "attestation_url": "https://evil.example/attestations/123456789",
                      },
                  ]
                  for receipt in invalid_receipts:
                      with self.subTest(receipt=receipt):
                          payload = self.observed_payload(
                              self.sha,
                              receipt_minted=True,
                              release_receipt=receipt,
                          )
                          with self.assertRaisesRegex(
                              binding.SourceBindingError, "did not converge"
                          ):
                              binding.verify_runtime_probe(
                                  self.normalized,
                                  session=FakeSession(FakeResponse(payload)),
                                  timeout_seconds=0,
                              )

              def test_runtime_probe_rejects_missing_or_non_boolean_receipt_flag(self):
                  for value in (None, "false", 0, 1):
                      with self.subTest(value=value):
                          payload = self.observed_payload(self.sha)
                          payload["receipt_minted"] = value
                          with self.assertRaises(binding.SourceBindingError):
                              binding.verify_runtime_probe(
                                  self.normalized,
                                  session=FakeSession(FakeResponse(payload)),
                                  timeout_seconds=0,
                              )

              def test_runtime_probe_preserves_caller_query_verbatim(self):
          '''
          if tests.count(insertion_anchor) != 1:
              raise SystemExit('test insertion precondition failed')
          tests = tests.replace(insertion_anchor, new_tests, 1)
          test_path.write_text(tests, encoding='utf-8', newline='\n')

          for path in (
              Path('.github/workflows/apply-hf-source-binding-existing-receipt-fix.yml'),
              Path('.github/workflows/apply-hf-source-binding-existing-receipt-fix-v2.yml'),
          ):
              path.unlink(missing_ok=True)
          PY

      - name: Run exact source-binding contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            .github/scripts/hf_space_source_binding.py \
            .github/scripts/test_hf_space_source_binding.py
          python .github/scripts/test_hf_space_source_binding.py
          python .github/scripts/test_hf_publisher_lock.py
          git diff --check

      - name: Commit tested permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git diff --cached --check
          git commit -s -m "fix(hf): accept source-bound existing release receipts"
          git push origin HEAD:fix/hf-source-binding-existing-receipt-20260904
