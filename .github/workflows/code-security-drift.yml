name: Code Security Config Drift

# Verifies that organization code-security configuration 252588 remains enforced
# on every non-archived repository and remains the default for new repositories.
#
# Authentication is fail-closed. A short-lived qillqaq App token with organization
# Administration:read is preferred. Until the organization approves that tracked
# App permission, the existing governed SZL_GITHUB_TOKEN is an explicit fallback.
# Every configured candidate must return HTTP 200 from the exact read-only endpoint
# before the checker receives it. Values, lengths, prefixes, hashes, identities,
# headers, scopes, and response bodies are never recorded.

on:
  schedule:
    - cron: "37 7 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/scripts/code_security_drift.py"
      - ".github/scripts/run_code_security_drift_with_fallback.py"
      - ".github/scripts/test_code_security_drift.py"
      - ".github/data/code_security_allowlist.json"
      - ".github/workflows/code-security-drift.yml"
      - ".governance/github-app-manifest.json"

permissions:
  contents: read

concurrency:
  group: code-security-drift-${{ github.ref }}
  cancel-in-progress: true

env:
  REPORT_PATH: reports/code-security-drift.json

jobs:
  check:
    name: Managed security config attached + enforced everywhere
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile and self-test the drift and credential contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            .github/scripts/code_security_drift.py \
            .github/scripts/run_code_security_drift_with_fallback.py \
            .github/scripts/test_code_security_drift.py
          python .github/scripts/test_code_security_drift.py
          git diff --check

      - name: Mint preferred qillqaq organization token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.QILLQAQ_CLIENT_ID }}
          private-key: ${{ secrets.QILLQAQ_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-administration: read

      - name: Select an authorized governed credential and check the organization
        id: drift
        env:
          QILLQAQ_ORG_TOKEN: ${{ steps.app-token.outputs.token }}
          SZL_GITHUB_TOKEN: ${{ secrets.SZL_GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          mkdir -p "$(dirname "$REPORT_PATH")"
          python .github/scripts/run_code_security_drift_with_fallback.py \
            2>&1 | tee /tmp/drift-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Normalize or create bounded evidence for every outcome
        if: always()
        env:
          APP_TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
          DRIFT_EXIT: ${{ steps.drift.outputs.exit_code }}
        shell: python
        run: |
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path(os.environ["REPORT_PATH"])
          now = datetime.now(timezone.utc).isoformat()
          run_url = None
          if all(
              os.environ.get(key)
              for key in ("GITHUB_SERVER_URL", "GITHUB_REPOSITORY", "GITHUB_RUN_ID")
          ):
              run_url = (
                  f"{os.environ['GITHUB_SERVER_URL']}/"
                  f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              )
          workflow = {
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_url": run_url,
              "preferred_app_token_outcome": (
                  os.environ.get("APP_TOKEN_OUTCOME") or "not_completed"
              ),
          }
          if path.is_file() and path.stat().st_size:
              report = json.loads(path.read_text(encoding="utf-8"))
              report.setdefault("schema", "szl.code-security-drift/v2")
              report.setdefault("generated_at", now)
              report.setdefault(
                  "organization",
                  report.get("org") or os.environ.get("GITHUB_REPOSITORY_OWNER"),
              )
              report.setdefault("generation", os.environ.get("GITHUB_SHA"))
              report["workflow"] = workflow
          else:
              exit_text = str(os.environ.get("DRIFT_EXIT") or "2")
              exit_code = int(exit_text) if exit_text.isdigit() else 2
              report = {
                  "schema": "szl.code-security-drift/v2",
                  "generated_at": now,
                  "organization": os.environ.get("GITHUB_REPOSITORY_OWNER"),
                  "generation": os.environ.get("GITHUB_SHA"),
                  "canonical_configuration_id": 252588,
                  "status": "NOT_VERIFIED",
                  "credential_selection": {"selected": None},
                  "summary": {"ok": 0, "warning": 0, "error": 1},
                  "exit_code": exit_code,
                  "workflow": workflow,
                  "detail": "The governed credential selector did not produce its ordinary report. See the bound workflow logs; no credential value is recorded.",
              }
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

      - name: Upload immutable drift evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-security-drift-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish human-readable summary
        if: always()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["REPORT_PATH"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Organization code-security drift\n\n")
              if not path.exists():
                  out.write("- status: `NOT_VERIFIED`\n- report: missing\n")
              else:
                  report = json.loads(path.read_text(encoding="utf-8"))
                  errors = report.get("errors") or []
                  warnings = report.get("warnings") or []
                  selection = report.get("credential_selection") or {}
                  out.write(f"- status: `{report.get('status')}`\n")
                  out.write("- canonical configuration: `252588`\n")
                  out.write(
                      f"- credential class: `{selection.get('selected')}`\n"
                  )
                  out.write(f"- errors: `{len(errors)}`\n")
                  out.write(f"- warnings: `{len(warnings)}`\n")
                  totals = report.get("totals") or {}
                  if totals:
                      out.write(
                          f"- organization repositories: `{totals.get('org_repos')}`\n"
                      )
                      out.write(
                          f"- enforced under canonical: `{totals.get('enforced_under_canonical')}`\n"
                      )

      - name: Alert the team on drift or check failure
        if: always() && github.event_name == 'schedule' && steps.drift.outputs.exit_code != '0'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CHECK_EXIT: ${{ steps.drift.outputs.exit_code }}
        run: |
          set -u
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL not set; cannot page the alert relay."
            exit 0
          fi
          payload="$(python .github/scripts/build_drift_alert.py \
            --exit-code "${CHECK_EXIT:-2}" \
            --report "$REPORT_PATH" \
            --drift-output /tmp/drift-output.txt)"
          code="$(curl -sS -o /tmp/alert-resp.txt -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data "$payload" "$SLACK_WEBHOOK_URL" || echo 000)"
          echo "Alert relay responded HTTP ${code}"
          if [ "${code#2}" = "${code}" ]; then
            echo "::warning::Alert relay did not return 2xx (got ${code})."
          fi

      - name: Enforce the authenticated organization result
        if: always()
        env:
          CHECK_EXIT: ${{ steps.drift.outputs.exit_code }}
        run: |
          case "${CHECK_EXIT:-2}" in
            0)
              echo "Managed security config 252588 is enforced on every non-archived repo and is the default for new repos."
              ;;
            1)
              echo "::error::Managed-security-config drift detected. See the immutable report artifact."
              exit 1
              ;;
            *)
              echo "::error::No governed credential completed the organization drift check. This is fail-closed, not a neutral skip."
              exit 1
              ;;
          esac
