name: SDA Reconciliation Controller Retirement

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/test_sda_reconcile_retired.py
      - .github/workflows/sda-reconcile-retirement.yml
      - .github/workflows/sda-shared-source-reconcile.yml
      - .github/scripts/sda_shared_source_reconcile.py
      - .github/data/sda_shared_source_reconcile.json
  push:
    branches: [main]
    paths:
      - .github/scripts/test_sda_reconcile_retired.py
      - .github/workflows/sda-reconcile-retirement.yml
      - .github/workflows/sda-shared-source-reconcile.yml
      - .github/scripts/sda_shared_source_reconcile.py
      - .github/data/sda_shared_source_reconcile.json

permissions:
  contents: read

jobs:
  verify:
    name: Completed fixed-SHA controller remains retired
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile and enforce the retirement contract
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/test_sda_reconcile_retired.py
          python .github/scripts/test_sda_reconcile_retired.py
          git diff --check
