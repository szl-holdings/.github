name: Temporary effect-policy export

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-export-effect-policy.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upload policy source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temporary-effect-policy-source
          path: .github/data/control_plane_effect_policy.json
          if-no-files-found: error
          retention-days: 1
