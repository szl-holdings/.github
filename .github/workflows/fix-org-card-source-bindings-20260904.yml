name: Repair organization-card source bindings

on:
  push:
    branches:
      - fix/org-card-source-bindings-20260904
    paths:
      - .github/workflows/fix-org-card-source-bindings-20260904.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/org-card-source-bindings-20260904
          fetch-depth: 1

      - name: Bind the five preserved governance artifacts and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/public_front_door_check.py')
          text = path.read_text(encoding='utf-8')
          needle = '    WEBP_DESTINATION: CANONICAL_WEBP,\n}'
          replacement = '''    WEBP_DESTINATION: CANONICAL_WEBP,
    "GOVERNANCE.md": "huggingface/org-card/GOVERNANCE.md",
    "MODELS.txt": "huggingface/org-card/MODELS.txt",
    "SEVEN_SPACES.md": "huggingface/org-card/SEVEN_SPACES.md",
    "SPACE_PROVENANCE_FRONTIER.json": "huggingface/org-card/SPACE_PROVENANCE_FRONTIER.json",
    "seven-spaces.yaml": "huggingface/org-card/seven-spaces.yaml",
}'''
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'expected one publication-binding terminator; found {count}')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-org-card-source-bindings-20260904.yml

      - name: Verify the exact failed contract and parser suite
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/public_front_door_check.py
          python3 .github/scripts/test_public_front_door_check.py
          python3 -m py_compile .github/scripts/public_front_door_check.py

      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Stephen P. Lutar Jr."
          git config user.email "stephenlutar2@gmail.com"
          git add .github/scripts/public_front_door_check.py
          git commit -m "fix(hf): bind preserved organization-card artifacts" -m "Extend the fail-closed publication inventory to the five governance files already added to the exact manifest. The live publisher contract and allowed-deletion set remain unchanged."
          git push origin HEAD:fix/org-card-source-bindings-20260904
