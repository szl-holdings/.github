name: Regenerate attic after verified metadata repair

on:
  push:
    branches:
      - fix/trusted-secret-health-attic-20260831
    paths:
      - .github/workflows/regenerate-attic-after-metadata.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: regenerate-attic-after-metadata
  cancel-in-progress: false

jobs:
  regenerate:
    name: Generate, verify, and commit ATTIC
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/trusted-secret-health-attic-20260831
          fetch-depth: 1
          persist-credentials: true

      - name: Generate and verify live public attic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_attic_index.py --write
          python scripts/build_attic_index.py --check
          git diff --check
          test "$(git diff --name-only)" = "ATTIC.md"

      - name: Commit verified generated index
        shell: bash
        env:
          BRANCH: fix/trusted-secret-health-attic-20260831
        run: |
          set -euo pipefail
          git config user.name 'SZL CI'
          git config user.email 'noreply@szlholdings.ai'
          git add ATTIC.md
          git diff --cached --quiet && { echo 'ATTIC.md already current.'; exit 0; }
          git commit -m 'docs: regenerate verified public attic index'
          git push origin "HEAD:${BRANCH}"
