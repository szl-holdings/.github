              path = ROOT / relative
              if not path.is_file():
                  raise RuntimeError(f"missing expected retired path: {relative}")
              path.unlink()

          # Fail closed if executable governance still contains the retired
          # acronym, parser identifiers, caller names, or commit trailer token.
          forbidden = re.compile(
              r"\bDCO\b|dco_check|test_dco|reusable-dco|doctrine-required-dco|Signed-off-by:",
              re.I,
          )
          active_targets = []
          active_targets.extend((ROOT / ".github/workflows").glob("*.yml"))
          active_targets.extend((ROOT / ".github/workflows").glob("*.yaml"))
          active_targets.extend((ROOT / ".github/scripts").glob("*.py"))
          active_targets.extend(
              ROOT / relative
              for relative in (
                  ".governance/ruleset-main.json",
                  ".governance/ruleset-release.json",
                  "WORKFLOWS.md",
              )
          )
          survivors = []
          for path in active_targets:
              match = forbidden.search(path.read_text(encoding="utf-8", errors="replace"))
              if match:
                  survivors.append(f"{path.relative_to(ROOT)}:{match.group(0)}")
          if survivors:
              raise RuntimeError("retired enforcement references survived: " + ", ".join(survivors))
          PY

      - name: Verify migrated governance locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/scripts/*.py
          python3 .github/scripts/test_solo_builder_provenance.py
          python3 .github/scripts/verify_forge9_governance.py
          python3 .github/scripts/run_forge9_gate.py gate/verify-all
          git diff --check
          test -f .github/workflows/solo-builder-provenance.yml
          test ! -e .github/workflows/dco.yml
          test ! -e .github/workflows/reusable-dco.yml
          test ! -e .github/workflows/doctrine-required-dco.yml
          test ! -e .github/scripts/dco_check.py
          test ! -e .github/workflows/apply-native-solo-builder-governance.yml
          test ! -e .github/workflows/inspect-central-dco-remnants.yml

      - name: Commit exact migration to branch
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ secrets.SZL_GITHUB_TOKEN }}
          EXPECTED_BRANCH: chore/native-solo-builder-provenance-20260831
        run: |
          set -euo pipefail
          test -n "$GH_PUSH_TOKEN"
          git config user.name "SZL Governance Bot"
          git config user.email "noreply@szlholdings.ai"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "Migration produced no changes." >&2; exit 1; }
          git commit -m "ci: replace sign-off enforcement with solo-builder provenance"
          remote="https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote" "HEAD:refs/heads/${EXPECTED_BRANCH}"
