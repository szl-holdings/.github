name: Apply native solo-builder governance migration

on:
  push:
    branches:
      - chore/native-solo-builder-provenance-20260831
    paths:
      - .github/workflows/apply-native-solo-builder-governance.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: native-solo-builder-governance-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Replace legacy sign-off machinery with native provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout exact migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/native-solo-builder-provenance-20260831
          fetch-depth: 2
          persist-credentials: false

      - name: Assert bounded migration source
        shell: bash
        env:
          EXPECTED_BRANCH: chore/native-solo-builder-provenance-20260831
          EXPECTED_PARENT_SHA: 83d0641820b1bb8c58776c427d0c677db4c3900c
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test -f .github/workflows/dco.yml
          test -f .github/workflows/reusable-dco.yml
          test -f .github/workflows/doctrine-required-dco.yml
          test -f .github/scripts/dco_check.py
          test -f .github/scripts/verify_forge9_governance.py
          test -f .governance/ruleset-main.json
          test -f .governance/ruleset-release.json

      - name: Apply fail-closed source migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          ROOT = Path.cwd()


          def read(relative: str) -> str:
              return (ROOT / relative).read_text(encoding="utf-8")


          def write(relative: str, value: str) -> None:
              (ROOT / relative).write_text(value, encoding="utf-8")


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one literal match, observed {count}")
              return text.replace(old, new, 1)


          def regex_once(
              text: str,
              pattern: str,
              replacement: str,
              label: str,
              flags: int = 0,
          ) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one regex match, observed {count}")
              return updated


          provenance_workflow = r'''name: Required solo-builder provenance

on:
  pull_request_target:
    branches:
      - main
      - 'release/*'
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - edited
  merge_group:
    types: [checks_requested]

# Protected-base metadata validation only. Candidate repository content is
# never checked out or executed, and this workflow consumes no secrets.
permissions: {}

jobs:
  pull-request-provenance:
    name: Exact-head organization provenance
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify protected event and organization-owned exact head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ACTION: ${{ github.event.action }}
          EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EXPECTED_ACTION" in
            opened|synchronize|reopened|ready_for_review|converted_to_draft|edited) ;;
            *) echo "Unsupported pull-request action: $EXPECTED_ACTION" >&2; exit 1 ;;
          esac
          [[ "$EXPECTED_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_BASE_REPOSITORY" = "$GITHUB_REPOSITORY"
          case "$EXPECTED_BASE_REF" in
            main|release/*) ;;
            *) echo "Unsupported governed base: $EXPECTED_BASE_REF" >&2; exit 1 ;;
          esac
          case "$EXPECTED_HEAD_REPOSITORY" in
            szl-holdings/*) ;;
            *) echo "Solo-builder policy requires an organization-owned head repository: $EXPECTED_HEAD_REPOSITORY" >&2; exit 1 ;;
          esac
          test -n "$EXPECTED_HEAD_REF"

          current_pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$EXPECTED_PR_NUMBER")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg base_ref "$EXPECTED_BASE_REF" \
            --arg base_sha "$EXPECTED_BASE_SHA" \
            --arg head_repository "$EXPECTED_HEAD_REPOSITORY" \
            --arg head_ref "$EXPECTED_HEAD_REF" \
            --arg head_sha "$EXPECTED_HEAD_SHA" '
              .state == "open"
              and .draft == false
              and .base.repo.full_name == $repository
              and .base.ref == $base_ref
              and .base.sha == $base_sha
              and .head.repo.full_name == $head_repository
              and .head.ref == $head_ref
              and .head.sha == $head_sha
            ' <<<"$current_pr" >/dev/null

          live_base_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$EXPECTED_BASE_REF" \
              --jq '.object.sha'
          )"
          test "$live_base_sha" = "$EXPECTED_BASE_SHA"

          comparison="$(
            gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_BASE_SHA...$EXPECTED_HEAD_SHA"
          )"
          jq -e --arg base "$EXPECTED_BASE_SHA" '
              .status == "ahead"
              and .ahead_by >= 1
              and .behind_by == 0
              and .base_commit.sha == $base
              and .merge_base_commit.sha == $base
            ' <<<"$comparison" >/dev/null

          test "$(
            gh api "repos/$GITHUB_REPOSITORY/pulls/$EXPECTED_PR_NUMBER" --jq '.head.sha'
          )" = "$EXPECTED_HEAD_SHA"
          test "$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$EXPECTED_BASE_REF" --jq '.object.sha'
          )" = "$EXPECTED_BASE_SHA"

  merge-group-provenance:
    name: Exact merge-group provenance
    if: github.event_name == 'merge_group'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify protected merge-group graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ACTION: ${{ github.event.action }}
          EXPECTED_BASE_REF: ${{ github.event.merge_group.base_ref }}
          EXPECTED_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          EXPECTED_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_ACTION" = "checks_requested"
          test "$EXPECTED_BASE_REF" = "refs/heads/main"
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HEAD_REF" =~ ^refs/heads/gh-readonly-queue/main/pr-([1-9][0-9]*)-([0-9a-f]{40})$ ]]
          test "${BASH_REMATCH[2]}" = "$EXPECTED_BASE_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_HEAD_SHA"
          test "$GITHUB_REF" = "$EXPECTED_HEAD_REF"

          live_base_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$live_base_sha" = "$EXPECTED_BASE_SHA"
          queue_ref="${EXPECTED_HEAD_REF#refs/}"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/$queue_ref" --jq '.object.sha')" = "$EXPECTED_HEAD_SHA"

          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_BASE_SHA...$EXPECTED_HEAD_SHA")"
          jq -e --arg base "$EXPECTED_BASE_SHA" '
              .status == "ahead"
              and .ahead_by >= 1
              and .behind_by == 0
              and .base_commit.sha == $base
              and .merge_base_commit.sha == $base
            ' <<<"$comparison" >/dev/null
'''
          write(".github/workflows/solo-builder-provenance.yml", provenance_workflow)

          provenance_test = r'''#!/usr/bin/env python3
"""Static contract for protected solo-builder provenance validation."""

from pathlib import Path
import re
import unittest


ROOT = Path(__file__).resolve().parents[2]
WORKFLOW = ROOT / ".github" / "workflows" / "solo-builder-provenance.yml"


class SoloBuilderProvenanceTests(unittest.TestCase):
    def setUp(self) -> None:
        self.text = WORKFLOW.read_text(encoding="utf-8")

    def test_protected_exact_head_contract(self) -> None:
        for marker in (
            "name: Required solo-builder provenance",
            "pull_request_target:",
            "merge_group:",
            "permissions: {}",
            "pull-request-provenance:",
            "merge-group-provenance:",
            "EXPECTED_BASE_REPOSITORY:",
            "EXPECTED_BASE_SHA:",
            "EXPECTED_HEAD_REPOSITORY:",
            "EXPECTED_HEAD_SHA:",
            "szl-holdings/*",
            '.state == "open"',
            ".draft == false",
            ".base.sha == $base_sha",
            ".head.sha == $head_sha",
            "git/ref/heads/$EXPECTED_BASE_REF",
            "merge_base_commit.sha == $base",
            "gh-readonly-queue/main/pr-",
        ):
            self.assertIn(marker, self.text)

    def test_candidate_code_and_credentials_are_never_consumed(self) -> None:
        self.assertNotRegex(self.text, r"(?m)^\s*(?:-\s*)?uses:\s")
        for forbidden in (
            "actions/checkout",
            "persist-credentials",
            "GITHUB_WORKSPACE",
            "secrets.",
            "contents: write",
            "statuses: write",
            "id-token:",
            "workflow_dispatch:",
            "\n  push:\n",
            "Signed-" + "off-by",
        ):
            self.assertNotIn(forbidden, self.text)

    def test_only_governed_bases_and_events_are_admitted(self) -> None:
        self.assertIn("main|release/*", self.text)
        self.assertIn('test "$EXPECTED_BASE_REF" = "refs/heads/main"', self.text)
        self.assertIn('test "$EXPECTED_ACTION" = "checks_requested"', self.text)
        self.assertEqual(self.text.count("pull_request_target:"), 1)
        self.assertEqual(self.text.count("merge_group:"), 1)


if __name__ == "__main__":
    unittest.main()
'''
          write(".github/scripts/test_solo_builder_provenance.py", provenance_test)

          # Align committed intended rulesets with the already-verified live state.
