name: trivy

# Trivy filesystem vulnerability scan. PR + weekly cron. SARIF -> Code Scanning.
# Fails on CRITICAL+HIGH. ADDITIVE. Doctrine v11 LOCKED 749/14/163 locked_at c7c0ba17

on:
  pull_request:
  schedule:
    - cron: '41 3 * * 1'   # weekly Monday 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  # ghcr.io serves the Trivy DB under an aggressive global rate limit
  # (TOOMANYREQUESTS), which intermittently makes the DB download fail and the
  # scan abort before writing SARIF. Point the DB/Java-DB pulls at the upstream
  # AWS ECR Public mirror, which is not rate-limited the same way.
  # Refs: aquasecurity/trivy-action#389, trivy.dev troubleshooting.
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify SARIF reporting behavior
        run: python3 .github/scripts/test_trivy_reporting.py

      - name: Remove stale SARIF before scanning
        run: python3 .github/scripts/trivy_reporting.py prepare

      - name: Trivy filesystem scan (SARIF)
        id: sarif-scan
        # SARIF generation feeds Code Scanning and is advisory; a transient DB
        # download hiccup here must not fail the job. The CRITICAL+HIGH fail
        # gate below (if: always()) is the authoritative pass/fail signal.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          github-pat: ${{ github.token }}

      - name: Report SARIF availability
        id: sarif-report
        if: always()
        env:
          TRIVY_SCAN_OUTCOME: ${{ steps.sarif-scan.outcome }}
        run: python3 .github/scripts/trivy_reporting.py report

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && steps.sarif-report.outputs.available == 'true'
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy fail gate (CRITICAL+HIGH)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          github-pat: ${{ github.token }}
