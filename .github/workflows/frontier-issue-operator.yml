name: Frontier issue operator

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/frontier_issue_operator.py"
      - ".github/workflows/frontier-issue-operator.yml"
      - ".github/workflows/frontier-issue-operator-contract.yml"
      - "tests/test_frontier_issue_operator*.py"
      - "config/estate-pr-authorizations.json"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Enqueue one exact protected authorization; never merge immediately"
        required: false
        type: boolean
        default: false
      authorization_id:
        description: "Exact unexpired ID in the protected authorization file"
        required: false
        type: string
      acknowledgement:
        description: "For apply: ENQUEUE_EXACT_REVIEWED_HEAD"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: frontier-issue-operator
  cancel-in-progress: false

env:
  REPORT_PATH: frontier-issue-operator.json

jobs:
  validate:
    name: Validate without organization credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run network-free operator contracts
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_frontier_issue_operator.py tests/test_frontier_issue_operator_safety.py tests/test_frontier_issue_operator_authority.py
          python -m py_compile .github/scripts/frontier_issue_operator.py

  operate:
    name: Observe public estate and request only authorized queue entries
    needs: validate
    if: github.repository == 'szl-holdings/.github' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Execute bounded organization reconciliation
        env:
          # Existing governed reader/writer alias; no organization-admin default.
          # A read-only or repository-scoped token cannot silently gain queue scope.
          SZL_ORG_TOKEN: ${{ secrets.ORG_REPO_WORKFLOW_TOKEN || secrets.SZL_GITHUB_TOKEN || github.token }}
          SZL_REPORT_TOKEN: ${{ github.token }}
          APPLY_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--org szl-holdings --report "$REPORT_PATH" --publish-command-center)
          if [ "$APPLY_REQUESTED" = "true" ]; then
            args+=(--apply --from-dispatch-event)
          fi
          python .github/scripts/frontier_issue_operator.py "${args[@]}"
      - name: Verify public observation receipt
        if: always()
        shell: bash
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          payload = json.loads(Path("frontier-issue-operator.json").read_text(encoding="utf-8"))
          if payload.get("schema") != "szl.frontier-issue-operator/v1":
              raise SystemExit("unexpected receipt schema")
          if payload.get("token_value_recorded") is not False:
              raise SystemExit("receipt boundary is unavailable")
          coverage = payload.get("coverage") or {}
          if coverage.get("scope") != "public-search-visible-only" or coverage.get("complete_organization") is not False:
              raise SystemExit("receipt overstates its inventory scope")
          print(json.dumps(payload.get("summary"), indent=2, sort_keys=True))
          PYCODE
      - name: Upload public observation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontier-issue-operator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 90
