name: Frontier issue operator

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/frontier_issue_operator.py"
      - ".github/workflows/frontier-issue-operator.yml"
      - ".github/workflows/frontier-issue-operator-contract.yml"
      - "tests/test_frontier_issue_operator*.py"
      - "config/estate-pr-authorizations.json"
      - ".github/scripts/frontier_receipt_check.py"
      - "tests/test_frontier_receipt_check.py"
      - "requirements/frontier-observer-tests.lock"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Enqueue one exact protected authorization; never merge immediately"
        required: false
        type: boolean
        default: false
      authorization_id:
        description: "Exact unexpired ID in the protected authorization file"
        required: false
        type: string
      acknowledgement:
        description: "For apply: ENQUEUE_EXACT_REVIEWED_HEAD"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: frontier-issue-operator
  cancel-in-progress: false

env:
  REPORT_PATH: frontier-issue-operator.json

jobs:
  validate:
    name: Validate without organization credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Run network-free operator contracts
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/frontier-test-venv"
          test ! -e "$venv"
          python -I -m venv "$venv"
          "$venv/bin/python" -I -m pip --isolated install --disable-pip-version-check \
            --no-cache-dir --require-hashes --only-binary=:all: --index-url https://pypi.org/simple \
            -r requirements/frontier-observer-tests.lock
          "$venv/bin/python" -I -m pip check
          "$venv/bin/python" -I -c 'from importlib.metadata import version; import sys; print(sys.version); print("pytest=" + version("pytest")); sys.exit(0 if version("pytest") == "9.0.3" else 1)'
          "$venv/bin/python" -I -m pytest -q tests/test_frontier_issue_operator.py tests/test_frontier_issue_operator_safety.py tests/test_frontier_issue_operator_authority.py tests/test_frontier_receipt_check.py
          "$venv/bin/python" -I -O -m pytest -q tests/test_frontier_issue_operator.py tests/test_frontier_issue_operator_safety.py tests/test_frontier_issue_operator_authority.py tests/test_frontier_receipt_check.py
          "$venv/bin/python" -I -m py_compile .github/scripts/frontier_issue_operator.py .github/scripts/frontier_receipt_check.py

  operate:
    name: Observe public estate and request only authorized queue entries
    needs: validate
    if: github.repository == 'szl-holdings/.github' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Execute bounded organization reconciliation
        env:
          # Existing governed reader/writer alias; no organization-admin default.
          # A read-only or repository-scoped token cannot silently gain queue scope.
          SZL_ORG_TOKEN: ${{ secrets.ORG_REPO_WORKFLOW_TOKEN || secrets.SZL_GITHUB_TOKEN || github.token }}
          SZL_REPORT_TOKEN: ${{ github.token }}
          APPLY_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--org szl-holdings --report "$REPORT_PATH" --publish-command-center)
          if [ "$APPLY_REQUESTED" = "true" ]; then
            args+=(--apply --from-dispatch-event)
          fi
          python .github/scripts/frontier_issue_operator.py "${args[@]}"
      - name: Verify and stage exact public receipt bytes
        id: verify_receipt
        if: ${{ always() && !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I -B .github/scripts/frontier_receipt_check.py
      - name: Upload public observation receipt
        if: ${{ always() && !cancelled() && steps.verify_receipt.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontier-issue-operator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontier-verified-receipt/frontier-issue-operator.json
          if-no-files-found: error
          retention-days: 90
