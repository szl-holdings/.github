name: Reusable — CodeQL

# CodeQL static analysis. Callable from any repo in the org.
#
# Pass `languages` as a JSON array string, e.g. '["javascript-typescript"]'
# or '["javascript-typescript","python"]'. Default: javascript-typescript only.

on:
  workflow_call:
    inputs:
      languages:
        description: 'JSON array of CodeQL languages: javascript-typescript, python, go, java-kotlin, ruby, swift, csharp, cpp'
        required: false
        type: string
        default: '["javascript-typescript"]'
      build-mode:
        description: 'CodeQL build mode (none, autobuild, manual)'
        required: false
        type: string
        default: 'none'
      queries:
        description: 'CodeQL query suite (default, security-extended, security-and-quality)'
        required: false
        type: string
        default: 'security-and-quality'

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ inputs.build-mode }}
          queries: ${{ inputs.queries }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
