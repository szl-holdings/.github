name: Audit finalizer guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read-only finalizer guard audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate finalizer contract and mutation boundary
        run: |
          set -euo pipefail
          python .github/tests/test_finalize_hf_adaptive_theatre_v3.py -v
          python -m py_compile .github/scripts/finalize_hf_adaptive_theatre_v3.py
          script=.github/scripts/finalize_hf_adaptive_theatre_v3.py
          ! grep -E 'force[[:space:]_-]*merge|update[_-]ref|branches/.*/protection|dismissals|"force"[[:space:]]*:[[:space:]]*true' "$script"
          git diff --check
