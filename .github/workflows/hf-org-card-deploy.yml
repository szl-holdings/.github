name: Hugging Face organization front door

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "huggingface/org-card/**"
      - "huggingface/org-card.manifest.json"
      - "profile/assets/**"
      - "profile/assets/evidence-lattice-v2.webp"
      - ".github/scripts/hf_static_space_deploy.py"
      - ".github/scripts/hf_space_visibility.py"
      - ".github/scripts/hf_org_card_embed_check.py"
      - ".github/scripts/public_front_door_check.py"
      - ".github/scripts/test_hf_space_visibility.py"
      - ".github/scripts/test_hf_org_card_embed_check.py"
      - ".github/scripts/test_hf_static_space_deploy.py"
      - ".github/scripts/test_public_front_door_check.py"
      - ".github/workflows/hf-org-card-deploy.yml"
      - ".github/workflows/hf-org-card-embed-check.yml"

permissions:
  contents: read

concurrency:
  group: hf-org-card-main
  cancel-in-progress: false

jobs:
  publish-and-verify:
    name: Publish exact source and verify served revision
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test publication contract
        run: >-
          python -m unittest discover
          -s .github/scripts
          -p test_hf_static_space_deploy.py

      - name: Test public visibility contract
        run: >-
          python -m unittest discover
          -s .github/scripts
          -p test_hf_space_visibility.py

      - name: Test public front-door contract
        run: >-
          python -m unittest discover
          -s .github/scripts
          -p test_public_front_door_check.py

      - name: Test org-card embed contract
        run: >-
          python -m unittest discover
          -s .github/scripts
          -p test_hf_org_card_embed_check.py

      - name: Run org-card embed hardening check
        run: python .github/scripts/hf_org_card_embed_check.py

      - name: Verify public front-door contract
        run: python .github/scripts/public_front_door_check.py

      - name: Install exact Hub client
        run: python -m pip install --disable-pip-version-check "huggingface_hub==1.19.0"

      - name: Restore public organization-card visibility
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          python .github/scripts/hf_space_visibility.py
          --repo-id SZLHOLDINGS/README
          --wait-seconds 120
          --report hf-org-card-visibility-pre.json

      - name: Publish and verify exact source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SZL_PUBLICATION_ENVIRONMENT: production
        run: >-
          python .github/scripts/hf_static_space_deploy.py
          --repo-root .
          --manifest huggingface/org-card.manifest.json
          --source-sha "${GITHUB_SHA}"
          --publish
          --wait-seconds 600
          --report hf-org-card-deploy-report.json

      - name: Confirm public visibility after publication
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          python .github/scripts/hf_space_visibility.py
          --repo-id SZLHOLDINGS/README
          --check-only
          --wait-seconds 120
          --report hf-org-card-visibility-post.json

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-org-card-deploy-evidence
          path: |
            hf-org-card-deploy-report.json
            hf-org-card-visibility-pre.json
            hf-org-card-visibility-post.json
          if-no-files-found: warn
          retention-days: 90
