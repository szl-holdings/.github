name: Hugging Face organization front door

on:
  push:
    branches: [main]
    paths:
      - "huggingface/org-card/**"
      - "huggingface/org-card.manifest.json"
      - "profile/assets/evidence-lattice-v2.webp"
      - ".github/scripts/hf_static_space_deploy.py"
      - ".github/workflows/hf-org-card-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-org-card-main
  cancel-in-progress: false

jobs:
  publish-and-verify:
    name: Publish exact source and verify served revision
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test publication contract
        run: >-
          python -m unittest discover
          -s .github/scripts
          -p test_hf_static_space_deploy.py

      - name: Verify public front-door contract
        run: python .github/scripts/public_front_door_check.py

      - name: Install exact Hub client
        run: python -m pip install --disable-pip-version-check "huggingface_hub==1.19.0"

      - name: Publish and verify exact source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          python .github/scripts/hf_static_space_deploy.py
          --repo-root .
          --manifest huggingface/org-card.manifest.json
          --source-sha "${GITHUB_SHA}"
          --publish
          --wait-seconds 600
          --report hf-org-card-deploy-report.json

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-org-card-deploy-evidence
          path: hf-org-card-deploy-report.json
          if-no-files-found: warn
          retention-days: 90
