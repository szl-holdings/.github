name: Frontier issue operator contract

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/frontier_issue_operator.py"
      - ".github/workflows/frontier-issue-operator.yml"
      - ".github/workflows/frontier-issue-operator-contract.yml"
      - "tests/test_frontier_issue_operator.py"
      - "tests/test_frontier_issue_operator_safety.py"
      - "tests/test_frontier_issue_operator_authority.py"
      - "config/estate-pr-authorizations.json"
      - ".github/scripts/frontier_receipt_check.py"
      - "tests/test_frontier_receipt_check.py"
      - "requirements/frontier-observer-tests.lock"
  push:
    branches: [main]
    paths:
      - ".github/scripts/frontier_issue_operator.py"
      - ".github/workflows/frontier-issue-operator.yml"
      - ".github/workflows/frontier-issue-operator-contract.yml"
      - "tests/test_frontier_issue_operator.py"
      - "tests/test_frontier_issue_operator_safety.py"
      - "tests/test_frontier_issue_operator_authority.py"
      - "config/estate-pr-authorizations.json"
      - ".github/scripts/frontier_receipt_check.py"
      - "tests/test_frontier_receipt_check.py"
      - "requirements/frontier-observer-tests.lock"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Fail-closed operator boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Run network-free contracts
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/frontier-test-venv"
          test ! -e "$venv"
          python -I -m venv "$venv"
          "$venv/bin/python" -I -m pip --isolated install --disable-pip-version-check \
            --no-cache-dir --require-hashes --only-binary=:all: --index-url https://pypi.org/simple \
            -r requirements/frontier-observer-tests.lock
          "$venv/bin/python" -I -m pip check
          "$venv/bin/python" -I -c 'from importlib.metadata import version; import sys; print(sys.version); print("pytest=" + version("pytest")); sys.exit(0 if version("pytest") == "9.0.3" else 1)'
          "$venv/bin/python" -I -m pytest -q tests/test_frontier_issue_operator.py tests/test_frontier_issue_operator_safety.py tests/test_frontier_issue_operator_authority.py tests/test_frontier_receipt_check.py
          "$venv/bin/python" -I -O -m pytest -q tests/test_frontier_issue_operator.py tests/test_frontier_issue_operator_safety.py tests/test_frontier_issue_operator_authority.py tests/test_frontier_receipt_check.py
          "$venv/bin/python" -I -m py_compile .github/scripts/frontier_issue_operator.py .github/scripts/frontier_receipt_check.py

      - name: Reject secret and protection mutation primitives
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E '/branches/.*/protection|/rulesets|actions/secrets|dependabot/secrets|codespaces/secrets|"(visibility|private|archived)"[[:space:]]*:' \
            .github/scripts/frontier_issue_operator.py

      - name: Diff hygiene
        run: git diff --check
