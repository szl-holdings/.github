# SPDX-License-Identifier: Apache-2.0
name: Repair post-merge alignment gates once

on:
  push:
    branches:
      - fix/postmerge-alignment-green-20260906
    paths:
      - .github/workflows/_repair_postmerge_alignment_once.yml

permissions:
  contents: write

concurrency:
  group: repair-postmerge-alignment-green-20260906
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'szl-holdings/.github' && github.ref == 'refs/heads/fix/postmerge-alignment-green-20260906'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/postmerge-alignment-green-20260906
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Apply bounded source, regression, and copy repairs
        env:
          PROFILE_B64: ""
          HUB_CARD_B64: ""
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/fix/postmerge-alignment-green-20260906 | cut -f1)" = "$GITHUB_SHA"

          python - <<'PY'
          from __future__ import annotations

          import base64
          import os
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label} anchor count changed: {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          deploy_path = Path(".github/scripts/hf_static_space_deploy.py")
          replace_once(
              deploy_path,
              "def fetch_github_main_sha(repository: str, token: str) -> str:\n    url = f\"https://api.github.com/repos/{quote(repository, safe='/')}/commits/main\"\n    request = Request(\n        url,\n        headers={\n            \"Accept\": \"application/vnd.github+json\",\n            \"Authorization\": f\"Bearer {token}\",\n            \"User-Agent\": \"szl-static-space-publisher/1\",\n            \"X-GitHub-Api-Version\": \"2022-11-28\",\n        },\n    )\n    with urlopen(request, timeout=20) as response:\n        if response.status != 200 or not same_origin(response.geturl(), url):\n            raise ContractError(\"protected main lookup left the GitHub API origin\")\n        payload = response.read(100_001)\n    if len(payload) > 100_000:\n        raise ContractError(\"protected main lookup response is oversized\")\n    sha = json.loads(payload).get(\"sha\")\n    if not isinstance(sha, str) or not SHA_RE.fullmatch(sha):\n        raise ContractError(\"protected main lookup returned an invalid SHA\")\n    return sha\n",
              "def fetch_github_main_sha(repository: str, token: str) -> str:\n    \"\"\"Resolve protected main through GitHub's compact, bounded ref endpoint.\"\"\"\n\n    url = (\n        f\"https://api.github.com/repos/{quote(repository, safe='/')}\"\n        \"/git/ref/heads/main\"\n    )\n    request = Request(\n        url,\n        headers={\n            \"Accept\": \"application/vnd.github+json\",\n            \"Authorization\": f\"Bearer {token}\",\n            \"User-Agent\": \"szl-static-space-publisher/1\",\n            \"X-GitHub-Api-Version\": \"2022-11-28\",\n        },\n    )\n    with urlopen(request, timeout=20) as response:\n        if response.status != 200 or not same_origin(response.geturl(), url):\n            raise ContractError(\"protected main lookup left the GitHub API origin\")\n        payload = response.read(65_537)\n    if len(payload) > 65_536:\n        raise ContractError(\"protected main lookup response is oversized\")\n    value = json.loads(payload)\n    reference = value.get(\"object\") if isinstance(value, dict) else None\n    sha = reference.get(\"sha\") if isinstance(reference, dict) else None\n    if not isinstance(sha, str) or not SHA_RE.fullmatch(sha):\n        raise ContractError(\"protected main lookup returned an invalid SHA\")\n    return sha\n",
              "compact protected-main lookup",
          )

          deploy_tests = Path(".github/scripts/test_hf_static_space_deploy.py")
          test_anchor = "    def test_space_stage_enum_is_normalized(self):\n"
          test_text = deploy_tests.read_text(encoding="utf-8")
          if test_text.count(test_anchor) != 1:
              raise SystemExit("static publisher test insertion anchor changed")
          deploy_tests.write_text(
              test_text.replace(test_anchor, '    def test_github_main_lookup_uses_compact_bounded_ref_endpoint(self):\n        expected = "a" * 40\n        expected_url = (\n            "https://api.github.com/repos/szl-holdings/.github"\n            "/git/ref/heads/main"\n        )\n\n        class FakeResponse:\n            status = 200\n\n            def __init__(self):\n                self.read_size = None\n\n            def __enter__(self):\n                return self\n\n            def __exit__(self, *_args):\n                return False\n\n            def geturl(self):\n                return expected_url\n\n            def read(self, size):\n                self.read_size = size\n                return json.dumps({"object": {"sha": expected}}).encode()\n\n        response = FakeResponse()\n        with mock.patch.object(deploy, "urlopen", return_value=response) as opener:\n            self.assertEqual(\n                deploy.fetch_github_main_sha(\n                    "szl-holdings/.github", "ghp_test_token_redacted"\n                ),\n                expected,\n            )\n        request = opener.call_args.args[0]\n        self.assertEqual(request.full_url, expected_url)\n        self.assertEqual(response.read_size, 65_537)\n\n    def test_github_main_lookup_fails_closed_on_oversized_ref_response(self):\n        expected_url = (\n            "https://api.github.com/repos/szl-holdings/.github"\n            "/git/ref/heads/main"\n        )\n\n        class OversizedResponse:\n            status = 200\n\n            def __enter__(self):\n                return self\n\n            def __exit__(self, *_args):\n                return False\n\n            def geturl(self):\n                return expected_url\n\n            def read(self, size):\n                return b"x" * size\n\n        with mock.patch.object(\n            deploy, "urlopen", return_value=OversizedResponse()\n        ):\n            with self.assertRaisesRegex(deploy.ContractError, "oversized"):\n                deploy.fetch_github_main_sha(\n                    "szl-holdings/.github", "ghp_test_token_redacted"\n                )\n\n' + test_anchor, 1),
              encoding="utf-8",
              newline="\n",
          )

          estate_tests = Path(".github/scripts/test_estate_alignment_contract.py")
          replace_once(
              estate_tests,
              '        self.assertIn("github.event.workflow_run.conclusion == \'success\'", live_job)\n        self.assertIn("github.event_name == \'schedule\'", live_job)\n        self.assertIn("github.event_name == \'workflow_dispatch\'", live_job)\n        self.assertNotIn("github.event_name == \'pull_request\'", live_job)\n        self.assertNotIn("github.event_name == \'push\'", live_job)\n',
              '        self.assertIn("github.event.workflow_run.conclusion == \'success\'", live_job)\n        self.assertIn("github.event_name == \'pull_request\'", live_job)\n        self.assertIn("github.event_name == \'schedule\'", live_job)\n        self.assertIn("github.event_name == \'workflow_dispatch\'", live_job)\n        self.assertIn("needs.local-contract.result == \'success\'", live_job)\n        self.assertNotIn("github.event_name == \'push\'", live_job)\n',
              "explicit pre-merge live-readback regression",
          )

          profile = base64.b64decode(os.environ["PROFILE_B64"], validate=True).decode("utf-8")
          hub_card = base64.b64decode(os.environ["HUB_CARD_B64"], validate=True).decode("utf-8")
          if len(profile.split()) > 430 or len(hub_card.split()) > 380:
              raise SystemExit("front-door copy budget exceeded before write")
          Path("profile/README.md").write_text(profile, encoding="utf-8", newline="\n")
          Path("huggingface/org-card/README.md").write_text(
              hub_card, encoding="utf-8", newline="\n"
          )
          PY

          python -m py_compile             .github/scripts/hf_static_space_deploy.py             .github/scripts/test_hf_static_space_deploy.py             .github/scripts/test_estate_alignment_contract.py

          python .github/scripts/test_estate_alignment_contract.py
          python .github/scripts/test_estate_alignment_org_card.py
          python -m unittest discover             -s .github/scripts             -p test_hf_static_space_deploy.py
          python -m unittest discover             -s .github/scripts             -p test_public_front_door_check.py
          python -m unittest discover             -s .github/scripts             -p 'test_hf_org_card_*publish*.py'
          python .github/scripts/public_front_door_check.py
          git diff --check

      - name: Commit permanent repair and retire controllers
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/postmerge-alignment-green-20260906
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git rm --             .github/workflows/_repair_postmerge_alignment_once.yml             .github/workflows/_materialize_estate_pr_live_test_once.yml
          git add --             .github/scripts/hf_static_space_deploy.py             .github/scripts/test_hf_static_space_deploy.py             .github/scripts/test_estate_alignment_contract.py             profile/README.md             huggingface/org-card/README.md
          git diff --cached --check
          git config user.name 'Lutar, Stephen P.'
          git config user.email 'stephenlutar2@gmail.com'
          git commit -s -m 'fix(alignment): restore post-merge publication gates'
          git push origin "HEAD:refs/heads/$branch"
