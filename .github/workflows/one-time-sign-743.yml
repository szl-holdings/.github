# Isolated operator only; not a production publisher or merge bypass.
name: Apply exact publisher import-review correction
"on":
  push:
    branches: [ops/queue-743-8331e2dc-20260915]
    paths: [.github/workflows/one-time-sign-743.yml]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: publisher-import-review-7dfd00cc
  cancel-in-progress: false
jobs:
  signed-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Apply the reviewed one-line import correction without unsigned history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing-evidence
          python3 - <<'PY'
          import ast, base64, datetime, hashlib, json, os, pathlib, urllib.request
          REPO='szl-holdings/.github'; BRANCH='fix/hf/bounded-read-transport-verified'
          HEAD='7dfd00cc65983be9496f84fa4cfa133f8f4b9c6a'; MAIN='0af851c120b01e645977b21d9b3abe0630e64240'
          PATH='.github/scripts/test_hf_http_boundaries.py'
          BEFORE='68018c1df4fdffa8e2cf87da23c21154e9208eb5'; AFTER='800ab6416e28c03d45b29169fe961fe8a686c0c6'
          report={'schema':'szl.exact-review-signature/v1','pr':746,'repository':REPO,'review_comment':4016419130,
              'expected_head':HEAD,'path':PATH,'expected_blob':AFTER,'run_id':os.environ['GITHUB_RUN_ID'],
              'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'state':'NOT_ATTEMPTED','mutation_attempts':0,
              'main_modified':False,'force_update':False,'provider_operations':0}
          def save():
              report['observed_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
              pathlib.Path('signing-evidence/receipt.json').write_text(json.dumps(report,indent=2)+'\n')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise RuntimeError('redirect prohibited')
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
          def api(path,payload=None):
              if not (path.startswith('/repos/'+REPO+'/') or path=='/graphql'): raise RuntimeError('origin boundary')
              req=urllib.request.Request('https://api.github.com'+path,data=None if payload is None else json.dumps(payload).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json','User-Agent':'SZL-exact-import-review/1.0'},method='GET' if payload is None else 'POST')
              with opener.open(req,timeout=25) as r: b=r.read(16*1024*1024+1)
              if len(b)>16*1024*1024: raise RuntimeError('response size bound')
              value=json.loads(b)
              if isinstance(value,dict) and value.get('errors'): raise RuntimeError('GraphQL rejected')
              return value
          def ref(branch): return api('/repos/'+REPO+'/git/ref/heads/'+branch)['object']['sha']
          def tree(sha):
              data=api('/repos/'+REPO+'/git/trees/'+sha+'?recursive=1')
              if data.get('truncated'): raise RuntimeError('incomplete tree')
              return {e['path']:(e['type'],e['mode'],e['sha']) for e in data['tree'] if e['type']!='tree'}
          def blob_id(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          try:
              if os.environ['GITHUB_RUN_ATTEMPT']!='1' or ref('main')!=MAIN or ref(BRANCH)!=HEAD:
                  raise RuntimeError('attempt or source movement')
              pr=api('/repos/'+REPO+'/pulls/746')
              if pr['state']!='open' or pr['head']['sha']!=HEAD or pr['head']['ref']!=BRANCH:
                  raise RuntimeError('PR identity changed')
              before_tree=tree(HEAD)
              if before_tree[PATH]!=('blob','100644',BEFORE): raise RuntimeError('preimage mismatch')
              source=api('/repos/'+REPO+'/git/blobs/'+BEFORE)
              old=base64.b64decode(source['content']); text=old.decode('utf-8')
              if blob_id(old)!=BEFORE or text.count('from unittest import mock')!=1: raise RuntimeError('unexpected source')
              new=text.replace('from unittest import mock','import unittest.mock as mock').encode()
              if blob_id(new)!=AFTER: raise RuntimeError('postimage mismatch')
              def semantics(raw):
                  module=ast.parse(raw)
                  module.body=[x for x in module.body if not isinstance(x,(ast.Import,ast.ImportFrom))]
                  return ast.dump(module,include_attributes=False)
              if semantics(old)!=semantics(new): raise RuntimeError('non-import semantics changed')
              expected=dict(before_tree); expected[PATH]=('blob','100644',AFTER)
              if ref('main')!=MAIN or ref(BRANCH)!=HEAD: raise RuntimeError('source moved')
              report.update(state='UNKNOWN_AFTER_ATTEMPT',mutation_attempts=1); save()
              result=api('/graphql',{'query':'mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}',
                  'variables':{'input':{'branch':{'repositoryNameWithOwner':REPO,'branchName':BRANCH},'expectedHeadOid':HEAD,
                      'message':{'headline':'test(hf): use one explicit unittest import style',
                          'body':'Address code-quality discussion4016419130. One import statement changes; 46 local boundary tests pass normally and optimized. Non-import AST is unchanged. Native requalification is required; no provider operation or independent approval.\n\nSigned-off-by: Stephen P. Lutar <stephenlutar2@gmail.com>'},
                      'fileChanges':{'additions':[{'path':PATH,'contents':base64.b64encode(new).decode()}]}}}})
              sha=result['data']['createCommitOnBranch']['commit']['oid']; report['candidate_revision']=sha; save()
              commit=api('/repos/'+REPO+'/git/commits/'+sha)
              report['verification']={k:commit['verification'].get(k) for k in ('verified','reason','verified_at')}
              report['actual_author']=commit['author']; report['actual_committer']=commit['committer']
              report['tree']=commit['tree']['sha']; report['parents']=[p['sha'] for p in commit['parents']]
              if tree(sha)!=expected or report['parents']!=[HEAD] or report['verification']['verified'] is not True:
                  raise RuntimeError('complete tree or signature not verified')
              if ref(BRANCH)!=sha: raise RuntimeError('candidate moved after commit')
              report.update(state='VERIFIED_EXACT_REVIEW_CORRECTION',sha256=hashlib.sha256(new).hexdigest()); save()
          except Exception as e:
              report['error_type']=type(e).__name__
              if report['mutation_attempts']==0: report['state']='PRECHECK_FAILED'
              try: report['branch_readback']=ref(BRANCH)
              except Exception as r: report['readback_error']=type(r).__name__
              save(); raise SystemExit('Review operation incomplete; inspect receipt without blind retry.')
          finally: save()
          print(json.dumps(report,indent=2))
          PY
      - name: Preserve actual signature and exact-tree receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publisher-import-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: signing-evidence/receipt.json
          if-no-files-found: error
          retention-days: 30
