# SPDX-License-Identifier: Apache-2.0
name: Repair estate alignment document markers once

on:
  push:
    branches:
      - feat/estate-alignment-current-main-20260905
    paths:
      - .github/workflows/_repair_estate_alignment_document_markers_once.yml

permissions:
  contents: write

concurrency:
  group: repair-estate-alignment-document-markers-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'szl-holdings/.github' && github.ref == 'refs/heads/feat/estate-alignment-current-main-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/estate-alignment-current-main-20260905
          fetch-depth: 1
          persist-credentials: true

      - name: Teach the measured-state migration the new document contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/reconcile_estate_alignment_live_v3.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''    replace_once(
              CONTROLLER,
              'require(snapshot.get("dataset_count") == 33, "dataset_count must be 33", failures)',
              'require(snapshot.get("dataset_count") == 34, "dataset_count must be 34", failures)',
          )
          '''.replace('          ', '')
          addition = anchor + '''    replace_once(
              CONTROLLER,
              '    for marker in ("16 portfolio Spaces", "44 models", "33 datasets"):\\n',
              '    for marker in ("17 portfolio Spaces", "45 models", "34 datasets"):\\n',
          )
          '''.replace('          ', '')
          if text.count(anchor) != 1:
              raise SystemExit('dataset-count migration anchor changed')
          path.write_text(text.replace(anchor, addition, 1), encoding='utf-8')
          PY
          python -m py_compile .github/scripts/reconcile_estate_alignment_live_v3.py
          git diff --check

      - name: Commit the bounded repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/estate-alignment-current-main-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git rm -- .github/workflows/_repair_estate_alignment_document_markers_once.yml
          git add -- .github/scripts/reconcile_estate_alignment_live_v3.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'fix(alignment): migrate document inventory markers'
          git push origin "HEAD:refs/heads/$branch"
