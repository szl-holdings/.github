name: Patch HF org-card preservation once

on:
  push:
    branches:
      - fix/hf-org-card-preserve-unmanaged-20260903
    paths:
      - .github/workflows/patch-hf-org-card-preservation-once.yml

permissions:
  contents: write

concurrency:
  group: patch-hf-org-card-preservation-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-org-card-preserve-unmanaged-20260903
          token: ${{ secrets.SZL_GITHUB_TOKEN || secrets.GH_PAT || github.token }}
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply bounded non-destructive publication repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, observed {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          manifest_path = Path("huggingface/org-card.manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("prune") is not True:
              raise SystemExit("org-card manifest no longer has the reviewed prune=true predecessor")
          if manifest.get("allowed_deletions") != []:
              raise SystemExit("org-card manifest deletion allowlist changed unexpectedly")
          manifest["prune"] = False
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          deploy_path = Path(".github/scripts/hf_static_space_deploy.py")
          replace_once(
              deploy_path,
              "    return candidates\n\n\ndef publish(\n",
              '''    return candidates


def remote_file_set_matches(
    contract: dict[str, Any], remote_files: set[str], wanted: set[str]
) -> bool:
    """Require exact parity when pruning and managed-file coverage otherwise."""

    if bool(contract.get("prune")):
        return remote_files == wanted
    return wanted.issubset(remote_files)


