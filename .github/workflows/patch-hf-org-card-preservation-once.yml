name: Patch HF org-card preservation once

on:
  push:
    branches:
      - fix/hf-org-card-preserve-unmanaged-20260903
    paths:
      - .github/workflows/patch-hf-org-card-preservation-once.yml

permissions:
  contents: write

concurrency:
  group: patch-hf-org-card-preservation-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-org-card-preserve-unmanaged-20260903
          token: ${{ secrets.SZL_GITHUB_TOKEN || secrets.GH_PAT || github.token }}
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply bounded non-destructive publication repair
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/patch_hf_preservation.py"
          printf '%s' '' | base64 --decode >> "$RUNNER_TEMP/patch_hf_preservation.py"
          printf '%s' '' | base64 --decode >> "$RUNNER_TEMP/patch_hf_preservation.py"
          python "$RUNNER_TEMP/patch_hf_preservation.py"
          python -m py_compile .github/scripts/hf_static_space_deploy.py .github/scripts/hf_org_card_autopublish.py
          python -m unittest discover -s .github/scripts -p 'test_hf_static_space_deploy.py'
          python -m unittest discover -s .github/scripts -p 'test_hf_org_card_autopublish.py'

      - name: Remove one-shot workflow and commit reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-hf-org-card-preservation-once.yml
          git diff --check
          git config user.name "szl-frontier-bot"
          git config user.email "stephenlutar2+frontier@gmail.com"
          git add .github/scripts/hf_static_space_deploy.py .github/scripts/test_hf_static_space_deploy.py .github/scripts/test_hf_org_card_autopublish.py huggingface/org-card.manifest.json .github/workflows/patch-hf-org-card-preservation-once.yml
          git commit -m "fix(hf): preserve unmanaged organization-card files" -m "Signed-off-by: Stephen P. Lutar Jr. <stephenlutar2@gmail.com>"
          git push origin HEAD:fix/hf-org-card-preserve-unmanaged-20260903
