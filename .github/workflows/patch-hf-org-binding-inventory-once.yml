name: Patch HF organization binding inventory once

on:
  push:
    branches:
      - fix/hf-org-card-binding-inventory-20260903
    paths:
      - .github/workflows/patch-hf-org-binding-inventory-once.yml

permissions:
  contents: write

concurrency:
  group: patch-hf-org-binding-inventory-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-org-card-binding-inventory-20260903
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 1

      - name: Align canonical binding inventory with managed manifest
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path(".github/scripts/public_front_door_check.py"); t=p.read_text(encoding="utf-8"); old="    WEBP_DESTINATION: CANONICAL_WEBP,\n}"; new="    WEBP_DESTINATION: CANONICAL_WEBP,\n    \"GOVERNANCE.md\": \"huggingface/org-card/GOVERNANCE.md\",\n    \"MODELS.txt\": \"huggingface/org-card/MODELS.txt\",\n    \"SEVEN_SPACES.md\": \"huggingface/org-card/SEVEN_SPACES.md\",\n    \"SPACE_PROVENANCE_FRONTIER.json\": (\n        \"huggingface/org-card/SPACE_PROVENANCE_FRONTIER.json\"\n    ),\n    \"seven-spaces.yaml\": \"huggingface/org-card/seven-spaces.yaml\",\n}"; assert t.count(old) == 1, f"expected one binding terminator, observed {t.count(old)}"; p.write_text(t.replace(old, new, 1), encoding="utf-8", newline="\n")'
          python -c 'from pathlib import Path; p=Path(".github/scripts/test_public_front_door_check.py"); t=p.read_text(encoding="utf-8"); a="test_requires_exact_twelve_source_destination_pairs"; b="test_requires_exact_seventeen_source_destination_pairs"; c="self.assertEqual(len(check.REQUIRED_PUBLICATION_BINDINGS), 12)"; d="self.assertEqual(len(check.REQUIRED_PUBLICATION_BINDINGS), 17)"; assert t.count(a) == 1 and t.count(c) == 1, "stale binding-count test shape changed"; p.write_text(t.replace(a, b, 1).replace(c, d, 1), encoding="utf-8", newline="\n")'
          python -m py_compile .github/scripts/public_front_door_check.py .github/scripts/test_public_front_door_check.py
          python .github/scripts/public_front_door_check.py
          python .github/scripts/test_public_front_door_check.py
          git diff --check

      - name: Remove one-shot workflow and commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-hf-org-binding-inventory-once.yml
          git config user.name "szl-frontier-bot"
          git config user.email "stephenlutar2+frontier@gmail.com"
          git add .github/scripts/public_front_door_check.py .github/scripts/test_public_front_door_check.py .github/workflows/patch-hf-org-binding-inventory-once.yml
          git commit -m "fix(hf): align organization binding inventory" -m "Signed-off-by: Stephen P. Lutar Jr. <stephenlutar2@gmail.com>"
          git push origin HEAD:fix/hf-org-card-binding-inventory-20260903
