name: Estate operational inventory contracts

on:
  pull_request:
    paths:
      - .github/scripts/estate_operational_inventory.py
      - .github/scripts/test_estate_operational_inventory.py
      - .github/scripts/estate_alignment_contract.py
      - .github/scripts/router_flagship_contract.py
      - .github/workflows/estate-operational-inventory.yml
      - docs/ESTATE_OPERATIONAL_INVENTORY.md
      - docs/ESTATE_ALIGNMENT_CONTRACT_V1.json
      - governance/archive-portfolio-v2.json
      - governance/router-flagship-v1.json

permissions:
  contents: read

jobs:
  contracts:
    name: Estate operational inventory contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify offline fail-closed contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s .github/scripts -p test_estate_operational_inventory.py -v
