name: Seismic publisher exact-source witness

on:
  push:

permissions:
  contents: read

jobs:
  seismic-publisher-exact-source-witness:
    name: Seismic publisher exact-source witness
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-hf-deploy-seismic.yml
    with:
      contract-only: true
    secrets:
      # The witness never enters hf-deploy and cannot reach the HF write token.
      HF_TOKEN: ${{ github.token }}
