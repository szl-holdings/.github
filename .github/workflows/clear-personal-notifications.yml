name: GitHub Notification Unread Zero

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/clear_personal_notifications.py
      - .github/scripts/test_clear_personal_notifications.py
      - .github/workflows/clear-personal-notifications.yml
  pull_request:
    paths:
      - .github/scripts/clear_personal_notifications.py
      - .github/scripts/test_clear_personal_notifications.py
      - .github/workflows/clear-personal-notifications.yml
  workflow_dispatch:
    inputs:
      full_history:
        description: Acknowledge the full notification history instead of the default 3-hour incremental window.
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate rate-limit-safe notification clearer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Compile and run network-free regressions
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/clear_personal_notifications.py
          python .github/scripts/test_clear_personal_notifications.py

  clear:
    name: Count, clear, and verify unread zero
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: github-personal-notification-clearance
      cancel-in-progress: false
    env:
      GH_NOTIFICATIONS_TOKEN: ${{ secrets.GH_NOTIFICATIONS_TOKEN || secrets.SZL_GITHUB_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Record job deadline for bounded waits
        shell: bash
        run: |
          set -euo pipefail
          # (360 - 15) mirrors timeout-minutes above and keeps 15 minutes for the
          # upload, summary and enforcement steps after the clearance step.
          echo "CLEARANCE_DEADLINE_EPOCH=$(( $(date +%s) + (360 - 15) * 60 ))" >> "$GITHUB_ENV"

      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Require classic notification token
        run: |
          set -euo pipefail
          test -n "${GH_NOTIFICATIONS_TOKEN:-}" || {
            echo '::error::No user token is configured. Add GH_NOTIFICATIONS_TOKEN with Notifications: read/write, or grant that permission to SZL_GITHUB_TOKEN.'
            exit 2
          }

      - name: Clear authenticated user notification inbox
        id: clearance
        shell: bash
        env:
          # Empty on push and false when the scheduler dispatches without
          # inputs: both select the default incremental history window.
          CLEARANCE_FULL_HISTORY: ${{ inputs.full_history }}
        run: |
          set +e
          python .github/scripts/clear_personal_notifications.py \
            --report github-notification-clearance.json
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      # No issue receipt is published. The count-only receipts are this
      # artifact (30 days) and the step summary below.
      - name: Upload count-only clearance receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-notification-clearance-receipts
          path: github-notification-clearance.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish count-only summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## GitHub notification unread-zero clearance\n\n')
              path = Path('github-notification-clearance.json')
              if not path.exists():
                  out.write('No report was produced (clearance step SKIPPED or not reached).\n\n')
              else:
                  report = json.loads(path.read_text(encoding='utf-8'))
                  out.write(f"Status: **{report.get('status', 'UNKNOWN')}**\n\n")
                  out.write(f"History mode: **{report.get('history_mode', 'UNKNOWN')}** (since `{report.get('history_since')}`, lookback {report.get('history_lookback_seconds')} s)\n\n")
                  out.write(f"Server-error retries observed: **{report.get('observed_server_error_retries', 'UNAVAILABLE')}**\n\n")
                  out.write(f"Authenticated identity: `{report.get('identity', 'UNAVAILABLE')}`\n\n")
                  out.write(f"Unread before (all=false): **{report.get('before_unread_count', 'UNAVAILABLE')}**\n\n")
                  out.write(f"Unread after (all=false): **{report.get('after_unread_count', 'UNAVAILABLE')}** ({report.get('after_unread_measurement', 'UNAVAILABLE')})\n\n")
                  out.write(f"Full-inbox state: **{report.get('full_inbox_state', 'UNKNOWN')}**\n\n")
              out.write('No issue receipt is published. The receipts are this summary and the 30-day artifact `github-notification-clearance-receipts`.\n\n')
              out.write('Notification content and token material were not recorded.\n')
          PY

      - name: Enforce exact zero unread result
        if: always()
        env:
          CLEARANCE_OUTCOME: ${{ steps.clearance.outcome }}
          CLEARANCE_EXIT_CODE: ${{ steps.clearance.outputs.exit_code }}
        run: python .github/scripts/clear_personal_notifications.py --enforce-phases
