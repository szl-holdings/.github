name: HF Official Estate Inventory

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/hf_official_estate_inventory*.py
      - .github/scripts/test_hf_official_estate_inventory*.py
      - .github/scripts/hf_inventory_public_boundary.py
      - .github/scripts/hf_inventory_evidence.py
      - .github/scripts/run_hf_inventory_contracts.py
      - .github/scripts/verify_hf_inventory_source.py
      - .github/scripts/test_hf_inventory*.py
      - .github/workflows/hf-official-estate-inventory.yml
      - .github/workflows/hf-inventory-contract.yml
  schedule:
    - cron: '41 */12 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Collect the authenticated inventory and retain private evidence
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: hf-official-estate-inventory-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Credential-free protected-source contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install supported test clients without organization credentials
        run: python -m pip install --disable-pip-version-check "huggingface_hub==1.23.0" "requests==2.32.5" "PyYAML==6.0.3"
      - name: Verify collector modules and offline boundaries
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/hf_official_estate_inventory.py .github/scripts/hf_official_estate_inventory_compat.py .github/scripts/hf_inventory_public_boundary.py .github/scripts/hf_inventory_evidence.py .github/scripts/verify_hf_inventory_source.py .github/scripts/test_hf_official_estate_inventory.py .github/scripts/test_hf_official_estate_inventory_compat.py .github/scripts/test_hf_inventory_public_boundary.py .github/scripts/test_hf_inventory_workflow_boundary.py .github/scripts/test_hf_inventory_evidence.py
          python .github/scripts/run_hf_inventory_contracts.py
          python -m pip check
          git diff --check

  inventory:
    name: Protected-source authenticated inventory
    needs: verify
    if: >-
      github.repository == 'szl-holdings/.github' &&
      github.ref == 'refs/heads/main' && github.ref_protected == true &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: hf-private-evidence-SZLHOLDINGS-szl-evidence
      cancel-in-progress: false
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_INVENTORY_PUBLISH_INPUT: ${{ inputs.publish }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install supported clients before obtaining organization credentials
        run: python -m pip install --disable-pip-version-check "huggingface_hub==1.23.0" "requests==2.32.5" "PyYAML==6.0.3"
      - name: Verify protected source before credential-bearing execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          python .github/scripts/verify_hf_inventory_source.py
      - name: Collect authenticated inventory without public operator logs
        id: estate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_ORG_TOKEN1 }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          rm -f -- reports/hf-official-estate-inventory-latest.json reports/hf-official-estate-inventory-public.json
          private_log="${RUNNER_TEMP}/hf-inventory-private-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          trap 'rm -f -- "$private_log"' EXIT
          python .github/scripts/verify_hf_inventory_source.py
          set +e
          python .github/scripts/hf_official_estate_inventory_compat.py --publish --expected-before --readback --generation "$GITHUB_SHA" > "$private_log" 2>&1
          code=$?
          set -e
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then echo '::error::Authenticated inventory failed; private diagnostics were not published.'; fi
          exit "$code"
      - name: Project public metadata with no organization credential
        id: projection
        if: always() && steps.estate.outcome != 'skipped'
        run: |
          python .github/scripts/hf_official_estate_inventory_compat.py --public-projection reports/hf-official-estate-inventory-latest.json --output reports/hf-official-estate-inventory-public.json
      - name: Upload public inventory projection only
        if: always() && steps.projection.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hf-official-estate-inventory-public-v1
          path: reports/hf-official-estate-inventory-public.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish public-only summary
        if: always() && steps.projection.outcome == 'success'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('reports/hf-official-estate-inventory-public.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('## Observed public HF repository metadata\n\n')
              for kind, count in report['counts'].items():
                  output.write(f'- {kind}: {count if count is not None else "UNKNOWN"}\n')
              output.write('\nPrivate categories and aggregate operator counters are withheld. This is not complete-organization or runtime qualification.\n')
          PY
      - name: Remove local operator report and private diagnostics
        if: always()
        run: |
          rm -f -- reports/hf-official-estate-inventory-latest.json "${RUNNER_TEMP}/hf-inventory-private-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
