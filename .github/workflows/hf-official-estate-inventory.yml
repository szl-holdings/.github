name: HF Official Estate Inventory

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/hf_official_estate_inventory.py
      - .github/scripts/hf_official_estate_inventory_compat.py
      - .github/scripts/test_hf_official_estate_inventory.py
      - .github/scripts/test_hf_official_estate_inventory_compat.py
      - .github/workflows/hf-official-estate-inventory.yml
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/hf_official_estate_inventory.py
      - .github/scripts/hf_official_estate_inventory_compat.py
      - .github/scripts/test_hf_official_estate_inventory.py
      - .github/scripts/test_hf_official_estate_inventory_compat.py
      - .github/workflows/hf-official-estate-inventory.yml
  schedule:
    - cron: '41 */12 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the official inventory evidence report
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: hf-official-estate-inventory-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Models, datasets, Spaces, kernels, collections, and buckets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_ORG_TOKEN1 }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - name: Checkout inventory verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Determine execution mode
        id: mode
        env:
          HF_INVENTORY_PUBLISH_INPUT: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          publish=true
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then publish=false; fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${HF_INVENTORY_PUBLISH_INPUT}" != "true" ]; then publish=false; fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install supported Hub clients
        run: |
          python -m pip install --disable-pip-version-check \
            "huggingface_hub>=1.3,<2" \
            "requests>=2.32,<3"

      - name: Compile and test no-clone official inventory contract
        run: |
          set -euo pipefail
          python -m py_compile \
            .github/scripts/hf_official_estate_inventory.py \
            .github/scripts/hf_official_estate_inventory_compat.py \
            .github/scripts/test_hf_official_estate_inventory.py \
            .github/scripts/test_hf_official_estate_inventory_compat.py
          python .github/scripts/test_hf_official_estate_inventory.py
          python .github/scripts/test_hf_official_estate_inventory_compat.py
          git diff --check

      - name: Require organization credential for publish-mode inventory
        if: steps.mode.outputs.publish == 'true'
        run: |
          set -euo pipefail
          if [ -z "${HF_ORG_TOKEN:-}" ] && [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::No supported Hugging Face organization credential is configured."
            exit 2
          fi

      - name: Execute official supported-API inventory
        if: steps.mode.outputs.publish == 'true'
        id: estate
        shell: bash
        run: |
          set +e
          python .github/scripts/hf_official_estate_inventory_compat.py \
            --publish \
            --generation "${GITHUB_SHA}"
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Project public metadata without private identifiers
        if: always() && steps.mode.outputs.publish == 'true'
        run: |
          python .github/scripts/hf_official_estate_inventory_compat.py \
            --public-projection reports/hf-official-estate-inventory-latest.json \
            --output reports/hf-official-estate-inventory-public.json

      - name: Upload public inventory projection
        if: always() && steps.mode.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-official-estate-inventory-public-v1
          path: reports/hf-official-estate-inventory-public.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish inventory summary
        if: always() && steps.mode.outputs.publish == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('reports/hf-official-estate-inventory-public.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Official Hugging Face estate inventory\n\n')
              if not path.exists():
                  out.write('No report was produced.\n')
              else:
                  report = json.loads(path.read_text())
                  for key, value in report.get('counts', {}).items():
                      out.write(f'- {key}: `{value}`\n')
                  canonical = report.get('canonical_a11oy') or {}
                  out.write(f"- canonical A11oy: `{canonical.get('sha', 'UNKNOWN')}` ({canonical.get('stage', 'UNKNOWN')})\n")
          PY

      - name: Enforce fail-closed inventory result
        if: always() && steps.mode.outputs.publish == 'true'
        env:
          HF_INVENTORY_EXIT_CODE: ${{ steps.estate.outputs.exit_code }}
        run: |
          code="${HF_INVENTORY_EXIT_CODE:-}"
          if [ -z "$code" ]; then code=2; fi
          if [ "$code" -ne 0 ]; then
            echo "::error::Official estate inventory failed with exit ${code}."
            exit "$code"
          fi
          echo 'Official estate inventory completed successfully.'
