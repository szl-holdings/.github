name: FORGE-9 gates

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  ground-truth:
    name: gate/ground-truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python .governance/forge9_gate_runner.py gate/ground-truth

  labels:
    name: gate/labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
