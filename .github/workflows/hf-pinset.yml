name: Hub pin set

# Pin flagships. Unpin cosmos / khipu as org-front pins. Factory stays unpinned.
# Does not freeze any live Space.
# Default environment is staging (no reviewers). Production still requires Hub admin Approve.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment that supplies HF_TOKEN
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  contents: read

jobs:
  pinset:
    name: Apply Hub pin set
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'staging' }}
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_ORG_TOKEN1 || secrets.HF_TOKEN || secrets.HF_WRITE_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Hugging Face client
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface_hub==1.23.0"

      - name: Apply pin set
        run: python .github/scripts/hf_pinset.py
