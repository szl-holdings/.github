name: CI Health Digest

on:
  schedule:
    - cron: "37 13 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/scripts/ci_health_digest.py
      - .github/scripts/test_ci_health_digest.py
      - .github/workflows/ci-health-digest.yml
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/ci_health_digest.py
      - .github/scripts/test_ci_health_digest.py
      - .github/workflows/ci-health-digest.yml

permissions:
  contents: read

concurrency:
  group: ci-health-digest-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REPORT_PATH: reports/ci-health-digest.json
  CI_DIGEST_REPO_FLOOR: "57"
  CI_DIGEST_ACTIVE_FLOOR: "52"
  CI_DIGEST_PRIVATE_FLOOR: "3"

jobs:
  contract:
    name: Credential and digest fail-closed contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout proposed controller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile and test complete authentication and issue lifecycle
        run: |
          set -euo pipefail
          python -m py_compile \
            .github/scripts/ci_health_digest.py \
            .github/scripts/test_ci_health_digest.py
          python .github/scripts/test_ci_health_digest.py
          git diff --check

  digest:
    name: Authenticated organization sweep and deterministic issue update
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout protected controller
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Sweep the complete installed organization estate
        id: digest
        shell: bash
        env:
          SZL_GITHUB_TOKEN: ${{ secrets.SZL_GITHUB_TOKEN }}
          ORG_CI_READ_TOKEN: ${{ secrets.ORG_CI_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python .github/scripts/ci_health_digest.py --report "$REPORT_PATH"
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable digest evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-health-digest-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Enforce authenticated digest result
        if: always()
        env:
          EXIT_CODE: ${{ steps.digest.outputs.exit_code }}
        run: |
          code="${EXIT_CODE:-2}"
          if [ "$code" -ne 0 ]; then
            echo "::error::The organization CI digest did not complete with authenticated full-estate evidence."
            exit "$code"
          fi
          echo "The organization CI digest completed with a verified issue update."
