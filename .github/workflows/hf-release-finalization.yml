name: HF Release Finalization — Supported Kernel Git

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/kernel_hub_git.py
      - .github/scripts/hf_release_sources.py
      - .github/scripts/test_hf_release_sources.py
      - .github/scripts/hf_release_finalization.py
      - .github/scripts/hf_release_finalization_entrypoint.py
      - .github/scripts/hf_release_finalization_git.py
      - .github/scripts/test_kernel_hub_git.py
      - .github/scripts/test_hf_release_finalization.py
      - .github/scripts/test_hf_release_finalization_entrypoint.py
      - .github/scripts/test_hf_release_finalization_git.py
      - .github/scripts/hf_release_readiness_terminal.py
      - .github/scripts/test_hf_release_readiness_terminal.py
      - .github/workflows/hf-release-finalization.yml
      - .github/workflows/hf-release-readiness-terminal.yml
      - .github/workflows/hf-release-readiness-terminal-pr.yml
  schedule:
    - cron: "3 */6 * * *"
  repository_dispatch:
    types: [hf-release-source-updated]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hf-release-finalization-publication
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  REVIEWED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  REPORT_PATH: reports/hf-release-finalization-latest.json

jobs:
  finalize:
    name: Read-only Dataset closure and authenticated Kernel Hub Git
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - name: Checkout release controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact CPU runtime and supported clients
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.7.1"
          python -m pip install --disable-pip-version-check \
            "numpy==2.2.6" \
            "huggingface_hub==1.19.0" \
            "kernels==0.16.0" \
            "requests==2.32.5" \
            "pytest>=8,<9" \
            "pyarrow>=18,<24" \
            "PyYAML>=6,<7"

      - name: Acquire exact protected source owners
        id: sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/hf_release_sources.py prepare --operational

      - name: Verify transport, finalizer, and source contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            .github/scripts/hf_release_sources.py \
            .github/scripts/test_hf_release_sources.py \
            .github/scripts/kernel_hub_git.py \
            .github/scripts/hf_release_finalization.py \
            .github/scripts/hf_release_finalization_entrypoint.py \
            .github/scripts/hf_release_finalization_git.py \
            .github/scripts/test_kernel_hub_git.py \
            .github/scripts/test_hf_release_finalization.py \
            .github/scripts/test_hf_release_finalization_entrypoint.py \
            .github/scripts/test_hf_release_finalization_git.py
          PYTHONPATH=.github/scripts python .github/scripts/test_kernel_hub_git.py
          PYTHONPATH=.github/scripts python .github/scripts/test_hf_release_finalization.py
          PYTHONPATH=.github/scripts python .github/scripts/test_hf_release_finalization_entrypoint.py
          PYTHONPATH=.github/scripts python .github/scripts/test_hf_release_finalization_git.py
          python - <<'PY'
          import numpy
          import torch
          assert numpy.__version__ == "2.2.6", numpy.__version__
          assert torch.__version__.startswith("2.7.1"), torch.__version__
          assert not torch.cuda.is_available(), "release runner must remain CPU-only"
          print("numpy runtime:", numpy.__version__)
          print("torch runtime:", torch.__version__)
          PY
          python .github/scripts/test_hf_release_sources.py
          git diff --check

      - name: Verify merged source contracts read-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/hf_release_sources.py contracts --operational

      - name: Finalize and independently verify exact revisions
        id: release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_ORG_TOKEN1 }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SZL_LAKE_SHA: ${{ steps.sources.outputs.lake_sha }}
          SZL_ENERGY_ATTEST_SHA: ${{ steps.sources.outputs.energy_sha }}
          SZL_LAMBDA_GATE_SHA: ${{ steps.sources.outputs.lambda_sha }}
        run: |
          python .github/scripts/hf_release_sources.py verify --operational
          set +e
          args=(
            --publish
            --generation "$GITHUB_SHA"
            --lake-root release-sources/lake
            --energy-root release-sources/energy
            --lambda-root release-sources/lambda-gate
          )
          PYTHONPATH=.github/scripts \
            python .github/scripts/hf_release_finalization_git.py "${args[@]}"
          code=$?
          python .github/scripts/hf_release_sources.py verify --operational || code=2
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable finalization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-release-finalization-supported
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Record deterministic downstream handoff
        if: always()
        run: |
          echo "HF Release Readiness Terminal is triggered by workflow_run after this workflow completes."
          echo "No ad hoc workflow dispatch or timer race is used."

      - name: Enforce fail-closed controller result
        if: always()
        env:
          EXIT_CODE: ${{ steps.release.outputs.exit_code }}
        run: |
          code="${EXIT_CODE:-2}"
          if [ "$code" -ne 0 ]; then
            echo "::error::HF release finalization failed with exit ${code}."
            exit "$code"
          fi
          echo "Lake closure is verified read-only; both first-class Kernel contracts passed supported transports."
