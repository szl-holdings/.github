name: HF Release Readiness Terminal

on:
  workflow_run:
    workflows:
      - "HF Release Finalization — Supported Kernel Git"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: hf-release-readiness-terminal-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

env:
  REPORT_PATH: reports/hf-release-readiness-latest.json
  EVIDENCE_GENERATION: ${{ github.event.workflow_run.head_sha || github.sha }}
  UPSTREAM_WORKFLOW: ${{ github.event.workflow_run.name || '' }}
  UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || '' }}
  UPSTREAM_RUN_URL: ${{ github.event.workflow_run.html_url || '' }}
  UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
  UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}

jobs:
  verify:
    name: Lake Viewer plus first-class Kernel selfchecks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_ORG_TOKEN1 }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - name: Checkout verifier at the upstream source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EVIDENCE_GENERATION }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned CPU runtime and supported clients
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.7.1"
          python -m pip install --disable-pip-version-check \
            "numpy==2.2.6" \
            "huggingface_hub==1.19.0" \
            "kernels==0.16.0" \
            "requests==2.32.5"

      - name: Compile and test the terminal contract and workflow chain
        run: |
          set -euo pipefail
          python -m py_compile \
            .github/scripts/hf_release_readiness_terminal.py \
            .github/scripts/test_hf_release_readiness_terminal.py
          python .github/scripts/test_hf_release_readiness_terminal.py
          python - <<'PY'
          import numpy
          import torch
          assert numpy.__version__ == "2.2.6", numpy.__version__
          assert torch.__version__.startswith("2.7.1"), torch.__version__
          assert not torch.cuda.is_available(), "terminal readiness must use the CPU runtime"
          print("numpy runtime:", numpy.__version__)
          print("torch runtime:", torch.__version__)
          PY
          git diff --check

      - name: Verify the current Lake and Kernel evidence read-only
        id: terminal
        shell: bash
        run: |
          set +e
          python .github/scripts/hf_release_readiness_terminal.py \
            --report "$REPORT_PATH" \
            --generation "$EVIDENCE_GENERATION" \
            --publish-issue \
            --enforce
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable terminal readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-release-readiness-terminal-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Enforce terminal readiness
        if: always()
        env:
          EXIT_CODE: ${{ steps.terminal.outputs.exit_code }}
        run: |
          code="${EXIT_CODE:-2}"
          if [ "$code" -ne 0 ]; then
            echo "::error::HF release readiness failed. The deterministic evidence issue remains open."
            exit "$code"
          fi
          echo "Lake Viewer and both exact first-class Kernel selfchecks are operational."
