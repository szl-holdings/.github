name: Publish Nexus Space

# Nexus is source-owned by szl-holdings/nexus, but provider credentials are
# intentionally owned by this central control repository. Source admission and
# production release are separate: only an exact manual request may reach the
# existing production environment. tests.yml tests this contract on PRs and main
# pushes even while this publisher is administratively disabled.
"on":
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact lowercase 40-hex Nexus main revision to review and release
        required: true
        type: string

permissions: read-all

jobs:
  validate:
    name: Validate requested Nexus source without provider credentials
    if: github.event_name == 'workflow_dispatch' && github.repository == 'szl-holdings/.github' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source_ref.outputs.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout exact policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Validate protected request and fetch only its exact Nexus revision
        id: source_ref
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "szl-holdings/.github"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          POLICY_SHA="$(git rev-parse HEAD)"
          python -I -B .github/scripts/validate_nexus_release.py \
            --source-sha="$REQUESTED_SOURCE_SHA" --policy-sha="$POLICY_SHA"
          test ! -e source
          git init -q source
          git -C source remote add origin https://github.com/szl-holdings/nexus.git
          git -C source fetch --depth=1 origin "$REQUESTED_SOURCE_SHA"
          git -C source checkout --detach --quiet FETCH_HEAD
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote https://github.com/szl-holdings/nexus.git refs/heads/main | awk '{print $1}')"
          python -I -B .github/scripts/validate_nexus_release.py \
            --source-sha="$REQUESTED_SOURCE_SHA" --policy-sha="$POLICY_SHA" \
            --checkout-sha="$SOURCE_SHA" --main-sha="$REMOTE_SHA"
          python -I -B .github/scripts/validate_nexus_source_binding.py source/space/Dockerfile
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### Requested Nexus release — awaiting production approval"
            echo "- Exact source: https://github.com/szl-holdings/nexus/commit/${SOURCE_SHA}"
            echo "- Fixed environment: production"
            echo "- No provider credential or mutation in this validation job."
            echo "- Approval goes stale if Nexus main moves; no automatic upgrade."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prove source-binding grammar without network
        shell: bash
        run: |
          set -euo pipefail
          python -I -B .github/scripts/test_validate_nexus_source_binding.py
          git diff --check

  publish:
    permissions:
      contents: read
    name: Publish approved Nexus ${{ needs.validate.outputs.source_sha }}
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.repository == 'szl-holdings/.github' && github.ref == 'refs/heads/main' && github.ref_protected
    environment: production
    concurrency:
      group: publish-nexus-space
      cancel-in-progress: false
    env:
      REQUESTED_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout exact publisher policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

      - name: Revalidate protected policy and fetch the approved Nexus revision
        id: source_ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "szl-holdings/.github"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          POLICY_SHA="$(git rev-parse HEAD)"
          python -I -B .github/scripts/validate_nexus_release.py \
            --source-sha="$REQUESTED_SOURCE_SHA" --policy-sha="$POLICY_SHA"
          test ! -e source
          git init -q source
          git -C source remote add origin https://github.com/szl-holdings/nexus.git
          git -C source fetch --depth=1 origin "$REQUESTED_SOURCE_SHA"
          git -C source checkout --detach --quiet FETCH_HEAD
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote https://github.com/szl-holdings/nexus.git refs/heads/main | awk '{print $1}')"
          python -I -B .github/scripts/validate_nexus_release.py \
            --source-sha="$REQUESTED_SOURCE_SHA" --policy-sha="$POLICY_SHA" \
            --checkout-sha="$SOURCE_SHA" --main-sha="$REMOTE_SHA"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'publisher=%s source=szl-holdings/nexus@%s remote_readback=%s\n' "$POLICY_SHA" "$SOURCE_SHA" "$REMOTE_SHA"

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Create fresh publisher environment
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/hf-publisher-venv"
          test ! -e "$VENV"
          python3 -m venv "$VENV"
          ACTUAL_VERSION="$("$VENV/bin/python" -I -P -c 'import platform; print(platform.python_version())')"
          test "$ACTUAL_VERSION" = "3.12.14"

      - name: Install hash-locked publisher closure
        shell: bash
        run: >-
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P -m pip install
          --disable-pip-version-check --require-hashes --only-binary=:all:
          --ignore-installed -r requirements/hf-publisher.lock

      - name: Resolve exact source and publication mode
        id: source
        shell: bash
        env:
          RESOLVED_SOURCE_SHA: ${{ steps.source_ref.outputs.sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$RESOLVED_SOURCE_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$(git -C source rev-parse --verify HEAD)"
          mkdir -p evidence/nexus
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P \
            .github/scripts/validate_nexus_source_binding.py \
            source/space/Dockerfile \
            --report evidence/nexus/source-binding.json
          binding=true
          smoke='["/","/healthz","/api/build-info"]'
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "binding=$binding" >> "$GITHUB_OUTPUT"
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"
          printf 'source=szl-holdings/nexus@%s binding=%s smoke=%s\n' "$SOURCE_SHA" "$binding" "$smoke"

      - name: Validate Nexus Hugging Face card before mutation
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P <<'PY'
          from pathlib import Path
          import yaml

          readme = Path('source/README.md')
          text = readme.read_text(encoding='utf-8')
          if not text.startswith('---\n'):
              raise SystemExit('Nexus README.md has no Hugging Face front matter')
          end = text.find('\n---\n', 4)
          if end < 0:
              raise SystemExit('Nexus README.md front matter is unterminated')
          meta = yaml.safe_load(text[4:end])
          if not isinstance(meta, dict):
              raise SystemExit('Nexus Hugging Face metadata must be a mapping')
          if meta.get('license') != 'apache-2.0':
              raise SystemExit('Nexus card must retain apache-2.0 license metadata')
          desc = str(meta.get('short_description') or '').strip()
          if not desc or len(desc) > 60:
              raise SystemExit('Nexus short_description must be 1..60 characters')
          if meta.get('sdk') != 'docker' or str(meta.get('app_port')) != '7860':
              raise SystemExit('Nexus card Docker runtime metadata drifted')
          print('Nexus Hugging Face card: PASS')
          PY

      - name: Abort stale approval before acquiring any provider credential
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote https://github.com/szl-holdings/nexus.git refs/heads/main | awk '{print $1}')"
          python -I -B .github/scripts/validate_nexus_release.py \
            --source-sha="$REQUESTED_SOURCE_SHA" --policy-sha="$(git rev-parse HEAD)" \
            --checkout-sha="$(git -C source rev-parse HEAD)" --main-sha="$REMOTE_SHA"

      - name: Acquire independently validated Nexus publisher credential
        id: credential
        shell: bash
        env:
          HF_ORG_TOKEN_CANDIDATE: ${{ secrets.HF_ORG_TOKEN }}
          HF_ORG_TOKEN1_CANDIDATE: ${{ secrets.HF_ORG_TOKEN1 }}
          HF_WRITE_TOKEN_CANDIDATE: ${{ secrets.HF_WRITE_TOKEN }}
          HF_TOKEN_CANDIDATE: ${{ secrets.HF_TOKEN }}
          HF_REPO: SZLHOLDINGS/nexus
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P \
            .github/scripts/acquire_hf_publisher_token.py \
            --target-repo "$HF_REPO" \
            --target-type space \
            --token-file "$RUNNER_TEMP/nexus-hf-token" \
            --report evidence/nexus/hf-publisher-credential.json

      - name: Deploy exact Dockerfile-derived Nexus closure
        id: deploy
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_BINDING: ${{ steps.source.outputs.binding }}
          SMOKE_PATHS: ${{ steps.source.outputs.smoke }}
          HF_REPO: SZLHOLDINGS/nexus
        run: |
          set -euo pipefail
          set +x
          TOKEN_FILE="$RUNNER_TEMP/nexus-hf-token"
          test -f "$TOKEN_FILE" && test ! -L "$TOKEN_FILE"
          test "$(stat -c '%a' "$TOKEN_FILE")" = "600"
          REVISION_ARGS=()
          if [ "$SOURCE_BINDING" = true ]; then
            REVISION_ARGS+=(--source-revision-file SOURCE_GITHUB_SHA)
          fi
          HF_TOKEN="$(<"$TOKEN_FILE")" \
            "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P .github/scripts/hf_deploy_from_dockerfile.py \
            --repo-root source \
            --github-repo szl-holdings/nexus \
            --hf-repo "$HF_REPO" \
            --ref "$SOURCE_SHA" \
            --source-sha "$SOURCE_SHA" \
            --dockerfile-path space/Dockerfile \
            "${REVISION_ARGS[@]}" \
            --include-readme true \
            --smoke-paths "$SMOKE_PATHS" \
            --prune \
            --require-default-branch-tip \
            --manifest-out evidence/nexus/hf-deploy-manifest.json

      - name: Restart Space after governed publication
        id: restart
        shell: bash
        env:
          HF_REPO: SZLHOLDINGS/nexus
        run: |
          set -euo pipefail
          set +x
          TOKEN_FILE="$RUNNER_TEMP/nexus-hf-token"
          test -f "$TOKEN_FILE" && test ! -L "$TOKEN_FILE"
          test "$(stat -c '%a' "$TOKEN_FILE")" = "600"
          HF_TOKEN="$(<"$TOKEN_FILE")" \
            "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P .github/scripts/hf_deploy_from_dockerfile.py \
            --restart-space \
            --manifest evidence/nexus/hf-deploy-manifest.json \
            --hf-repo "$HF_REPO"

      - name: Attest exact running commit, bytes, and smoke routes
        id: attest
        shell: bash
        env:
          HF_REPO: SZLHOLDINGS/nexus
        run: |
          set -euo pipefail
          set +x
          TOKEN_FILE="$RUNNER_TEMP/nexus-hf-token"
          test -f "$TOKEN_FILE" && test ! -L "$TOKEN_FILE"
          test "$(stat -c '%a' "$TOKEN_FILE")" = "600"
          HF_TOKEN="$(<"$TOKEN_FILE")" \
            "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P .github/scripts/hf_deploy_from_dockerfile.py \
            --attest \
            --manifest evidence/nexus/hf-deploy-manifest.json \
            --hf-repo "$HF_REPO" \
            --wait-running 1200

      - name: Remove the ephemeral publisher credential
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          set +x
          TOKEN_FILE="$RUNNER_TEMP/nexus-hf-token"
          if [ -e "$TOKEN_FILE" ] || [ -L "$TOKEN_FILE" ]; then
            test ! -L "$TOKEN_FILE"
            chmod 600 "$TOKEN_FILE"
            rm -f -- "$TOKEN_FILE"
          fi
          test ! -e "$TOKEN_FILE"

      - name: Verify embedded source revision when supported
        if: steps.source.outputs.binding == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P <<'PY'
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          expected = os.environ['SOURCE_SHA']
          url = 'https://szlholdings-nexus.hf.space/api/build-info'
          deadline = time.monotonic() + 240
          last = None
          while time.monotonic() < deadline:
              try:
                  req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = json.loads(response.read().decode('utf-8'))
                  revision = body.get('source_revision') or body.get('build', {}).get('revision')
                  last = {'http_status': response.status, 'revision': revision, 'body': body}
                  if response.status == 200 and revision == expected:
                      Path('evidence/nexus/live-source-binding.json').write_text(
                          json.dumps(last, indent=2, sort_keys=True) + '\n', encoding='utf-8'
                      )
                      break
              except Exception as exc:
                  last = {'error': f'{type(exc).__name__}: {exc}'}
              time.sleep(5)
          else:
              raise SystemExit(f'Nexus live source binding did not converge: {last!r}')
          print(json.dumps(last, indent=2, sort_keys=True))
          PY

      - name: Publish measured summary
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_BINDING: ${{ steps.source.outputs.binding }}
        run: |
          {
            echo "### Explicitly approved central Nexus publication"
            echo
            echo "- GitHub source: \`szl-holdings/nexus@${SOURCE_SHA}\`"
            echo "- Release gate: fixed production environment"
            echo "- Hugging Face target: \`SZLHOLDINGS/nexus\`"
            echo "- Default-tip guard: passed"
            echo "- Runtime and byte attestation: passed"
            echo "- Embedded source binding supported: \`${SOURCE_BINDING}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable Nexus deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hf-central-nexus
          path: evidence/nexus/
          if-no-files-found: warn
          retention-days: 90
