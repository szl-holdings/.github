name: Ayllu publisher exact-source witness

on:
  push:

permissions:
  contents: read

jobs:
  ayllu-publisher-exact-source-witness:
    name: Ayllu publisher exact-source witness
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-hf-deploy-ayllu.yml
    with:
      contract-only: true
    secrets:
      # The witness never enters hf-deploy and cannot reach the HF write token.
      HF_TOKEN: ${{ github.token }}
