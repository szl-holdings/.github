name: FORGE-9 bootstrap invariants

on:
  pull_request:
    paths:
      - ".governance/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
      - ".github/pull_request_template.md"
  push:
    branches:
      - main
    paths:
      - ".governance/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
      - ".github/pull_request_template.md"

permissions:
  contents: read

jobs:
  verify:
    name: governance/forge9-invariants
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify governance invariants
        run: python .github/scripts/verify_forge9_governance.py
