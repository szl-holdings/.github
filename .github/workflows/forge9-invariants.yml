name: FORGE-9 bootstrap invariants

on:
  pull_request:
    paths:
    - .governance/**
    - .github/workflows/**
    - .github/scripts/**
    - .github/pull_request_template.md
  push:
    branches:
    - main
    paths:
    - .governance/**
    - .github/workflows/**
    - .github/scripts/**
    - .github/pull_request_template.md
  merge_group:
    types:
    - checks_requested
permissions:
  contents: read

jobs:
  verify:
    name: governance/forge9-invariants
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify governance invariants
        run: python .github/scripts/verify_forge9_governance.py
