name: Restore LLM Router flagship v2

"on":
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/restore-llm-router-flagship-v2.yml
      - scripts/restore_llm_router_flagship_v2.py
      - huggingface/llm-router-flagship.manifest.json
      - huggingface/llm-router-flagship.card.md
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-llm-router-flagship-v2.yml
      - scripts/restore_llm_router_flagship_v2.py
      - huggingface/llm-router-flagship.manifest.json
      - huggingface/llm-router-flagship.card.md
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: restore-llm-router-flagship-v2
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact-runtime controller
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Compile and validate
        run: |
          set -euo pipefail
          python -m py_compile scripts/restore_llm_router_flagship_v2.py
          python scripts/restore_llm_router_flagship_v2.py \
            --manifest huggingface/llm-router-flagship.manifest.json \
            --card huggingface/llm-router-flagship.card.md

  restore-and-attest:
    name: Restore public runtime and attest exact parity
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      ROUTER_GH_TOKEN: ${{ secrets.SZL_ADMIN_TOKEN || secrets.ORG_ADMIN_TOKEN || secrets.SZL_GITHUB_TOKEN || secrets.GH_PAT || secrets.ADMIN_TOKEN || secrets.PAT || github.token }}
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HF_API_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout exact admitted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Install exact Hugging Face client
        run: python -m pip install --disable-pip-version-check --no-cache-dir huggingface_hub==1.10.1
      - name: Restore and attest GitHub to Hub parity
        run: |
          set -euo pipefail
          test -n "${ROUTER_GH_TOKEN:-}" || { echo 'GitHub administration token unavailable'; exit 31; }
          test -n "${HF_TOKEN:-}" || { echo 'Hugging Face write token unavailable'; exit 32; }
          mkdir -p artifacts
          python scripts/restore_llm_router_flagship_v2.py \
            --apply \
            --manifest huggingface/llm-router-flagship.manifest.json \
            --card huggingface/llm-router-flagship.card.md \
            --receipt artifacts/llm-router-flagship-restoration-v2.json \
            --wait-seconds 1200
      - name: Upload immutable exact-runtime receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llm-router-flagship-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/llm-router-flagship-restoration-v2.json
          if-no-files-found: warn
          retention-days: 90
