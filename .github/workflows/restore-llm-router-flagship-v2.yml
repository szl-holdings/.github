# Retired 2026-10-13. Until then this workflow ran
# scripts/restore_llm_router_flagship_v2.py --apply on workflow_dispatch and on
# every push to main that touched this file, that script, or the flagship manifest
# or card. Holding the first available of seven GitHub tokens (SZL_ADMIN_TOKEN,
# ORG_ADMIN_TOKEN, SZL_GITHUB_TOKEN, GH_PAT, ADMIN_TOKEN, PAT, github.token) and
# an HF write token, it PATCHed szl-holdings/szl-router, PUT its topics, made
# SZLHOLDINGS/llm-router-live public, uploaded szl-router's space/ tree to it,
# restarted it, attested GitHub-to-Hub runtime parity and rewrote the flagship
# block of the SZLHOLDINGS organization card. It targeted the same Space and card
# as restore-llm-router-flagship.yml, so one merge could start both writers at
# once.
# Why it was retired: its GitHub administration writes went through a variable
# HTTP method that the CP-eBOM checker cannot model or budget, and each source edit
# started a live --apply run. The #894 merge (2026-10-11, run 38098153766) did
# exactly that and stopped after partial writes. Public/RUNNING state of the Space
# is owned by hf-space-lifecycle-reconcile.yml; the organization card is owned by
# hf-org-card-autopublish.yml.
# The file is kept as a disabled stub so historical run links resolve. It has no
# push or pull_request trigger, no token write authority, no checkout, no
# credential and no provider path.
name: Restore LLM Router flagship v2 (retired)

"on":
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  restore-and-attest:
    name: Retired restoration is disabled
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Retired no-op
        run: "true"
