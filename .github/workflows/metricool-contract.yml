name: Metricool offline contract

"on":
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: metricool-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Metricool config, claim and receipt contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify exact source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify declared data inputs before installation or validation
        run: |
          python -I - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              "config/metricool-control-plane.json": "e4f6aa9f4741023738b85fd7217e6d79f724647c588379c9bfb7520794cb7a9c",
              "config/schemas/metricool-control-plane.schema.json": "451b232a549ab7f04cc61d96a64f631dc4c5b1047cc091bb34bcb077587389f5",
              "schemas/metricool-publication-receipt.schema.json": "cb9562c16c987e7a7448dfd49cc356419fd1b6df4fe2f771101d93ea5c3ca0b6",
              "requirements/metricool-contract.lock": "6ff63ee80c5dab7249e3f7794b42ca1cb2a5a3bf2b989606e0c94d5955dcf606",
          }
          for name, digest in expected.items():
              path = Path(name)
              if path.is_symlink() or hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit("Declared Metricool data input differs: " + name)
          PY
      - name: Install hash-locked schema libraries
        run: |
          python -I -m pip --isolated install --require-hashes --only-binary=:all: --no-cache-dir -r requirements/metricool-contract.lock
      - name: Validate config and offline regressions
        run: |
          python -I .github/scripts/metricool_contract.py
          python -I .github/scripts/test_metricool_contract.py -v
