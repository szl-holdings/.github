# SPDX-License-Identifier: Apache-2.0
name: Finalize estate alignment successor once

on:
  push:
    branches:
      - feat/estate-alignment-current-main-20260905
    paths:
      - .github/workflows/_finalize_estate_alignment_successor_once.yml

permissions:
  contents: write

concurrency:
  group: finalize-estate-alignment-successor-once
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'szl-holdings/.github' && github.ref == 'refs/heads/feat/estate-alignment-current-main-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact successor head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/estate-alignment-current-main-20260905
          fetch-depth: 1
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'

      - name: Prove the permanent estate and organization-card contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile \
            .github/scripts/estate_alignment_contract.py \
            .github/scripts/public_front_door_check.py \
            .github/scripts/test_estate_alignment_contract.py \
            .github/scripts/test_estate_alignment_org_card.py \
            .github/scripts/test_public_front_door_check.py
          python .github/scripts/test_estate_alignment_contract.py
          python .github/scripts/test_estate_alignment_org_card.py
          python .github/scripts/test_public_front_door_check.py
          python .github/scripts/estate_alignment_contract.py \
            --repo-root . \
            --output /tmp/estate-alignment-local-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(
              Path('/tmp/estate-alignment-local-receipt.json').read_text(encoding='utf-8')
          )
          assert receipt['state'] == 'ALIGNED', receipt['failures']
          assert receipt['authority']['provider_writes'] is False
          assert receipt['authority']['public_effectors_enabled'] is False
          PY
          git diff --check

      - name: Retire all bounded repair machinery
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/estate-alignment-current-main-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git rm -- \
            .github/scripts/repair_estate_org_card_once.py \
            .github/scripts/repair_estate_org_card_once_v2.py \
            .github/workflows/_apply_org_card_alignment_v2_once.yml \
            .github/workflows/repair-estate-org-card-once-v2.yml \
            .github/workflows/repair-estate-org-card-once.yml \
            .github/workflows/_finalize_estate_alignment_successor_once.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/scripts/repair_estate_org_card_once.py \
            .github/scripts/repair_estate_org_card_once_v2.py \
            .github/workflows/_apply_org_card_alignment_v2_once.yml \
            .github/workflows/_finalize_estate_alignment_successor_once.yml \
            .github/workflows/repair-estate-org-card-once-v2.yml \
            .github/workflows/repair-estate-org-card-once.yml | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'chore(alignment): retire bounded repair workcells'
          git push origin "HEAD:refs/heads/$branch"
