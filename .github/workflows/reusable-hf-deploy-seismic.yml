name: Reusable — Seismic HF Deploy from Dockerfile

# Sole reusable publisher for szl-holdings/szl-seismic-review ->
# SZLHOLDINGS/szl-seismic-review. The pushed set follows Dockerfile COPY sources.
# This version keeps publication and public readback under one Space writer lock.

on:
  workflow_call:
    inputs:
      hf-repo:
        description: "Must be SZLHOLDINGS/szl-seismic-review."
        required: false
        type: string
        default: ""
      ref:
        description: "Must be the exact caller github.sha on main."
        required: false
        type: string
        default: "main"
      dockerfile-path:
        description: "Path to the Dockerfile whose COPY sources define the deploy set."
        required: false
        type: string
        default: "Dockerfile"
      source-revision-file:
        description: "Must be SOURCE_REVISION, covered by the caller Dockerfile COPY."
        required: false
        type: string
        default: ""
      include-readme:
        description: "Mirror README.md so the Space card remains source-controlled."
        required: false
        type: boolean
        default: true
      smoke-paths:
        description: "Must be the six declared seismic public routes."
        required: false
        type: string
        default: '["/"]'
      prune:
        description: "Must be false; no destructive Space pruning."
        required: false
        type: boolean
        default: false
      wait-running:
        description: "Must be 600 seconds for bounded exact-revision runtime convergence."
        required: false
        type: number
        default: 600
      restart-space:
        description: "Must be false; this publisher does not restart the Space."
        required: false
        type: boolean
        default: false
      source-revision-variable:
        description: "Must be SZL_SOURCE_REVISION."
        required: false
        type: string
        default: ""
      source-revision-probe-path:
        description: "Must be /api/build-info with the exact observed source revision."
        required: false
        type: string
        default: ""
      require-default-branch-tip:
        description: "Must be true; fail at mutation boundary unless source is the current main tip."
        required: false
        type: boolean
        default: false
      contract-only:
        description: "Run only the read-only exact-source workflow_call witness; never publish."
        required: false
        type: boolean
        default: false
    secrets:
      HF_TOKEN:
        description: "HF write token with organization write access to the target Space."
        required: true

permissions:
  contents: read

# Preserve exclusion with the previous generic publisher's literal job lock.
# The caller also holds its own independent hf-sync lock.
concurrency:
  group: hf-deploy-SZLHOLDINGS/szl-seismic-review
  cancel-in-progress: false

jobs:
  invocation:
    name: Admit only canonical seismic publication or read-only source witness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact reusable-workflow validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tools
          persist-credentials: false
          fetch-depth: 1
      - name: Assert validator source revision
        shell: bash
        env:
          EXPECTED_TOOLS_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C tools rev-parse --verify HEAD)" = "$EXPECTED_TOOLS_SHA"
      - name: Validate the bounded invocation before caller checkout or HF credentials
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          CALLER_REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          CONTRACT_ONLY: ${{ inputs.contract-only }}
          HF_REPO: ${{ inputs.hf-repo }}
          DEPLOY_REF: ${{ inputs.ref }}
          REQUIRE_TIP: ${{ inputs.require-default-branch-tip }}
          DOCKERFILE: ${{ inputs.dockerfile-path }}
          SOURCE_REVISION_FILE: ${{ inputs.source-revision-file }}
          SOURCE_VARIABLE: ${{ inputs.source-revision-variable }}
          SOURCE_PROBE: ${{ inputs.source-revision-probe-path }}
          INCLUDE_README: ${{ inputs.include-readme }}
          SMOKE_PATHS: ${{ inputs.smoke-paths }}
          PRUNE: ${{ inputs.prune }}
          RESTART: ${{ inputs.restart-space }}
          WAIT_RUNNING: ${{ inputs.wait-running }}
        run: python3 -I -P tools/.github/scripts/hf_seismic_publish_contract.py

  hf-deploy:
    name: Deploy derived COPY set, bind source, and verify live state
    needs: invocation
    if: ${{ inputs.contract-only == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout caller source of truth
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/szl-seismic-review
          path: caller
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact reusable-workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tools
          persist-credentials: false
          fetch-depth: 1

      - name: Assert exact reusable-workflow tools revision
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          EXPECTED_TOOLS_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::job.workflow_sha is not an exact 40-character commit SHA: $EXPECTED_TOOLS_SHA"
            exit 2
          fi
          ACTUAL_TOOLS_SHA="$(git -C tools rev-parse --verify HEAD)"
          if [[ ! "$ACTUAL_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checked-out tools HEAD is not an exact 40-character commit SHA: $ACTUAL_TOOLS_SHA"
            exit 2
          fi
          if [ "$ACTUAL_TOOLS_SHA" != "$EXPECTED_TOOLS_SHA" ]; then
            echo "::error::Reusable-workflow tools mismatch: expected $EXPECTED_TOOLS_SHA, found $ACTUAL_TOOLS_SHA"
            exit 2
          fi
          printf 'job.workflow_repository=%s\n' "$WORKFLOW_REPOSITORY"
          printf 'job.workflow_sha=%s\n' "$EXPECTED_TOOLS_SHA"
          printf 'checked_out_tools_head=%s\n' "$ACTUAL_TOOLS_SHA"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"

      - name: Create fresh publisher virtual environment
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/hf-publisher-venv"
          if [ -e "$VENV" ]; then
            echo '::error::Refusing preexisting publisher virtual environment.'
            exit 2
          fi
          python3 -m venv "$VENV"
          ACTUAL_VERSION="$("$VENV/bin/python" -I -P -c 'import platform; print(platform.python_version())')"
          if [ "$ACTUAL_VERSION" != "3.12.10" ]; then
            echo "::error::Expected publisher Python 3.12.10, found $ACTUAL_VERSION."
            exit 2
          fi

      - name: Install hash-locked deployment client closure
        shell: bash
        run: >-
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P -m pip install
          --disable-pip-version-check --require-hashes --only-binary=:all:
          --ignore-installed -r tools/requirements/hf-publisher.lock

      - name: Resolve target and exact checked-out source
        id: hf
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C caller rev-parse HEAD)"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$SOURCE_SHA" != "$EVENT_SHA" ]; then
            echo '::error::Checked-out seismic source differs from the exact caller event SHA.'
            exit 2
          fi
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploying szl-holdings/szl-seismic-review -> SZLHOLDINGS/szl-seismic-review (${SOURCE_SHA})"

      - name: Require governed publisher
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || {
            echo '::error::HF_TOKEN is not configured for the reusable deployer.'
            exit 2
          }

      - name: Deploy Dockerfile-derived files to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.hf.outputs.source_sha }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P tools/.github/scripts/hf_deploy_from_dockerfile.py \
            --repo-root caller \
            --github-repo szl-holdings/szl-seismic-review \
            --hf-repo SZLHOLDINGS/szl-seismic-review \
            --ref "$SOURCE_SHA" \
            --source-sha "$SOURCE_SHA" \
            --dockerfile-path Dockerfile \
            --source-revision-file SOURCE_REVISION \
            --include-readme true \
            --smoke-paths '["/", "/healthz", "/api/meta", "/api/summary", "/api/build-info", "/api/evidence"]' \
            --require-default-branch-tip \
            --manifest-out hf-deploy-manifest.json

      - name: Bind exact source revision after publication
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_SHA: ${{ steps.hf.outputs.source_sha }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P tools/.github/scripts/hf_space_source_binding.py \
            --mode bind \
            --repo-id SZLHOLDINGS/szl-seismic-review \
            --variable SZL_SOURCE_REVISION \
            --revision "$SOURCE_SHA" \
            --probe-path /api/build-info \
            --output hf-source-binding-bind.json

      - name: Verify exact running commit, bytes, and smoke routes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WAIT_RUNNING: ${{ inputs.wait-running }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P tools/.github/scripts/hf_deploy_from_dockerfile.py \
            --attest \
            --manifest hf-deploy-manifest.json \
            --hf-repo SZLHOLDINGS/szl-seismic-review \
            --wait-running "${WAIT_RUNNING}"

      - name: Verify running application source identity
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_SHA: ${{ steps.hf.outputs.source_sha }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P tools/.github/scripts/hf_space_source_binding.py \
            --mode verify \
            --repo-id SZLHOLDINGS/szl-seismic-review \
            --variable SZL_SOURCE_REVISION \
            --revision "$SOURCE_SHA" \
            --probe-path /api/build-info \
            --timeout-seconds 180 \
            --interval-seconds 5 \
            --output hf-source-binding-verify.json

      - name: Upload immutable deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hf-deploy-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hf-deploy-manifest.json
            hf-source-binding-bind.json
            hf-source-binding-verify.json
          if-no-files-found: warn
          retention-days: 90

  exact-source-contract:
    name: Reusable publisher exact-source witness
    needs: invocation
    if: ${{ inputs.contract-only == true }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout called reusable-workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tools
          persist-credentials: false
          fetch-depth: 1

      - name: Assert exact called-workflow source
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          EXPECTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
          EXPECTED_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::job.workflow_sha is not an exact 40-character commit SHA: $EXPECTED_WORKFLOW_SHA"
            exit 2
          fi
          ACTUAL_TOOLS_SHA="$(git -C tools rev-parse --verify HEAD)"
          if [[ ! "$ACTUAL_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checked-out tools HEAD is not an exact 40-character commit SHA: $ACTUAL_TOOLS_SHA"
            exit 2
          fi
          if [ "$ACTUAL_TOOLS_SHA" != "$EXPECTED_WORKFLOW_SHA" ]; then
            echo "::error::Called-workflow source mismatch: expected $EXPECTED_WORKFLOW_SHA, found $ACTUAL_TOOLS_SHA"
            exit 2
          fi
          if [[ ! "$EXPECTED_EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::github.sha is not an exact 40-character commit SHA: $EXPECTED_EVENT_SHA"
            exit 2
          fi
          if [ "$EXPECTED_WORKFLOW_SHA" != "$EXPECTED_EVENT_SHA" ]; then
            echo "::error::Called workflow is not the exact event head: workflow $EXPECTED_WORKFLOW_SHA, event $EXPECTED_EVENT_SHA"
            exit 2
          fi
          printf 'job.workflow_repository=%s\n' "$WORKFLOW_REPOSITORY"
          printf 'job.workflow_sha=%s\n' "$EXPECTED_WORKFLOW_SHA"
          printf 'github.sha=%s\n' "$EXPECTED_EVENT_SHA"
          printf 'checked_out_tools_head=%s\n' "$ACTUAL_TOOLS_SHA"
