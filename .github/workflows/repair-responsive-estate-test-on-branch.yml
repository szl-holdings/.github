name: Repair Responsive Estate Contract on Review Branch

on:
  push:
    branches:
      - feat/responsive-estate-v3
    paths:
      - ".github/workflows/repair-responsive-estate-test-on-branch.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/responsive-estate-v3
          fetch-depth: 0

      - name: Correct the merge-method assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_responsive_estate_v3.py")
          text = path.read_text(encoding="utf-8")
          old = '        self.assertIn("merge_method\\\\\\\": \\\\"squash", self.script.replace(" ", ""))'
          if old not in text:
              # Tolerate the source representation produced by the Contents API.
              lines = text.splitlines()
              changed = False
              for index, line in enumerate(lines):
                  if "merge_method" in line and "assertIn" in line:
                      lines[index] = '        self.assertIn(\'"merge_method":"squash"\', self.script.replace(" ", ""))'
                      changed = True
                      break
              if not changed:
                  raise SystemExit("merge-method assertion was not found")
              text = "\n".join(lines) + "\n"
          else:
              text = text.replace(old, '        self.assertIn(\'"merge_method":"squash"\', self.script.replace(" ", ""))', 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Verify contract syntax
        run: python -m py_compile tests/test_responsive_estate_v3.py scripts/responsive_estate_v3.py

      - name: Commit repair and retire controller
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-responsive-estate-test-on-branch.yml
          git config user.name "SZL Responsive Estate Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add tests/test_responsive_estate_v3.py .github/workflows/repair-responsive-estate-test-on-branch.yml
          git commit -s -m "fix(frontend): correct responsive estate merge assertion"
          git push origin HEAD:feat/responsive-estate-v3
