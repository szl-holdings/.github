name: Repair estate organization-card source binding

on:
  push:
    branches:
      - feat/estate-alignment-current-main-20260905
    paths:
      - .github/scripts/repair_estate_org_card_once.py
      - .github/workflows/repair-estate-org-card-once.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repair-estate-org-card-current-main
  cancel-in-progress: false

jobs:
  repair:
    name: Bind org card to exact protected source and preserve 16-Space portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact successor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/estate-alignment-current-main-20260905
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply exact organization-card transformation
        run: |
          set -euo pipefail
          python .github/scripts/repair_estate_org_card_once.py
          python - <<'PY'
          from pathlib import Path

          path = Path("audit/ESTATE_ALIGNMENT_CURRENT_MAIN_SUCCESSOR_2026-09-05.md")
          path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY
          git diff --check

      - name: Prove focused estate and front-door contracts
        run: |
          set -euo pipefail
          python .github/scripts/test_estate_alignment_contract.py
          python .github/scripts/test_public_front_door_check.py
          python -m py_compile \
            .github/scripts/estate_alignment_contract.py \
            .github/scripts/public_front_door_check.py \
            .github/scripts/test_estate_alignment_contract.py \
            .github/scripts/test_public_front_door_check.py
          python .github/scripts/estate_alignment_contract.py \
            --repo-root . \
            --output estate-alignment-offline-receipt.json

      - name: Enforce permanent repair boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          expected = {
              ".github/scripts/estate_alignment_contract.py",
              ".github/scripts/test_estate_alignment_contract.py",
              "audit/ESTATE_ALIGNMENT_CURRENT_MAIN_SUCCESSOR_2026-09-05.md",
              "docs/ESTATE_ALIGNMENT_CONTRACT_V1.json",
          }
          rows = subprocess.check_output(
              ["git", "status", "--porcelain=v1"], text=True
          ).splitlines()
          changed = {
              row[3:]
              for row in rows
              if len(row) >= 4 and row[3:] != "estate-alignment-offline-receipt.json"
          }
          if changed != expected:
              raise SystemExit(
                  f"repair boundary mismatch: changed={sorted(changed)} "
                  f"expected={sorted(expected)}"
              )
          PY

      - name: Commit verified organization-card binding
        run: |
          set -euo pipefail
          rm -f estate-alignment-offline-receipt.json
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add \
            .github/scripts/estate_alignment_contract.py \
            .github/scripts/test_estate_alignment_contract.py \
            audit/ESTATE_ALIGNMENT_CURRENT_MAIN_SUCCESSOR_2026-09-05.md \
            docs/ESTATE_ALIGNMENT_CONTRACT_V1.json
          git commit -m "fix(alignment): source-bind organization card outside portfolio count

          Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:feat/estate-alignment-current-main-20260905
