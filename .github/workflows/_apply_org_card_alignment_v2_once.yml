name: Apply org-card alignment P1 v2 once

on:
  push:
    branches:
      - feat/estate-alignment-current-main-20260905
    paths:
      - .github/workflows/_apply_org_card_alignment_v2_once.yml

permissions:
  contents: write

concurrency:
  group: apply-org-card-alignment-p1-v2-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'szl-holdings/.github' && github.ref == 'refs/heads/feat/estate-alignment-current-main-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/estate-alignment-current-main-20260905
          fetch-depth: 0
          persist-credentials: true

      - name: Patch only alignment source, existing regression, and workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/feat/estate-alignment-current-main-20260905 | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path

          script_path = Path('.github/scripts/estate_alignment_contract.py')
          text = script_path.read_text(encoding='utf-8')

          old = 'RUNTIME_BINDING_PATHS = ("/api/build-info", "/deployment.json")\nRUNTIME_OBSERVATIONS = 2\n'
          new = (
              'RUNTIME_BINDING_PATHS = ("/api/build-info", "/deployment.json")\n'
              'ORG_CARD_SPACE_ID = "SZLHOLDINGS/README"\n'
              'ORG_CARD_SOURCE_REPOSITORY = "szl-holdings/.github"\n'
              'ORG_CARD_ORIGIN = "https://szlholdings-readme.static.hf.space"\n'
              'ORG_CARD_BINDING_PATHS = ("/deployment.json",)\n'
              'RUNTIME_OBSERVATIONS = 2\n'
          )
          if text.count(old) != 1:
              raise SystemExit('runtime constants insertion point changed')
          text = text.replace(old, new, 1)

          old = (
              '    origin = runtime_origin(repo_id)\n'
              '    attempts: list[dict[str, Any]] = []\n'
              '    for path in RUNTIME_BINDING_PATHS:\n'
          )
          new = (
              '    configured_origin = row.get("runtime_origin")\n'
              '    raw_binding_paths = row.get("binding_paths")\n'
              '    if repo_id == ORG_CARD_SPACE_ID:\n'
              '        if repository != ORG_CARD_SOURCE_REPOSITORY:\n'
              '            raise AlignmentError("organization-card deployment source must be .github")\n'
              '        if configured_origin != ORG_CARD_ORIGIN:\n'
              '            raise AlignmentError("organization-card binding must use the exact static origin")\n'
              '        if raw_binding_paths != list(ORG_CARD_BINDING_PATHS):\n'
              '            raise AlignmentError("organization-card binding must use deployment.json only")\n'
              '        origin = ORG_CARD_ORIGIN\n'
              '        binding_paths = ORG_CARD_BINDING_PATHS\n'
              '    else:\n'
              '        if configured_origin is not None or raw_binding_paths is not None:\n'
              '            raise AlignmentError("custom runtime binding is reserved for the organization card")\n'
              '        origin = runtime_origin(repo_id)\n'
              '        binding_paths = RUNTIME_BINDING_PATHS\n'
              '    url_origin(origin)\n'
              '    attempts: list[dict[str, Any]] = []\n'
              '    for path in binding_paths:\n'
          )
          if text.count(old) != 1:
              raise SystemExit('runtime binding insertion point changed')
          text = text.replace(old, new, 1)

          marker = '\n\ndef canonical_repositories(contract: Mapping[str, Any]) -> set[str]:\n'
          helper = (
              '\n\ndef org_card_runtime_row() -> dict[str, Any]:\n'
              '    """Return the source-bound org-card control surface outside portfolio count."""\n'
              '    return {\n'
              '        "repo_id": ORG_CARD_SPACE_ID,\n'
              '        "class": "organization_card_control_surface",\n'
              '        "canonical_source": ORG_CARD_SOURCE_REPOSITORY,\n'
              '        "deployment_source": ORG_CARD_SOURCE_REPOSITORY,\n'
              '        "runtime_origin": ORG_CARD_ORIGIN,\n'
              '        "binding_paths": list(ORG_CARD_BINDING_PATHS),\n'
              '        "portfolio_member": False,\n'
              '    }\n'
          )
          if text.count(marker) != 1:
              raise SystemExit('org-card row insertion point changed')
          text = text.replace(marker, helper + marker, 1)

          old = (
              '    runtime_rows = list(\n'
              '        contract["huggingface_inventory_snapshot"]["portfolio_spaces"]\n'
              '    )\n'
          )
          new = old + '    runtime_rows.append(org_card_runtime_row())\n'
          if text.count(old) != 1:
              raise SystemExit('live runtime row insertion point changed')
          text = text.replace(old, new, 1)
          script_path.write_text(text, encoding='utf-8')

          test_path = Path('.github/scripts/test_estate_alignment_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          old = (
              '        self.assertEqual(set(seen), alignment.EXPECTED_PORTFOLIO_SPACES)\n'
              '        self.assertEqual(len(observation["runtime_source_bindings"]), 16)\n'
          )
          new = (
              '        self.assertEqual(\n'
              '            set(seen),\n'
              '            alignment.EXPECTED_PORTFOLIO_SPACES | {alignment.ORG_CARD_SPACE_ID},\n'
              '        )\n'
              '        self.assertEqual(len(observation["runtime_source_bindings"]), 17)\n'
          )
          if tests.count(old) != 1:
              raise SystemExit('live runtime count assertion changed')
          tests = tests.replace(old, new, 1)

          old = (
              '            [\n'
              '                row["repo_id"]\n'
              '                for row in self.contract["huggingface_inventory_snapshot"][\n'
              '                    "portfolio_spaces"\n'
              '                ]\n'
              '            ],\n'
          )
          new = (
              '            [\n'
              '                row["repo_id"]\n'
              '                for row in self.contract["huggingface_inventory_snapshot"][\n'
              '                    "portfolio_spaces"\n'
              '                ]\n'
              '            ]\n'
              '            + [alignment.ORG_CARD_SPACE_ID],\n'
          )
          if tests.count(old) != 1:
              raise SystemExit('live runtime ordering assertion changed')
          tests = tests.replace(old, new, 1)
          test_path.write_text(tests, encoding='utf-8')

          workflow_path = Path('.github/workflows/estate-one-fabric-alignment.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          needle = (
              '      - .github/scripts/test_estate_alignment_contract.py\n'
              '      - .github/workflows/estate-one-fabric-alignment.yml\n'
          )
          replacement = (
              '      - .github/scripts/test_estate_alignment_contract.py\n'
              '      - .github/scripts/test_estate_alignment_org_card.py\n'
              '      - .github/workflows/estate-one-fabric-alignment.yml\n'
          )
          if workflow.count(needle) != 2:
              raise SystemExit('workflow path filters changed')
          workflow = workflow.replace(needle, replacement)

          old = (
              '          .github/scripts/estate_alignment_contract.py\n'
              '          .github/scripts/test_estate_alignment_contract.py\n'
          )
          new = old + '          .github/scripts/test_estate_alignment_org_card.py\n'
          if workflow.count(old) != 1:
              raise SystemExit('workflow compile list changed')
          workflow = workflow.replace(old, new, 1)

          old = (
              '      - name: Prove exact one-fabric contract offline\n'
              '        run: python .github/scripts/test_estate_alignment_contract.py\n'
          )
          new = (
              '      - name: Prove exact one-fabric contract offline\n'
              '        run: |\n'
              '          python .github/scripts/test_estate_alignment_contract.py\n'
              '          python .github/scripts/test_estate_alignment_org_card.py\n'
          )
          if workflow.count(old) != 1:
              raise SystemExit('workflow offline test step changed')
          workflow_path.write_text(workflow.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Prove bounded org-card repair
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            .github/scripts/estate_alignment_contract.py \
            .github/scripts/test_estate_alignment_contract.py \
            .github/scripts/test_estate_alignment_org_card.py
          python .github/scripts/test_estate_alignment_contract.py
          python .github/scripts/test_estate_alignment_org_card.py
          git diff --check

      - name: Commit verified repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/estate-alignment-current-main-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git rm .github/workflows/_apply_org_card_alignment_v2_once.yml
          git add \
            .github/scripts/estate_alignment_contract.py \
            .github/scripts/test_estate_alignment_contract.py \
            .github/workflows/estate-one-fabric-alignment.yml
          git diff --cached --check
          git config user.name 'Lutar, Stephen P.'
          git config user.email 'stephenlutar2@gmail.com'
          git commit -s -m 'fix(alignment): source-bind the org-card control surface'
          git push origin "HEAD:refs/heads/$branch"
