name: HF License Current State — Read-Only Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/hf-license-current-diagnostics-pr.yml

permissions:
  contents: read

concurrency:
  group: hf-license-current-diag-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VERIFIED_MAIN_SHA: 5c991c4b0430e227db02d9e752e15152a1e2027b
  REPORT_PATH: reports/hf-license-current-diagnostics.json

jobs:
  inspect:
    name: Current private-inclusive license state
    if: >-
      github.repository == 'szl-holdings/.github' &&
      github.event.pull_request.head.ref == 'diag/sign-pr333-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact protected-main checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERIFIED_MAIN_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile and self-test checker without credentials
        run: |
          set -euo pipefail
          python -m py_compile \
            .github/scripts/hf_license_consistency.py \
            .github/scripts/test_hf_license_consistency.py
          python .github/scripts/test_hf_license_consistency.py
          git diff --check

      - name: Run complete private-inclusive check read-only
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_ORG_TOKEN1 }}
        shell: bash
        run: |
          set +e
          mkdir -p "$(dirname "$REPORT_PATH")"
          python .github/scripts/hf_license_consistency.py \
            --include-private \
            --min-private 5 \
            --report "$REPORT_PATH"
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Normalize bounded diagnostic metadata
        if: always()
        env:
          CHECK_EXIT: ${{ steps.check.outputs.exit_code }}
        shell: python
        run: |
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path(os.environ["REPORT_PATH"])
          if path.is_file() and path.stat().st_size:
              report = json.loads(path.read_text(encoding="utf-8"))
          else:
              report = {
                  "schema": "szl.hf-license-current-diagnostics/v1",
                  "status": "NOT_VERIFIED",
                  "summary": {"checked": 0, "ok": 0, "warn": 0, "error": 1},
              }
          report["diagnostic"] = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "source_generation": os.environ["VERIFIED_MAIN_SHA"],
              "exit_code": int(os.environ.get("CHECK_EXIT") or 2),
              "private_inclusive": True,
              "minimum_private": 5,
              "credential_names_considered": ["HF_ORG_TOKEN", "HF_ORG_TOKEN1"],
              "credential_value_recorded": False,
              "mutation": False,
          }
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

      - name: Upload immutable current-state evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-license-current-${{ steps.check.outputs.exit_code || 'not-run' }}-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 30
