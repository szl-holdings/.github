name: CI Health First Failure — Read-Only Replay

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ci-health-first-failure-diagnostics-pr.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-health-first-failure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VERIFIED_MAIN_SHA: fa4b719adf5bdfcc970b2b32d49c35871b1b3fe9
  ORG_REPOSITORY_FLOOR: "57"
  REPORT_PATH: reports/ci-health-first-failure.json

jobs:
  inspect:
    name: First repository whose default-branch evidence cannot be proved
    if: >-
      github.repository == 'szl-holdings/.github' &&
      github.event.pull_request.head.ref == 'diag/sign-pr333-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the exact failed protected-main generation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERIFIED_MAIN_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Mint preferred qillqaq organization reader
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.QILLQAQ_CLIENT_ID }}
          private-key: ${{ secrets.QILLQAQ_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: read
          permission-contents: read
          permission-organization-administration: read

      - name: Replay repository evidence sequentially without mutation
        id: replay
        env:
          DIGEST_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
          SZL_GITHUB_TOKEN: ${{ secrets.SZL_GITHUB_TOKEN }}
        shell: python
        run: |
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          scripts = Path(".github/scripts").resolve()
          sys.path.insert(0, str(scripts))

          import ci_health_digest_http as http
          import ci_health_digest_sweep as sweep

          report = {
              "schema": "szl.ci-health-first-failure/v1",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "generation": os.environ["VERIFIED_MAIN_SHA"],
              "status": "NOT_RUN",
              "authentication": None,
              "inspected_repositories": [],
              "failure": None,
              "credential_value_recorded": False,
              "mutation": False,
          }
          try:
              reader = http.select_reader()
              report["authentication"] = {
                  "mode": reader.mode,
                  "credential_name": reader.credential_name,
                  "value_recorded": False,
                  "attempts": list(reader.attempts),
              }
              for repository in reader.repositories:
                  if repository.get("archived"):
                      continue
                  name = str(repository.get("name") or "")
                  try:
                      _, reds, default_count, registered_count, excluded = (
                          sweep.repository_reds(reader.token, repository)
                      )
                      report["inspected_repositories"].append(
                          {
                              "name": name,
                              "status": "proved",
                              "red_count": len(reds),
                              "default_branch_workflows": default_count,
                              "registered_active_workflows": registered_count,
                              "excluded_non_default_workflows": excluded,
                          }
                      )
                  except Exception as exc:  # noqa: BLE001
                      failure = {
                          "repository": name,
                          "type": type(exc).__name__,
                          "detail": str(exc)[:2000],
                      }
                      if isinstance(exc, http.ApiError):
                          failure.update(
                              {
                                  "operation": exc.operation,
                                  "http_status": exc.status,
                                  "detail_class": exc.detail_class,
                              }
                          )
                      report["failure"] = failure
                      report["status"] = "FAILURE_ISOLATED"
                      break
              else:
                  report["status"] = "ALL_REPOSITORIES_PROVED"
          except Exception as exc:  # noqa: BLE001
              failure = {
                  "repository": None,
                  "type": type(exc).__name__,
                  "detail": str(exc)[:2000],
              }
              if isinstance(exc, http.ApiError):
                  failure.update(
                      {
                          "operation": exc.operation,
                          "http_status": exc.status,
                          "detail_class": exc.detail_class,
                      }
                  )
              report["failure"] = failure
              report["status"] = "READER_OR_REPLAY_FAILURE"

          report["generated_at"] = datetime.now(timezone.utc).isoformat()
          path = Path(os.environ["REPORT_PATH"])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"status={report['status']}\n")

      - name: Upload immutable replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-health-first-failure-${{ steps.replay.outputs.status || github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 30
