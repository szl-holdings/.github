# SPDX-License-Identifier: Apache-2.0
name: Fix responsive marker contract once

"on":
  push:
    branches: [fix/public-experience-source-roots-20260906]
    paths:
      - .github/workflows/zz-fix-responsive-marker-once.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fix-responsive-marker-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Align the regression with the canonical static marker
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = fix/public-experience-source-roots-20260906
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/tests/test_responsive_space_contract.py')
          text = path.read_text(encoding='utf-8')
          old = 'self.assertIn("data-szl-holo-space-v2", html)'
          new = 'self.assertIn("data-szl-space-holo-v2", html)'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale marker assertion, found {text.count(old)}')
          if new in text:
              raise SystemExit('canonical marker assertion already exists unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Prove the complete network-free contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            .github/scripts/audit_public_experience_v3.py \
            .github/scripts/responsive_space_contract.py \
            .github/scripts/holographic_target_contract.py \
            .github/scripts/run_holographic_spaces_v2.py
          node --check design/responsive-v3/szl-responsive-v3.js
          python .github/tests/test_public_experience_v3.py
          python .github/tests/test_responsive_space_contract.py
          python .github/tests/test_holographic_target_contract.py
          git diff --check

      - name: Commit the exact repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add .github/tests/test_responsive_space_contract.py
          git rm .github/workflows/zz-fix-responsive-marker-once.yml
          git diff --cached --check
          git commit --signoff -m "test(experience): assert the canonical static marker"
          git push origin "HEAD:${GITHUB_REF_NAME}"
