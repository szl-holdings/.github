name: Auto-merge LLM Router card enforcement

"on":
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/enforce-llm-router-flagship-card.yml
      - .github/workflows/auto-merge-llm-router-card-enforcement.yml
      - scripts/enforce_llm_router_flagship_card.py

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: Enable protected squash auto-merge
    if: github.event.pull_request.head.ref == 'fix/enforce-llm-router-flagship-card-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Enable auto-merge for this exact pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
