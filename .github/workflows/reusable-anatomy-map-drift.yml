name: Reusable — Living Anatomy Drift Check

# Push-time guard for repositories that carry an active Anatomy source block.
# GitHub is authoritative; the public SZLHOLDINGS/anatomy Space and the
# a-11-oy.com product rendering are active credential-free witnesses. Callers
# pass no provider secrets. Pull requests validate proposed GitHub source while
# excluding independently deployed URL surfaces until protected main publishes.

on:
  workflow_call:
    inputs:
      checker-ref:
        description: "Immutable ref of szl-holdings/.github containing this checker and registry."
        required: false
        type: string
        default: "main"

permissions:
  contents: read

concurrency:
  group: reusable-anatomy-map-drift-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anatomy-map-drift:
    name: Living Anatomy honest and in sync (locked-8 + Lambda=Conjecture-1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Clone the exact pinned checker revision
        env:
          CHECKER_REF: ${{ inputs.checker-ref }}
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/szl-holdings/.github .
          if git rev-parse --verify --quiet "$CHECKER_REF" -- >/dev/null; then
            git checkout --quiet "$CHECKER_REF"
          else
            git fetch --quiet origin "$CHECKER_REF"
            git checkout --quiet FETCH_HEAD
          fi
          test -f .github/scripts/anatomy_map_drift.py

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Self-test drift and architecture contracts
        run: |
          python3 .github/scripts/test_anatomy_map_drift.py
          python3 .github/scripts/test_anatomy_product_contract.py

      - name: Compare active Living Anatomy surfaces
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CALLER_REPO: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head.sha || github.sha }}
        run: |
          set +e
          EXTRA=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Validate the calling repository proposed head while excluding
            # independently deployed URL surfaces from the PR merge gate.
            EXTRA="--skip-kind url --ref-override $CALLER_REPO=$PR_HEAD_SHA"
          fi
          python3 .github/scripts/anatomy_map_drift.py $EXTRA \
            --report anatomy_map_report.out.json
          echo "CHECK_EXIT=$?" >> "$GITHUB_ENV"

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anatomy-map-drift-reusable-report
          path: anatomy_map_report.out.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce result
        run: |
          case "${CHECK_EXIT:-2}" in
            0)
              echo "Active Living Anatomy sources are honest and in sync."
              ;;
            1)
              echo "::error::Living Anatomy drift detected; inspect the uploaded report."
              exit 1
              ;;
            *)
              echo "::error::An active Living Anatomy source could not be fetched or validated."
              exit 1
              ;;
          esac
