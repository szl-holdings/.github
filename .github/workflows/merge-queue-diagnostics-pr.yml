name: Merge Queue State — Read-Only Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/merge_queue_diagnostics.py
      - .github/workflows/merge-queue-diagnostics-pr.yml

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: merge-queue-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REPORT_PATH: reports/merge-queue-state.json
  TARGET_PULL_REQUESTS: "322,323"

jobs:
  diagnose:
    name: GitHub queue, rules, checks, and delivery state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Query GitHub read-only control-plane state
        run: python .github/scripts/merge_queue_diagnostics.py

      - name: Upload immutable diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merge-queue-diagnostics-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 30
