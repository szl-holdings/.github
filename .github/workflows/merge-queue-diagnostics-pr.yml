name: Merge Queue State — Read-Only Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/merge_queue_diagnostics.py
      - .github/workflows/merge-queue-diagnostics-pr.yml

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: merge-queue-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REPORT_PATH: reports/merge-queue-state.json
  TARGET_PULL_REQUESTS: "322,323"

jobs:
  diagnose:
    name: GitHub queue, rules, checks, and delivery state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Query GitHub read-only control-plane state
        run: python .github/scripts/merge_queue_diagnostics.py

      - name: Encode decisive findings in the artifact identity
        id: findings
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path

          report = json.loads(
              Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8")
          )
          control = report["control_plane"]

          def count(result):
              payload = result.get("payload")
              return len(payload) if result.get("ok") and isinstance(payload, list) else -1

          parts = [
              "mq",
              f"q{count(control['queue_branches'])}",
              f"r{count(control['merge_group_runs'])}",
              f"rules{int(bool(control['active_rules_main'].get('ok')))}",
              f"protect{int(bool(control['main_protection'].get('ok')))}",
          ]
          for number in ("322", "323"):
              target = report["targets"][number]
              rest = target["rest"].get("payload")
              graph = target["graphql"].get("payload")
              pull = None
              if isinstance(graph, dict):
                  pull = (
                      (graph.get("data") or {})
                      .get("repository", {})
                      .get("pullRequest")
                  )
              rest_auto = int(
                  isinstance(rest, dict) and rest.get("auto_merge") is not None
              )
              graph_auto = int(
                  isinstance(pull, dict)
                  and pull.get("autoMergeRequest") is not None
              )
              queue_entry = int(
                  isinstance(pull, dict)
                  and pull.get("mergeQueueEntry") is not None
              )
              state = (
                  str(rest.get("mergeable_state") or "unknown")
                  if isinstance(rest, dict)
                  else "unreadable"
              )
              state = re.sub(r"[^a-z0-9]+", "-", state.lower()).strip("-")
              parts.append(
                  f"p{number}-ro{rest_auto}-go{graph_auto}-qe{queue_entry}-gq{int(bool(target['graphql'].get('ok')))}-{state}"
              )
          slug = "-".join(parts)[:220]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"summary_slug={slug}\n")
          print(slug)

      - name: Upload immutable diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.findings.outputs.summary_slug || format('mq-not-encoded-{0}', github.run_id) }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 30
