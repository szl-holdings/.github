name: Merge Queue State — Read-Only Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/merge_queue_diagnostics.py
      - .github/scripts/merge_queue_blocker_diagnostics.py
      - .github/scripts/stale_check_diagnostics.py
      - .github/workflows/merge-queue-diagnostics-pr.yml

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: merge-queue-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  STATE_REPORT_PATH: reports/merge-queue-state.json
  BLOCKER_REPORT_PATH: reports/merge-queue-blocker.json
  STALE_REPORT_PATH: reports/stale-check-diagnostics.json
  TARGET_PULL_REQUESTS: "325"

jobs:
  diagnose:
    name: GitHub queue, rules, checks, and delivery state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Query broad read-only control-plane state
        env:
          REPORT_PATH: ${{ env.STATE_REPORT_PATH }}
        run: python .github/scripts/merge_queue_diagnostics.py

      - name: Isolate the exact pre-enqueue blocker
        env:
          REPORT_PATH: ${{ env.BLOCKER_REPORT_PATH }}
        run: python .github/scripts/merge_queue_blocker_diagnostics.py

      - name: Trace every non-terminal check run to its owner
        run: python .github/scripts/stale_check_diagnostics.py

      - name: Encode decisive findings in the artifact identity
        id: findings
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path

          blocker = json.loads(
              Path(os.environ["BLOCKER_REPORT_PATH"]).read_text(encoding="utf-8")
          )
          stale = json.loads(
              Path(os.environ["STALE_REPORT_PATH"]).read_text(encoding="utf-8")
          )
          parts = [
              "mqb",
              f"qb{len(blocker.get('queue_branches') or [])}",
              f"mgr{len(blocker.get('merge_group_runs') or [])}",
          ]
          for number in ("325",):
              target = blocker["targets"][number]
              rest = target["rest"]
              graph = target["graphql"].get("pull_request") or {}
              missing = len(target["required_checks"].get("missing") or [])
              non_success = len(
                  target["required_checks"].get("non_success") or []
              )
              unverified = len(target.get("unverified_commits") or [])
              unresolved = target["graphql"].get("unresolved_review_threads")
              non_terminal = len(
                  stale["targets"][number].get("non_terminal_checks") or []
              )
              state = re.sub(
                  r"[^a-z0-9]+",
                  "-",
                  str(rest.get("mergeable_state") or "unknown").lower(),
              ).strip("-")
              parts.append(
                  f"p{number}-{state}-m{missing}-n{non_success}-u{unverified}-t{unresolved if unresolved is not None else 'x'}-c{non_terminal}-qe{int(graph.get('mergeQueueEntry') is not None)}"
              )
          slug = "-".join(parts)[:220]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"summary_slug={slug}\n")
          print(slug)

      - name: Upload immutable diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.findings.outputs.summary_slug || format('mqb-not-encoded-{0}', github.run_id) }}
          path: |
            ${{ env.STATE_REPORT_PATH }}
            ${{ env.BLOCKER_REPORT_PATH }}
            ${{ env.STALE_REPORT_PATH }}
          if-no-files-found: error
          retention-days: 30
