name: Frontier converge all stalled builds — 2026-09-04 v2

on:
  push:
    branches:
      - frontier/converge-all-stalled-builds-20260904
    paths:
      - scripts/frontier_converge_20260904.py
      - .github/workflows/frontier-converge-all-stalled-builds-20260904-v2.yml
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: Bounded dependency and protection wait
        required: false
        default: "110"

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: frontier-converge-all-stalled-builds-20260904
  cancel-in-progress: true

jobs:
  converge:
    name: Audit, reconcile, merge, deploy, verify, receipt v2
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FRONTIER_OPERATOR_TOKEN_CANDIDATE: ${{ secrets.FRONTIER_OPERATOR_TOKEN || secrets.FRONTIER_GITHUB_TOKEN || secrets.SZL_GITHUB_TOKEN || secrets.SZL_GITHUB_PAT || secrets.SZL_ORG_ADMIN_TOKEN || secrets.ORG_ADMIN_TOKEN || secrets.ORG_GITHUB_TOKEN || secrets.GH_ADMIN_TOKEN || secrets.GITHUB_ADMIN_TOKEN || secrets.GH_ORG_TOKEN || secrets.GH_PAT || secrets.ORG_PAT || secrets.ADMIN_PAT || secrets.GITHUB_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.REPO_TOKEN || secrets.CROSS_REPO_TOKEN || secrets.AUTOMATION_TOKEN || secrets.SZL_BOT_TOKEN }}
      SZL_GITHUB_TOKEN_CANDIDATE: ${{ secrets.SZL_GITHUB_TOKEN }}
      ORG_ADMIN_TOKEN_CANDIDATE: ${{ secrets.ORG_ADMIN_TOKEN }}
      GH_ADMIN_TOKEN_CANDIDATE: ${{ secrets.GH_ADMIN_TOKEN }}
      GH_PAT_CANDIDATE: ${{ secrets.GH_PAT }}
      GITHUB_PAT_CANDIDATE: ${{ secrets.GITHUB_PAT }}
      PAT_CANDIDATE: ${{ secrets.PAT }}
      GITHUB_TOKEN_CANDIDATE: ${{ github.token }}
      HF_ORG_TOKEN_CANDIDATE: ${{ secrets.HF_ORG_TOKEN || secrets.HF_ORG_TOKEN1 || secrets.HF_WRITE_TOKEN || secrets.HF_TOKEN || secrets.HUGGINGFACEHUB_API_TOKEN || secrets.HUGGING_FACE_HUB_TOKEN }}
      HF_ORG_TOKEN1_CANDIDATE: ${{ secrets.HF_ORG_TOKEN1 }}
      HF_WRITE_TOKEN_CANDIDATE: ${{ secrets.HF_WRITE_TOKEN }}
      HF_TOKEN_CANDIDATE: ${{ secrets.HF_TOKEN }}
      HUGGINGFACEHUB_API_TOKEN_CANDIDATE: ${{ secrets.HUGGINGFACEHUB_API_TOKEN }}
      HUGGING_FACE_HUB_TOKEN_CANDIDATE: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
      REPORT_JSON: reports/frontier-convergence-20260904-v2.json
      REPORT_MD: reports/frontier-convergence-20260904-v2.md

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Mask all present credential candidates
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r name value; do
            case "$name" in
              *_TOKEN_CANDIDATE|*_PAT_CANDIDATE)
                [ -z "$value" ] || echo "::add-mask::$value"
                ;;
            esac
          done < <(env)

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          check-latest: false

      - name: Prove immutable execution boundary
        shell: bash
        run: |
          set -euo pipefail
          python -I -m py_compile scripts/frontier_converge_20260904.py
          python - <<'PY'
          from pathlib import Path
          source = Path('scripts/frontier_converge_20260904.py').read_text(encoding='utf-8')
          for marker in (
              'direct_main_write', 'force_push', 'admin_bypass',
              'credential_values_recorded', 'SUCCESSOR_STACK',
              'Sentra remains the sole Assurance Command',
          ):
              assert marker in source
          for marker in ('git push --force', 'git push -f', '--admin', 'delete_repo(', '/branches/main/protection'):
              assert marker not in source
          assert '("killinchu", "retire-legacy-resilience-spaces.yml")' not in source
          PY
          git diff --check

      - name: Execute current-state convergence
        id: execute
        shell: bash
        env:
          WAIT_MINUTES: ${{ inputs.wait_minutes || '110' }}
        run: |
          set +e
          mkdir -p reports
          python -I -P scripts/frontier_converge_20260904.py \
            --execute \
            --wait-minutes "$WAIT_MINUTES" \
            --json-output "$REPORT_JSON" \
            --markdown-output "$REPORT_MD" \
            > reports/frontier-convergence-v2-stdout.json \
            2> reports/frontier-convergence-v2-stderr.txt
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ ! -s "$REPORT_JSON" ]; then
            python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          err = Path('reports/frontier-convergence-v2-stderr.txt')
          receipt = {
              'schema':'szl.frontier-convergence-failure/v2',
              'completed_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'terminal_success':False,
              'error':err.read_text(encoding='utf-8',errors='replace')[-4000:] if err.exists() else 'no receipt',
              'credential_values_recorded':False,
              'direct_main_write':False,
              'force_push':False,
              'admin_bypass':False,
          }
          receipt['receipt_sha256']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path(os.environ['REPORT_JSON']).write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          Path(os.environ['REPORT_MD']).write_text('# SZL convergence failed closed\n',encoding='utf-8')
          PY
          fi
          exit 0

      - name: Upload immutable convergence evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontier-convergence-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.REPORT_JSON }}
            ${{ env.REPORT_MD }}
            reports/frontier-convergence-v2-stdout.json
            reports/frontier-convergence-v2-stderr.txt
          if-no-files-found: error
          retention-days: 180

      - name: Preserve fail-closed terminal verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path(os.environ['REPORT_JSON']).read_text(encoding='utf-8'))
          truth=report.get('final_truth') or report
          print(json.dumps({
              'terminal_success':truth.get('terminal_success',False),
              'open_pr_count':truth.get('open_pr_count'),
              'runtime_matches_main':truth.get('runtime_matches_main'),
              'cloudflare_public_contract':truth.get('cloudflare_public_contract'),
              'receipt_sha256':report.get('receipt_sha256'),
          },sort_keys=True))
          if truth.get('terminal_success') is not True:
              raise SystemExit(2)
          PY
