name: temporary-hf-vault-license-repair

on:
  push:
    branches:
      - ops/hf-estate-current-main-dispatch-20260830
    paths:
      - .github/workflows/temporary-hf-vault-license-repair.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TARGET_REPO: SZLHOLDINGS/vault-artifacts
    steps:
      - name: Check out exact protected controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0a8876aae82c597703c7cd4eb4cfb61fdeae10cc
          persist-credentials: false

      - name: Install exact supported Hub client
        shell: bash
        run: python -m pip install --disable-pip-version-check 'huggingface_hub==1.19.0'

      - name: Add the bounded private-dataset license declaration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from huggingface_hub import HfApi, hf_hub_download

          token = os.environ.get("HF_ORG_TOKEN") or os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("No Hugging Face organization token is configured")

          repo_id = os.environ["TARGET_REPO"]
          api = HfApi(token=token)
          who = api.whoami()
          orgs = {str(item.get("name")): str(item.get("roleInOrg", "")) for item in who.get("orgs", [])}
          if orgs.get("SZLHOLDINGS") != "admin":
              raise SystemExit("Hugging Face identity is not an SZLHOLDINGS admin")

          before = api.dataset_info(repo_id=repo_id, token=token, files_metadata=False)
          if not bool(before.private):
              raise SystemExit("Refusing metadata repair because vault-artifacts is not private")
          before_sha = str(before.sha)

          with TemporaryDirectory() as td:
              readme_path = Path(hf_hub_download(
                  repo_id=repo_id,
                  repo_type="dataset",
                  filename="README.md",
                  revision=before_sha,
                  token=token,
                  local_dir=td,
              ))
              original = readme_path.read_text(encoding="utf-8")

          front = re.match(r"\A---\s*\n(?P<body>.*?)\n---\s*\n", original, flags=re.DOTALL)
          if front:
              yaml_body = front.group("body")
              if re.search(r"(?m)^license\s*:", yaml_body):
                  value = re.search(r"(?m)^license\s*:\s*(.*?)\s*$", yaml_body)
                  if value and value.group(1).strip().lower() == "other":
                      print(f"already compliant at {before_sha}")
                      raise SystemExit(0)
                  raise SystemExit("Refusing to overwrite an existing license declaration")
              updated_yaml = "license: other\n" + yaml_body
              updated = original[:front.start("body")] + updated_yaml + original[front.end("body"):]
          else:
              updated = "---\nlicense: other\n---\n\n" + original

          api.upload_file(
              path_or_fileobj=updated.encode("utf-8"),
              path_in_repo="README.md",
              repo_id=repo_id,
              repo_type="dataset",
              revision="main",
              commit_message="chore(metadata): declare private vault license as other",
              token=token,
          )

          after = api.dataset_info(repo_id=repo_id, token=token, files_metadata=False)
          if not bool(after.private):
              raise SystemExit("Privacy invariant changed during metadata repair")
          after_sha = str(after.sha)
          if after_sha == before_sha:
              raise SystemExit("Expected a metadata commit but the dataset revision did not move")

          with TemporaryDirectory() as td:
              verified_path = Path(hf_hub_download(
                  repo_id=repo_id,
                  repo_type="dataset",
                  filename="README.md",
                  revision=after_sha,
                  token=token,
                  local_dir=td,
              ))
              verified = verified_path.read_text(encoding="utf-8")
          if not re.search(r"(?m)^license\s*:\s*other\s*$", verified):
              raise SystemExit("license: other was not observable at the exact new revision")

          print(f"private vault metadata repaired: {before_sha} -> {after_sha}")
          PY
