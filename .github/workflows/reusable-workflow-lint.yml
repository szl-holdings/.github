name: Reusable — Workflow Lint

# Static analysis for GitHub Actions workflow YAML.
# Runs actionlint (syntax, shell-script issues) and zizmor (security audit:
# unpinned actions, template-injection, untrusted checkout, secret leakage).
#
# Designed to be called by every code-bearing repo in the org so workflow
# regressions are caught before merge.

on:
  workflow_call:
    inputs:
      fail-on-zizmor-warning:
        description: 'Treat zizmor warnings as failures (in addition to errors).'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  zizmor:
    name: zizmor (security)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install zizmor
        run: pip install --require-hashes -r <(echo "zizmor==1.24.1 --hash=sha256:placeholder") 2>/dev/null || pip install zizmor==1.24.1

      - name: Run zizmor
        id: zizmor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAIL_ON_WARN: ${{ inputs.fail-on-zizmor-warning }}
        run: |
          set -euo pipefail
          # zizmor's exit status is the verdict. 0 means no findings. 11-14
          # means findings, and the value is the highest severity reported:
          # 13 is medium ("warning" in plain output), 14 is high ("error").
          # SARIF mode exits 0 with findings. Any other status (1 audit
          # error, 2 usage error, 3 no inputs collected, 10 retired since
          # zizmor 1.14, 126/127 missing binary, 128+ signal) is a scanner
          # failure and fails the job. The plain-text report is not parsed:
          # zizmor 1.24.1 colours it when CI=true, which Actions always sets,
          # so a line-start pattern such as '^error' never matches a finding.
          #
          # SARIF for the code-scanning upload, then plain text in the log so
          # reviewers can read findings without leaving the run.
          sarif_status=0
          zizmor --format=sarif .github/workflows > zizmor.sarif || sarif_status=$?
          plain_status=0
          zizmor --format=plain .github/workflows || plain_status=$?

          scanner_failed=0
          for run in "sarif:${sarif_status}" "plain:${plain_status}"; do
            case "${run#*:}" in
              0|1[1-4]) ;;
              *)
                echo "::error::zizmor --format=${run%%:*} exited ${run#*:}: the scanner failed, so this run has no audit result."
                scanner_failed=1
                ;;
            esac
          done
          if [ "${scanner_failed}" -ne 0 ]; then
            exit 1
          fi
          if [ ! -s zizmor.sarif ]; then
            echo "::error::zizmor exited ${sarif_status} but wrote no SARIF report."
            exit 1
          fi

          if [ "${FAIL_ON_WARN}" = "true" ]; then
            threshold=13
          else
            threshold=14
          fi
          if [ "${plain_status}" -ge "${threshold}" ]; then
            echo "::error::zizmor reported findings at or above the failure threshold (exit ${plain_status}, threshold ${threshold})."
            exit 1
          fi
          echo "zizmor passed: exit ${plain_status}, failure threshold ${threshold}."

      - name: Upload SARIF to code-scanning
        if: always() && hashFiles('zizmor.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: zizmor.sarif
          category: zizmor
