name: Reusable — Workflow Lint

# Static analysis for GitHub Actions workflow YAML.
# Runs actionlint (syntax, shell-script issues) and zizmor (security audit:
# unpinned actions, template-injection, untrusted checkout, secret leakage).
#
# Designed to be called by every code-bearing repo in the org so workflow
# regressions are caught before merge.
#
# Token boundary: no job that runs a scanner or installs a tool can write.
# The zizmor job keeps a read-only token for its online audits and hands its
# SARIF report to the next job as a run artifact. Only the sarif-upload job
# holds security-events: write, and its only steps are the pinned same-run
# artifact download and the pinned code-scanning upload.

on:
  workflow_call:
    inputs:
      fail-on-zizmor-warning:
        description: 'Treat zizmor warnings as failures (in addition to errors).'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The rhysd/actionlint action is a Dockerfile action built from floating
      # base images, so its commit SHA does not pin what runs. Use the release
      # binary instead, checked against the sha256 published in the v1.7.12
      # release's actionlint_1.7.12_checksums.txt.
      - name: Install actionlint 1.7.12 (hash-checked)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o actionlint_1.7.12_linux_amd64.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" > actionlint.sha256
          sha256sum --check --strict actionlint.sha256
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint

      - name: Run actionlint
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint"

  zizmor:
    name: zizmor (security)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sarif_artifact_id: ${{ steps.sarif-artifact.outputs.artifact-id }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # sha256 of zizmor-1.24.1-py3-none-manylinux_2_28_x86_64.whl on PyPI.
      # zizmor has no Python dependencies.
      - name: Install zizmor 1.24.1 (hash-checked)
        run: |
          set -euo pipefail
          echo "zizmor==1.24.1 --hash=sha256:73083efc7a65e5a58f4439dd781cdcb0394b05a3750e664c7f7e414589dc49b1" > "$RUNNER_TEMP/zizmor-requirements.txt"
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/zizmor-requirements.txt"

      - name: Run zizmor
        id: zizmor
        env:
          # Read-only token (this job has contents: read) for zizmor's online
          # audits, such as known-vulnerable-actions and impostor-commit.
          GITHUB_TOKEN: ${{ github.token }}
          FAIL_ON_WARN: ${{ inputs.fail-on-zizmor-warning }}
        run: |
          set -euo pipefail
          # zizmor's exit status is the verdict. 0 means no findings. 11-14
          # means findings, and the value is the highest severity reported:
          # 13 is medium ("warning" in plain output), 14 is high ("error").
          # SARIF mode exits 0 with findings. Any other status (1 audit
          # error, 2 usage error, 3 no inputs collected, 10 retired since
          # zizmor 1.14, 126/127 missing binary, 128+ signal) is a scanner
          # failure and fails the job. The plain-text report is not parsed:
          # zizmor 1.24.1 colours it when CI=true, which Actions always sets,
          # so a line-start pattern such as '^error' never matches a finding.
          #
          # SARIF for the code-scanning upload, then plain text in the log so
          # reviewers can read findings without leaving the run.
          sarif_status=0
          zizmor --format=sarif .github/workflows > zizmor.sarif || sarif_status=$?
          plain_status=0
          zizmor --format=plain .github/workflows || plain_status=$?

          scanner_failed=0
          for run in "sarif:${sarif_status}" "plain:${plain_status}"; do
            case "${run#*:}" in
              0|1[1-4]) ;;
              *)
                echo "::error::zizmor --format=${run%%:*} exited ${run#*:}: the scanner failed, so this run has no audit result."
                scanner_failed=1
                ;;
            esac
          done
          if [ "${scanner_failed}" -ne 0 ]; then
            exit 1
          fi
          if [ ! -s zizmor.sarif ]; then
            echo "::error::zizmor exited ${sarif_status} but wrote no SARIF report."
            exit 1
          fi

          if [ "${FAIL_ON_WARN}" = "true" ]; then
            threshold=13
          else
            threshold=14
          fi
          if [ "${plain_status}" -ge "${threshold}" ]; then
            echo "::error::zizmor reported findings at or above the failure threshold (exit ${plain_status}, threshold ${threshold})."
            exit 1
          fi
          echo "zizmor passed: exit ${plain_status}, failure threshold ${threshold}."

      - name: Upload SARIF report artifact
        id: sarif-artifact
        if: always() && hashFiles('zizmor.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zizmor-sarif
          path: zizmor.sarif
          if-no-files-found: error
          retention-days: 1

  sarif-upload:
    name: zizmor SARIF upload
    needs: zizmor
    # Runs when the scan job failed on findings too, so they still reach code
    # scanning; skipped only when no SARIF artifact was produced.
    if: ${{ !cancelled() && needs.zizmor.outputs.sarif_artifact_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download SARIF report artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zizmor-sarif

      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: zizmor.sarif
          category: zizmor
