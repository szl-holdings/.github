name: Probe Code-Security Credentials — Read-Only

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/probe_code_security_credentials.py
      - .github/workflows/probe-code-security-credentials-pr.yml

permissions:
  contents: read

concurrency:
  group: probe-code-security-credentials-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REPORT_PATH: reports/code-security-credential-probe.json

jobs:
  probe:
    name: Test exact organization endpoint without exposing credentials
    if: >-
      github.repository == 'szl-holdings/.github' &&
      github.event.pull_request.number == 324 &&
      github.event.pull_request.head.repo.full_name == 'szl-holdings/.github' &&
      github.event.pull_request.head.ref == 'diag/merge-queue-state-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout read-only capability probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Compile and constrain the probe
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/probe_code_security_credentials.py
          python - <<'PY'
          from pathlib import Path

          source = Path(
              '.github/scripts/probe_code_security_credentials.py'
          ).read_text(encoding='utf-8')
          required = (
              'code-security/configurations?per_page=1',
              '"SZL_GITHUB_TOKEN"',
              '"GH_NOTIFICATIONS_TOKEN"',
              'No token value, length, prefix, hash, identity',
              'No GitHub resource is mutated',
          )
          forbidden = (
              'hashlib',
              'print(token',
              'len(token',
              'method="POST"',
              'method="PATCH"',
              'method="PUT"',
              'method="DELETE"',
          )
          for marker in required:
              assert marker in source, marker
          for marker in forbidden:
              assert marker not in source, marker
          PY
          git diff --check

      - name: Probe the exact endpoint with existing governed secrets
        id: probe
        env:
          SZL_GITHUB_TOKEN: ${{ secrets.SZL_GITHUB_TOKEN }}
          GH_NOTIFICATIONS_TOKEN: ${{ secrets.GH_NOTIFICATIONS_TOKEN }}
        shell: bash
        run: |
          set +e
          python .github/scripts/probe_code_security_credentials.py
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable capability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-security-credential-probe-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce availability of one authorized governed credential
        if: always()
        env:
          EXIT_CODE: ${{ steps.probe.outputs.exit_code }}
        run: |
          code="${EXIT_CODE:-2}"
          if [ "$code" -ne 0 ]; then
            echo "::error::No existing governed credential can read the exact organization code-security endpoint."
            exit "$code"
          fi
          echo "At least one existing governed credential can read the exact organization code-security endpoint."
