name: Materialize HF remote ADD parser repair once

on:
  push:
    branches:
      - fix/hf-deployer-remote-add-20260904
    paths:
      - .github/workflows/materialize-hf-remote-add-fix-once.yml

permissions:
  contents: write

concurrency:
  group: materialize-hf-remote-add-fix-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-deployer-remote-add-20260904
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Apply the exact remote ADD repair and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script = Path('.github/scripts/hf_deploy_from_dockerfile.py')
          text = script.read_text(encoding='utf-8')

          old_header = '''# --------------------------------------------------------------------------- #
          # Dockerfile COPY parsing (shared logic with hf_module_drift_check.py)
          # --------------------------------------------------------------------------- #
          def parse_copy_sources(dockerfile_text, *, eligible_sources=None):
          '''
          new_header = '''# --------------------------------------------------------------------------- #
          # Dockerfile COPY parsing (shared logic with hf_module_drift_check.py)
          # --------------------------------------------------------------------------- #
          _REMOTE_ADD_SCHEMES = frozenset({"http", "https", "git", "ssh"})
          _REMOTE_ADD_SCP_RE = re.compile(r"^[^/@\\s]+@[^:/\\s]+:.+$")


          def is_remote_add_source(instruction, source):
              """Return whether one ADD source is external to the Git build context.

              Docker permits ADD to fetch HTTP(S) resources and Git repositories.
              Those inputs remain cryptographically bound by the published Dockerfile,
              but they are not local checkout paths and therefore must not enter the
              GitHub-to-Hub file manifest. COPY never receives this exemption.
              """
              if str(instruction or "").upper() != "ADD":
                  return False
              value = str(source or "").strip()
              if _REMOTE_ADD_SCP_RE.fullmatch(value):
                  return True
              parsed = urllib.parse.urlsplit(value)
              return (
                  parsed.scheme.casefold() in _REMOTE_ADD_SCHEMES
                  and bool(parsed.netloc or parsed.path)
              )


          def parse_copy_sources(dockerfile_text, *, eligible_sources=None):
          '''
          if text.count(old_header) != 1:
              raise SystemExit('deployer parser header drifted')
          text = text.replace(old_header, new_header, 1)

          old_doc = '''    """Return COPY/ADD *source* tokens. Joins line-continuations, handles the
              JSON-array form, drops --flag options, and SKIPS `--from=` build-stage
              copies. A whole-context source is rejected because it cannot be represented
              as a curated, independently attestable deploy set. When requested,
              eligible_sources receives only sources from instructions without
              `--exclude`, which are safe to use as source-revision coverage."""
          '''
          new_doc = '''    """Return local COPY/ADD source tokens from the Git build context.

              Joins line-continuations, handles the JSON-array form, drops --flag
              options, skips `--from=` build-stage copies, and excludes remote ADD
              inputs. Remote inputs remain bound by the Dockerfile bytes but are not
              uploaded as repository files. A whole-context local source is rejected.
              When requested, eligible_sources receives only local sources from
              instructions without `--exclude`."""
          '''
          if text.count(old_doc) != 1:
              raise SystemExit('deployer parser docstring drifted')
          text = text.replace(old_doc, new_doc, 1)

          old_match = '''        if not m:
                      continue
                  rest = m.group(2).strip()
          '''
          new_match = '''        if not m:
                      continue
                  instruction = m.group(1).upper()
                  rest = m.group(2).strip()
          '''
          if text.count(old_match) != 1:
              raise SystemExit('deployer instruction match block drifted')
          text = text.replace(old_match, new_match, 1)

          old_json = '''            sources.extend(arr[:-1])
                      revision_eligible.extend(arr[:-1])
                      continue
          '''
          new_json = '''            local_sources = [
                          source
                          for source in arr[:-1]
                          if not is_remote_add_source(instruction, source)
                      ]
                      sources.extend(local_sources)
                      revision_eligible.extend(local_sources)
                      continue
          '''
          if text.count(old_json) != 1:
              raise SystemExit('deployer JSON-form source block drifted')
          text = text.replace(old_json, new_json, 1)

          old_shell = '''        srcs = clean[:-1]
                  for source in srcs:
          '''
          new_shell = '''        srcs = [
                      source
                      for source in clean[:-1]
                      if not is_remote_add_source(instruction, source)
                  ]
                  for source in srcs:
          '''
          if text.count(old_shell) != 1:
              raise SystemExit('deployer shell-form source block drifted')
          text = text.replace(old_shell, new_shell, 1)
          script.write_text(text, encoding='utf-8', newline='\n')

          tests = Path('.github/scripts/test_hf_deploy_from_dockerfile.py')
          test_text = tests.read_text(encoding='utf-8')
          anchor = '''    def test_comments_ignored(self):
                  df = "FROM python:3.12\\n# COPY ghost.py /app/ghost.py\\nCOPY serve.py /app/\\n"
                  self.assertEqual(dep.parse_copy_sources(df), ["serve.py"])


          class TestExpandSources(unittest.TestCase):
          '''
          replacement = '''    def test_comments_ignored(self):
                  df = "FROM python:3.12\\n# COPY ghost.py /app/ghost.py\\nCOPY serve.py /app/\\n"
                  self.assertEqual(dep.parse_copy_sources(df), ["serve.py"])

              def test_checksum_pinned_remote_add_is_not_a_local_source(self):
                  digest = "a" * 64
                  url = "https://example.invalid/releases/tool.whl"
                  df = (
                      "FROM python:3.12\\n"
                      f"ADD --checksum=sha256:{digest} {url} /wheels/tool.whl\\n"
                      "COPY serve.py /app/serve.py\\n"
                  )
                  eligible = []
                  self.assertEqual(
                      dep.parse_copy_sources(df, eligible_sources=eligible),
                      ["serve.py"],
                  )
                  self.assertEqual(eligible, ["serve.py"])
                  self.assertTrue(dep.is_remote_add_source("ADD", url))

              def test_remote_copy_is_not_exempted(self):
                  url = "https://example.invalid/not-supported-for-copy.whl"
                  df = f"FROM python:3.12\\nCOPY {url} /wheels/tool.whl\\n"
                  self.assertEqual(dep.parse_copy_sources(df), [url])
                  self.assertFalse(dep.is_remote_add_source("COPY", url))

              def test_json_form_remote_add_is_not_a_local_source(self):
                  url = "https://example.invalid/archive.tar.gz"
                  df = 'FROM scratch\\nADD ["' + url + '", "/src/archive.tar.gz"]\\n'
                  self.assertEqual(dep.parse_copy_sources(df), [])


          class TestExpandSources(unittest.TestCase):
          '''
          if test_text.count(anchor) != 1:
              raise SystemExit('deployer test insertion anchor drifted')
          test_text = test_text.replace(anchor, replacement, 1)

          derive_anchor = '''class TestDeriveReadmePolicy(unittest.TestCase):
              def _derive(
          '''
          derive_replacement = '''class TestDeriveReadmePolicy(unittest.TestCase):
              def test_checksum_pinned_remote_add_is_bound_only_by_dockerfile(self):
                  digest = "b" * 64
                  url = "https://example.invalid/releases/tool.whl"
                  manifest, files = self._derive(
                      (
                          "FROM python:3.12\\n"
                          f"ADD --checksum=sha256:{digest} {url} /wheels/tool.whl\\n"
                          "COPY serve.py /app/serve.py\\n"
                      ),
                      {"serve.py": "pass\\n"},
                      include_readme=False,
                  )
                  self.assertEqual(
                      set(files),
                      {"Dockerfile", "Dockerfile.dockerignore", "serve.py"},
                  )
                  self.assertEqual(manifest["files_resolved"], 1)
                  self.assertNotIn(url, manifest.get("copy_sources", []))

              def _derive(
          '''
          if test_text.count(derive_anchor) != 1:
              raise SystemExit('derive test insertion anchor drifted')
          test_text = test_text.replace(derive_anchor, derive_replacement, 1)
          tests.write_text(test_text, encoding='utf-8', newline='\n')
          PY

      - name: Run the full reusable publisher test closure
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            .github/scripts/hf_deploy_from_dockerfile.py \
            .github/scripts/test_hf_deploy_from_dockerfile.py
          python .github/scripts/test_hf_deploy_from_dockerfile.py
          python .github/scripts/test_hf_candidate_plan.py
          python .github/scripts/test_hf_module_drift_check.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('.github/scripts/hf_deploy_from_dockerfile.py')
          spec = importlib.util.spec_from_file_location('deployer', path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)

          dockerfile = '''FROM python:3.12-slim
          ADD --checksum=sha256:d172f3d3c8cdd194c3c47c71cb077ed6e61354a2d0f939ceeac0c8fd29999596 \\
              https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.35/llama_cpp_python-0.3.35-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.whl \\
              /wheels/llama_cpp_python-0.3.35-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
          COPY serve.py /app/serve.py
          '''
          assert module.parse_copy_sources(dockerfile) == ['serve.py']
          PY
          git diff --check

      - name: Remove transport workflow and push clean branch head
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/materialize-hf-remote-add-fix-once.yml
          git add .github/scripts/hf_deploy_from_dockerfile.py \
            .github/scripts/test_hf_deploy_from_dockerfile.py
          git diff --cached --check
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git commit -s -m "fix(hf): treat remote ADD inputs as Dockerfile-bound externals" \
            -m "Exclude checksum-pinned remote ADD URLs and Git sources from the local checkout manifest while keeping COPY strict. Add parser and end-to-end derivation regressions for the A11oy wheel transport failure."
          git push origin HEAD:fix/hf-deployer-remote-add-20260904
