name: Cleanup Vertical Frontier imports once

on:
  push:
    branches:
      - feat/publish-vertical-frontier-v1
    paths:
      - .github/workflows/cleanup-vertical-frontier-imports-once.yml

permissions:
  contents: write

concurrency:
  group: cleanup-vertical-frontier-imports-once
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/publish-vertical-frontier-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and verify exact cleanup
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/cleanup_vertical_frontier_imports.py
          python -B -m py_compile .github/scripts/publish_vertical_frontier.py
          python -B -I -P .github/scripts/publish_vertical_frontier.py --self-test
          git diff --check HEAD

      - name: Commit only permanent reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cleanup-vertical-frontier-imports-once.yml tools/cleanup_vertical_frontier_imports.py
          git diff --check HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit \
            -m 'fix(hf): remove unused Vertical Frontier publisher imports' \
            -m 'Remove only dataclass, Sequence, HTTPError, and URLError after exact review confirmation that none is referenced. Preserve publisher behavior and rerun the full source, image, and smoke gates.' \
            -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:feat/publish-vertical-frontier-v1
