name: SBOM

# Generates a Software Bill of Materials using Syft.
# Required for Series-A supply-chain diligence.

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

# Least-privilege: checkout only needs read; upload-artifact does not require
# contents: write. Lowered from write to read to satisfy Scorecard TokenPermissionsID.
permissions:
  contents: read

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Cosign for Syft release verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Generate CycloneDX SBOM with digest-verified Syft
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "${RUNNER_TEMP}/syft.XXXXXX")"
          archive="${tool_dir}/syft.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --max-time 180 --max-filesize 40000000 \
            --output "$archive" \
            'https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz'
          printf '%s  %s\n' \
            '8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3' \
            "$archive" | sha256sum --check --status
          release='https://github.com/anchore/syft/releases/download/v1.51.1'
          checksums_name='syft_1.51.1_checksums.txt'
          for name in "$checksums_name" "${checksums_name}.sig" "${checksums_name}.pem"; do
            curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' \
              --max-time 180 --max-filesize 100000 \
              --output "$tool_dir/$name" "$release/$name"
          done
          printf '%s  %s\n' \
            '105346699e7cb694afa37a21e2386432df6278c99f71331c24b1e0bb0f38cc75' "$tool_dir/$checksums_name" \
            '327121fcb70d67edb79c4b36602cbd7c7cab43cc8387543f40f49967f3103913' "$tool_dir/${checksums_name}.sig" \
            '23ad7eac1612fe53d77a58d414423b2e9064c557d214d81b8e83595caa0c14db' "$tool_dir/${checksums_name}.pem" \
            | sha256sum --check --status
          cosign verify-blob "$tool_dir/$checksums_name" \
            --signature "$tool_dir/${checksums_name}.sig" \
            --certificate "$tool_dir/${checksums_name}.pem" \
            --certificate-identity 'https://github.com/anchore/syft/.github/workflows/release.yaml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          grep -Fqx \
            '8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3  syft_1.51.1_linux_amd64.tar.gz' \
            "$tool_dir/$checksums_name"
          tar -xzf "$archive" -C "$tool_dir" syft
          test -x "${tool_dir}/syft"
          SYFT_CHECK_FOR_APP_UPDATE=false "${tool_dir}/syft" dir:. \
            -o cyclonedx-json=sbom.cyclonedx.json
      - name: Verify CycloneDX SBOM
        run: |
          test -s sbom.cyclonedx.json
          jq -e '.bomFormat == "CycloneDX" and (.components | type == "array")' \
            sbom.cyclonedx.json > /dev/null
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cyclonedx.json
          if-no-files-found: error
          retention-days: 30
