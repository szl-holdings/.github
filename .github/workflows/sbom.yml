name: SBOM

# Generates a Software Bill of Materials using Syft.
# Required for Series-A supply-chain diligence.

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

# Least-privilege: checkout only needs read; upload-artifact does not require
# contents: write. Lowered from write to read to satisfy Scorecard TokenPermissionsID.
permissions:
  contents: read

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Verify CycloneDX SBOM
        run: |
          test -s sbom.cyclonedx.json
          jq -e '.bomFormat == "CycloneDX"' sbom.cyclonedx.json > /dev/null
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cyclonedx.json
          if-no-files-found: error
          retention-days: 30
