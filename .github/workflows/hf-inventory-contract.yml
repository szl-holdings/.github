# SPDX-License-Identifier: Apache-2.0
name: HF Inventory Security Contracts

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: hf-inventory-contract-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Credential-free inventory contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install supported test clients without organization credentials
        run: |
          python -m pip install --disable-pip-version-check "huggingface_hub==1.23.0" "requests==2.32.5" "PyYAML==6.0.3"
      - name: Verify candidate checkout identity
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$HEAD_SHA"
      - name: Test inventory, public projection, and credential boundaries
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/hf_official_estate_inventory.py .github/scripts/hf_official_estate_inventory_compat.py .github/scripts/hf_inventory_public_boundary.py .github/scripts/hf_inventory_evidence.py .github/scripts/verify_hf_inventory_source.py .github/scripts/test_hf_official_estate_inventory.py .github/scripts/test_hf_official_estate_inventory_compat.py .github/scripts/test_hf_inventory_public_boundary.py .github/scripts/test_hf_inventory_workflow_boundary.py .github/scripts/test_hf_inventory_evidence.py
          python .github/scripts/run_hf_inventory_contracts.py
          python -m pip check
          git diff --check
      - name: Retain reproducible public verification source
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          paths = [
              '.github/scripts/hf_official_estate_inventory.py',
              '.github/scripts/hf_official_estate_inventory_compat.py',
              '.github/scripts/test_hf_official_estate_inventory.py',
              '.github/scripts/test_hf_official_estate_inventory_compat.py',
              '.github/scripts/hf_inventory_public_boundary.py',
              '.github/scripts/hf_inventory_evidence.py',
              '.github/scripts/test_hf_inventory_evidence.py',
              '.github/scripts/run_hf_inventory_contracts.py',
              '.github/scripts/verify_hf_inventory_source.py',
              '.github/scripts/test_hf_inventory_public_boundary.py',
              '.github/scripts/test_hf_inventory_workflow_boundary.py',
              '.github/scripts/control_plane_effect_gate.py',
              '.github/scripts/test_control_plane_effect_gate.py',
              '.github/data/control_plane_effect_policy.json',
              '.github/workflows/hf-official-estate-inventory.yml',
              '.github/workflows/hf-inventory-contract.yml',
          ]
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          baseline = subprocess.check_output(['git', 'rev-parse', 'refs/remotes/origin/main'], text=True).strip()
          manifest = {'source_revision': source, 'baseline_revision': baseline, 'scope': 'PUBLIC_SOURCE_ONLY_NOT_AN_ADMISSION_RECEIPT', 'files': {}}
          pathlib.Path('reports').mkdir(exist_ok=True)
          with zipfile.ZipFile('reports/hf-inventory-verification-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in paths:
                  data = pathlib.Path(name).read_bytes()
                  manifest['files'][name] = hashlib.sha256(data).hexdigest()
                  archive.writestr('candidate/' + name, data)
              for name in ('.github/data/control_plane_effect_policy.json', '.github/scripts/control_plane_effect_gate.py', '.github/scripts/test_control_plane_effect_gate.py'):
                  data = subprocess.check_output(['git', 'show', baseline + ':' + name])
                  archive.writestr('baseline/' + name, data)
              archive.writestr('manifest.json', json.dumps(manifest, sort_keys=True, indent=2))
          PY
      - name: Upload only the public source packet
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hf-inventory-verification-source
          path: reports/hf-inventory-verification-source.zip
          if-no-files-found: error
          retention-days: 7
