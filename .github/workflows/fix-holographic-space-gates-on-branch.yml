name: Fix Holographic Space Gates on Branch

on:
  push:
    branches:
      - feat/holographic-space-fabric-v2-20260902
    paths:
      - ".github/workflows/fix-holographic-space-gates-on-branch.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/holographic-space-fabric-v2-20260902
          fetch-depth: 0
      - name: Correct empty legacy-status handling and remove one-shot controller
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('.github/workflows/holographic-space-fabric-v2-gate-and-merge.yml'): (
                  'if peers and not pending and legacy.get("state") != "pending":',
                  'if peers and not pending and not any(row.get("state") == "pending" for row in legacy.get("statuses", [])):',
              ),
              Path('.github/scripts/rollout_holographic_spaces_v2.py'): (
                  'if checks and not pending and legacy.get("state") != "pending":',
                  'if checks and not pending and not any(row.get("state") == "pending" for row in legacy.get("statuses", [])):',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected gate expression not found in {path}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/fix-holographic-space-gates-on-branch.yml
          git config user.name "SZL Space Gate Hardening Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add .github/workflows/holographic-space-fabric-v2-gate-and-merge.yml .github/scripts/rollout_holographic_spaces_v2.py .github/workflows/fix-holographic-space-gates-on-branch.yml
          git commit -s -m "fix(ci): handle empty legacy status contexts"
          git push origin HEAD:feat/holographic-space-fabric-v2-20260902
