name: DCO

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted base checker for pull requests
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact pull-request commits from trusted base
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python "$GITHUB_WORKSPACE/trusted/.github/scripts/dco_check.py"
          --repo-root "$GITHUB_WORKSPACE/candidate"
          --event-path "$GITHUB_EVENT_PATH"

      - name: Validate exact merge-group range
        if: github.event_name == 'merge_group'
        run: >-
          python "$GITHUB_WORKSPACE/candidate/.github/scripts/dco_check.py"
          --repo-root "$GITHUB_WORKSPACE/candidate"
          --event-path "$GITHUB_EVENT_PATH"

      - name: Validate exact protected push range
        if: github.event_name == 'push'
        run: >-
          python "$GITHUB_WORKSPACE/candidate/.github/scripts/dco_check.py"
          --repo-root "$GITHUB_WORKSPACE/candidate"
          --event-path "$GITHUB_EVENT_PATH"
