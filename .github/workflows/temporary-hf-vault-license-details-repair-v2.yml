name: temporary-hf-vault-license-details-repair-v2

on:
  push:
    branches:
      - ops/hf-estate-current-main-dispatch-20260830
    paths:
      - .github/workflows/temporary-hf-vault-license-details-repair-v2.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TARGET_REPO: SZLHOLDINGS/vault-artifacts
      LICENSE_NAME: licenseref-szl-proprietary
      LICENSE_LINK: https://github.com/szl-holdings/platform/blob/2e10ce743977a6e63d1b5c3c94f7210c95eef18a/LICENSE
    steps:
      - name: Check out exact protected controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0a8876aae82c597703c7cd4eb4cfb61fdeae10cc
          persist-credentials: false

      - name: Install exact supported Hub client
        shell: bash
        run: python -m pip install --disable-pip-version-check 'huggingface_hub==1.19.0'

      - name: Complete and verify the private license declaration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from huggingface_hub import HfApi, hf_hub_download

          token = os.environ.get('HF_ORG_TOKEN') or os.environ.get('HF_TOKEN')
          if not token:
              raise SystemExit('No Hugging Face organization token is configured')
          api = HfApi(token=token)
          orgs = {str(item.get('name')): str(item.get('roleInOrg', '')) for item in api.whoami().get('orgs', [])}
          if orgs.get('SZLHOLDINGS') != 'admin':
              raise SystemExit('Hugging Face identity is not an SZLHOLDINGS admin')

          repo_id = os.environ['TARGET_REPO']
          expected_name = os.environ['LICENSE_NAME']
          expected_link = os.environ['LICENSE_LINK']
          before = api.dataset_info(repo_id=repo_id, token=token, files_metadata=False)
          if not bool(before.private):
              raise SystemExit('Refusing because vault-artifacts is not private')
          before_sha = str(before.sha)

          with TemporaryDirectory() as td:
              source = Path(hf_hub_download(
                  repo_id=repo_id,
                  repo_type='dataset',
                  filename='README.md',
                  revision=before_sha,
                  token=token,
                  local_dir=td,
              ))
              original = source.read_text(encoding='utf-8')

          front = re.match(r'\A---\s*\n(?P<body>.*?)\n---\s*\n', original, flags=re.DOTALL)
          if not front:
              raise SystemExit('Expected existing YAML front matter')
          body = front.group('body')
          if not re.search(r'(?m)^license\s*:\s*other\s*$', body):
              raise SystemExit('Refusing to change a non-other license')

          expected = {
              'license_name': expected_name,
              'license_link': expected_link,
          }
          updated_body = body
          changed = False
          for key, value in expected.items():
              pattern = re.compile(rf'(?m)^{re.escape(key)}\s*:\s*(.*?)\s*$')
              match = pattern.search(updated_body)
              if match:
                  if match.group(1).strip() != value:
                      raise SystemExit(f'Refusing to overwrite conflicting {key}')
                  continue
              anchor = re.search(r'(?m)^license\s*:\s*other\s*$', updated_body)
              if not anchor:
                  raise SystemExit('license anchor disappeared')
              updated_body = updated_body[:anchor.end()] + f'\n{key}: {value}' + updated_body[anchor.end():]
              changed = True

          if not changed:
              print(f'already compliant at {before_sha}')
              raise SystemExit(0)

          updated = original[:front.start('body')] + updated_body + original[front.end('body'):]
          api.upload_file(
              path_or_fileobj=updated.encode('utf-8'),
              path_in_repo='README.md',
              repo_id=repo_id,
              repo_type='dataset',
              revision='main',
              commit_message='chore(metadata): bind private proprietary license details',
              token=token,
          )

          after = api.dataset_info(repo_id=repo_id, token=token, files_metadata=False)
          if not bool(after.private):
              raise SystemExit('Privacy invariant changed')
          after_sha = str(after.sha)
          if after_sha == before_sha:
              raise SystemExit('Expected the metadata revision to move')

          with TemporaryDirectory() as td:
              checked = Path(hf_hub_download(
                  repo_id=repo_id,
                  repo_type='dataset',
                  filename='README.md',
                  revision=after_sha,
                  token=token,
                  local_dir=td,
              )).read_text(encoding='utf-8')
          required = {
              'license': 'other',
              'license_name': expected_name,
              'license_link': expected_link,
          }
          for key, value in required.items():
              if not re.search(rf'(?m)^{re.escape(key)}\s*:\s*{re.escape(value)}\s*$', checked):
                  raise SystemExit(f'{key} missing from exact revision {after_sha}')
          print(f'private vault license metadata completed: {before_sha} -> {after_sha}')
          PY
