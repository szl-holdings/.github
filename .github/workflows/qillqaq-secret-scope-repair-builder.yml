name: Repair qillqaq secret-scope boundary

on:
  push:
    branches:
      - fix/qillqaq-secret-name-read-current-main-20260820

permissions:
  contents: write

concurrency:
  group: qillqaq-secret-scope-repair
  cancel-in-progress: false

jobs:
  repair:
    name: constrain tokens and publish clean successor
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/qillqaq-secret-name-read-current-main-20260820
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Apply least-privilege repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path('.')

          manifest_path = root / '.governance/github-app-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          permissions = manifest['default_permissions']
          removed = permissions.pop('organization_secrets', None)
          if removed != 'read':
              raise SystemExit('expected organization_secrets: read before repair')
          if permissions.get('secrets') != 'read':
              raise SystemExit('repository secrets: read must remain present')
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          secret_health_path = root / '.github/workflows/secret-health.yml'
          secret_health = secret_health_path.read_text(encoding='utf-8')
          secret_health = secret_health.replace(
              'repository/organization Secrets read.',
              'repository Secrets read.',
              1,
          )
          organization_input = '          permission-organization-secrets: read\n'
          if organization_input not in secret_health:
              raise SystemExit('secret-health organization permission input is absent')
          secret_health = secret_health.replace(organization_input, '', 1)
          if 'permission-organization-secrets:' in secret_health:
              raise SystemExit('secret-health still requests organization secret metadata')
          if 'permission-secrets: read' not in secret_health:
              raise SystemExit('secret-health lost repository secret-name read')
          secret_health_path.write_text(secret_health, encoding='utf-8')

          attestor_path = root / '.github/workflows/attest-and-approve.yml'
          attestor = attestor_path.read_text(encoding='utf-8')
          start = attestor.index('      - name: Mint the independent App token')
          end = attestor.index('      - name: Resolve the attestation subject', start)
          block = attestor[start:end]
          if 'permission-actions:' in block:
              raise SystemExit('attestor token is already permission-filtered')
          lines = block.splitlines(keepends=True)
          repository_index = next(
              index
              for index, line in enumerate(lines)
              if line.lstrip().startswith('repositories:')
          )
          filters = (
              '          permission-actions: read\n'
              '          permission-administration: read\n'
              '          permission-checks: read\n'
              '          permission-contents: read\n'
              '          permission-metadata: read\n'
              '          permission-pull-requests: write\n'
              '          permission-statuses: write\n'
          )
          lines.insert(repository_index + 1, filters)
          repaired_block = ''.join(lines)
          for forbidden in (
              'permission-secrets:',
              'permission-organization-secrets:',
              'permission-organization-administration:',
          ):
              if forbidden in repaired_block:
                  raise SystemExit(f'attestor token unexpectedly requests {forbidden}')
          attestor = attestor[:start] + repaired_block + attestor[end:]
          attestor_path.write_text(attestor, encoding='utf-8')

          governance_path = root / '.github/scripts/verify_forge9_governance.py'
          governance = governance_path.read_text(encoding='utf-8')
          expected_org_line = '        "organization_secrets": "read",\n'
          if expected_org_line not in governance:
              raise SystemExit('FORGE-9 organization secret permission invariant is absent')
          governance = governance.replace(expected_org_line, '', 1)
          anchor = (
              '    attestor_template = (\n'
              '        ROOT / ".github/workflows/attest-and-approve.yml"\n'
              '    ).read_text(encoding="utf-8")\n'
          )
          if anchor not in governance:
              raise SystemExit('FORGE-9 attestor template anchor is absent')
          invariant = '''    token_start = attestor_template.index("- name: Mint the independent App token")
    token_end = attestor_template.index("- name: Resolve the attestation subject", token_start)
    attestor_token_block = attestor_template[token_start:token_end]
    required_attestor_permissions = (
        "permission-actions: read",
        "permission-administration: read",
        "permission-checks: read",
        "permission-contents: read",
        "permission-metadata: read",
        "permission-pull-requests: write",
        "permission-statuses: write",
    )
    for marker in required_attestor_permissions:
        if attestor_token_block.count(marker) != 1:
            fail(f"attestor token must request exactly one {marker!r}")
    for forbidden in (
        "permission-secrets:",
        "permission-organization-secrets:",
        "permission-organization-administration:",
    ):
        if forbidden in attestor_token_block:
            fail(f"attestor token must not inherit {forbidden!r}")
'''
          governance = governance.replace(anchor, anchor + invariant, 1)
          governance_path.write_text(governance, encoding='utf-8')

          test_path = root / '.github/scripts/test_code_security_drift.py'
          test_source = test_path.read_text(encoding='utf-8')
          old_test = '''    def test_requested_app_permission_remains_explicitly_separate(self):
        manifest = json.loads(
            (_ROOT / ".governance/github-app-manifest.json").read_text(
                encoding="utf-8"
            )
        )
        permissions = manifest["default_permissions"]
        self.assertEqual(permissions["organization_administration"], "read")
        self.assertEqual(permissions["organization_secrets"], "read")
        self.assertEqual(permissions["administration"], "read")
        self.assertEqual(permissions["secrets"], "read")
'''
          new_test = '''    def test_requested_app_permission_remains_explicitly_separate(self):
        manifest = json.loads(
            (_ROOT / ".governance/github-app-manifest.json").read_text(
                encoding="utf-8"
            )
        )
        permissions = manifest["default_permissions"]
        self.assertEqual(permissions["organization_administration"], "read")
        self.assertNotIn("organization_secrets", permissions)
        self.assertEqual(permissions["administration"], "read")
        self.assertEqual(permissions["secrets"], "read")

        secret_health = (_ROOT / ".github/workflows/secret-health.yml").read_text(
            encoding="utf-8"
        )
        self.assertIn("permission-secrets: read", secret_health)
        self.assertNotIn("permission-organization-secrets:", secret_health)

        attestor = (_ROOT / ".github/workflows/attest-and-approve.yml").read_text(
            encoding="utf-8"
        )
        start = attestor.index("- name: Mint the independent App token")
        end = attestor.index("- name: Resolve the attestation subject", start)
        token_block = attestor[start:end]
        for marker in (
            "permission-actions: read",
            "permission-administration: read",
            "permission-checks: read",
            "permission-contents: read",
            "permission-metadata: read",
            "permission-pull-requests: write",
            "permission-statuses: write",
        ):
            self.assertEqual(token_block.count(marker), 1)
        self.assertNotIn("permission-secrets:", token_block)
        self.assertNotIn("permission-organization-secrets:", token_block)
        self.assertNotIn("permission-organization-administration:", token_block)
'''
          if old_test not in test_source:
              raise SystemExit('security-drift permission regression anchor is absent')
          test_source = test_source.replace(old_test, new_test, 1)
          test_path.write_text(test_source, encoding='utf-8')
          PY

      - name: Remove one-shot builder and qualify permanent tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/qillqaq-secret-scope-repair-builder.yml
          python -m py_compile \
            .github/scripts/verify_forge9_governance.py \
            .github/scripts/test_code_security_drift.py \
            .github/scripts/secret_health.py \
            .github/scripts/test_secret_health.py
          python .github/scripts/test_code_security_drift.py
          python .github/scripts/test_secret_health.py
          python .github/scripts/verify_forge9_governance.py
          git diff --check

      - name: Publish exact repaired branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/scripts/test_code_security_drift.py \
            .github/scripts/verify_forge9_governance.py \
            .github/workflows/attest-and-approve.yml \
            .github/workflows/qillqaq-secret-scope-repair-builder.yml \
            .github/workflows/secret-health.yml \
            .governance/github-app-manifest.json \
            | sort)"
          test "$changed" = "$expected"
          git commit \
            -m 'fix(app): constrain qillqaq secret-name authority' \
            -m 'Keep repository secret-name read for the governed auditor, remove unused organization-wide secret metadata, and explicitly restrict the attestation token to its governance permissions.' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' \
            -m 'Signed-off-by: Lutar, Stephen P. <stephenlutar2@gmail.com>'
          git push origin HEAD:fix/qillqaq-secret-name-read-current-main-20260820
