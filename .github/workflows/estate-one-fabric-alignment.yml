name: Estate one-fabric alignment

on:
  pull_request:
    branches: [main]
    paths:
      - docs/ESTATE_ALIGNMENT_CONTRACT_V1.json
      - profile/README.md
      - huggingface/org-card/**
      - huggingface/org-card.manifest.json
      - .github/scripts/estate_alignment_contract.py
      - .github/scripts/test_estate_alignment_contract.py
      - .github/scripts/test_estate_alignment_org_card.py
      - .github/scripts/test_estate_alignment_identity.py
      - .github/workflows/estate-one-fabric-alignment.yml
  push:
    branches: [main]
    paths:
      - docs/ESTATE_ALIGNMENT_CONTRACT_V1.json
      - profile/README.md
      - huggingface/org-card/**
      - huggingface/org-card.manifest.json
      - .github/scripts/estate_alignment_contract.py
      - .github/scripts/test_estate_alignment_contract.py
      - .github/scripts/test_estate_alignment_org_card.py
      - .github/scripts/test_estate_alignment_identity.py
      - .github/workflows/estate-one-fabric-alignment.yml
  workflow_run:
    workflows: ["Hugging Face organization front door"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: estate-one-fabric-alignment-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-contract:
    if: github.event_name != 'workflow_run'
    name: Exact taxonomy, front doors, and publication set
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Resolve exact source (same-repository heads only)
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          THIS_REPOSITORY: ${{ github.repository }}
          FALLBACK_SHA: ${{ github.sha }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          sha="$FALLBACK_SHA"
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$RUN_HEAD_REPOSITORY" != "$THIS_REPOSITORY" ] || [ "$RUN_HEAD_BRANCH" != "main" ]; then
              echo "::error::refusing to check out a workflow_run head from ${RUN_HEAD_REPOSITORY}@${RUN_HEAD_BRANCH}; only ${THIS_REPOSITORY}@main is trusted"
              exit 1
            fi
            sha="$RUN_HEAD_SHA"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_HEAD_REPOSITORY" = "$THIS_REPOSITORY" ]; then
            sha="$PR_HEAD_SHA"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::resolved source is not a 40-hex commit: ${sha}"
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Compile controller and tests
        run: >-
          python -m py_compile
          .github/scripts/estate_alignment_contract.py
          .github/scripts/test_estate_alignment_contract.py
          .github/scripts/test_estate_alignment_org_card.py
          .github/scripts/test_estate_alignment_identity.py

      - name: Prove exact one-fabric contract offline
        run: |
          python .github/scripts/test_estate_alignment_contract.py
          python .github/scripts/test_estate_alignment_org_card.py
          python .github/scripts/test_estate_alignment_identity.py

      - name: Emit secret-free source receipt
        env:
          GITHUB_SHA: ${{ steps.source.outputs.sha }}
        run: >-
          python .github/scripts/estate_alignment_contract.py
          --repo-root .
          --output estate-alignment-local-receipt.json

      - name: Prove static organization-card publication closure
        run: |
          set -euo pipefail
          python .github/scripts/hf_static_space_deploy.py \
            --repo-root . \
            --manifest huggingface/org-card.manifest.json \
            --source-sha "${{ steps.source.outputs.sha }}" \
            --materialize "$(mktemp -d)" \
            --report hf-org-card-alignment-materialization.json

      - name: Upload immutable local evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: estate-alignment-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            estate-alignment-local-receipt.json
            hf-org-card-alignment-materialization.json
          if-no-files-found: error
          retention-days: 90

  live-contract:
    needs: local-contract
    if: >-
      always() &&
      (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success') ||
        ((github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch') &&
         needs.local-contract.result == 'success')
      )
    name: Product, GitHub, and Hugging Face live readback
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Resolve exact source (same-repository heads only)
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          THIS_REPOSITORY: ${{ github.repository }}
          FALLBACK_SHA: ${{ github.sha }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          sha="$FALLBACK_SHA"
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$RUN_HEAD_REPOSITORY" != "$THIS_REPOSITORY" ] || [ "$RUN_HEAD_BRANCH" != "main" ]; then
              echo "::error::refusing to check out a workflow_run head from ${RUN_HEAD_REPOSITORY}@${RUN_HEAD_BRANCH}; only ${THIS_REPOSITORY}@main is trusted"
              exit 1
            fi
            sha="$RUN_HEAD_SHA"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_HEAD_REPOSITORY" = "$THIS_REPOSITORY" ]; then
            sha="$PR_HEAD_SHA"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::resolved source is not a 40-hex commit: ${sha}"
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact validator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Compare live product, source, and artifact authorities
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ steps.source.outputs.sha }}
        run: >-
          python .github/scripts/estate_alignment_contract.py
          --repo-root .
          --live
          --output estate-alignment-live-receipt.json

      - name: Upload immutable live evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: estate-alignment-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: estate-alignment-live-receipt.json
          if-no-files-found: error
          retention-days: 180
