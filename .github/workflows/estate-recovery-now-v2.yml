# SPDX-License-Identifier: Apache-2.0
name: Estate recovery now v2

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this bounded organization recovery is running"
        required: false
        default: "manual stalled-build convergence"

permissions: read-all
concurrency:
  group: szl-estate-recovery-v2
  cancel-in-progress: false

jobs:
  recover:
    permissions:
      contents: read
      actions: write
      checks: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SZL_ORG_GITHUB_TOKEN: ${{ secrets.SZL_ORG_GITHUB_TOKEN }}
      SZL_GITHUB_TOKEN: ${{ secrets.SZL_GITHUB_TOKEN }}
      ORG_ADMIN_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
      GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      FRONTIER_TOKEN: ${{ secrets.FRONTIER_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
      HF_ORG_TOKEN1: ${{ secrets.HF_ORG_TOKEN1 }}
      HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out exact protected controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify protected-main workflow identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install exact Hugging Face client
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "huggingface_hub==1.29.0"

      - name: Execute bounded organization recovery
        run: >-
          python scripts/estate_recovery_executor_v2.py
          --github-org szl-holdings
          --hf-org SZLHOLDINGS
          --output reports/estate-recovery-v2.json

      - name: Upload immutable secret-free recovery receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: szl-estate-recovery-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/estate-recovery-v2.json
          if-no-files-found: error
          retention-days: 90
