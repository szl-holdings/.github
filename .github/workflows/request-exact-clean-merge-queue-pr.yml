name: Request Exact Clean Merge Queue — Controlled

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/request_exact_clean_merge_queue.py
      - .github/scripts/enqueue_exact_clean_pull_requests.py
      - .github/scripts/enqueue_with_governed_user_tokens.py
      - .github/workflows/request-exact-clean-merge-queue-pr.yml

permissions:
  contents: read

concurrency:
  group: request-exact-clean-merge-queue-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  REPORT_PATH: reports/governed-user-token-enqueue.json

jobs:
  request:
    name: Enter the protected queue without immediate merge or bypass
    if: >-
      github.repository == 'szl-holdings/.github' &&
      github.event.pull_request.number == 324 &&
      github.event.pull_request.head.repo.full_name == 'szl-holdings/.github' &&
      github.event.pull_request.head.ref == 'diag/merge-queue-state-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the reviewed queue controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Compile and constrain the governed credential selection
        run: |
          set -euo pipefail
          python -m py_compile \
            .github/scripts/request_exact_clean_merge_queue.py \
            .github/scripts/enqueue_exact_clean_pull_requests.py \
            .github/scripts/enqueue_with_governed_user_tokens.py
          python - <<'PY'
          from pathlib import Path

          preflight = Path(
              ".github/scripts/request_exact_clean_merge_queue.py"
          ).read_text(encoding="utf-8")
          enqueue = Path(
              ".github/scripts/enqueue_exact_clean_pull_requests.py"
          ).read_text(encoding="utf-8")
          selector = Path(
              ".github/scripts/enqueue_with_governed_user_tokens.py"
          ).read_text(encoding="utf-8")
          required_preflight = (
              "52ab3fc1a17b5366010dd1bcfe8f6dcb5db4a286",
              "fb8a1c2435db5bff99be51faefc9781309d0f9a4",
              "merge_queue",
              "required_signatures",
              "required_status_checks",
              'verification.get("verified") is not True',
              "mergeQueueEntry",
          )
          required_enqueue = (
              "enqueuePullRequest",
              "expectedHeadOid",
              '"jump": False',
              "pullRequestId",
          )
          required_selector = (
              '"GH_NOTIFICATIONS_TOKEN"',
              '"SZL_GITHUB_TOKEN"',
              "ALLOWED_VIEWER_PERMISSIONS",
              "Secret values, lengths, hashes, prefixes, identities",
              "selected_secret_name",
              "ENQUEUED_OR_MERGED",
          )
          forbidden = (
              "mergePullRequest(input:",
              "MergePullRequestInput!",
              '"PUT", f"repos/{repository}/pulls/',
              '"merge_method"',
              "statuses/",
              "check-runs/{",
              "rulesets/",
              "branches/main/protection",
              "git/refs",
              "/reviews",
              "secrets/",
              "print(token",
              "len(token",
              "hashlib",
          )
          for marker in required_preflight:
              assert marker in preflight, marker
          for marker in required_enqueue:
              assert marker in enqueue, marker
          for marker in required_selector:
              assert marker in selector, marker
          for marker in forbidden:
              assert marker not in selector, marker
          PY
          git diff --check

      - name: Select a governed credential and enqueue both exact signed heads
        id: queue
        env:
          GH_NOTIFICATIONS_TOKEN: ${{ secrets.GH_NOTIFICATIONS_TOKEN }}
          SZL_GITHUB_TOKEN: ${{ secrets.SZL_GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          python .github/scripts/enqueue_with_governed_user_tokens.py
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable queue-request evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governed-user-token-enqueue-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Enforce the queue-request result
        if: always()
        env:
          EXIT_CODE: ${{ steps.queue.outputs.exit_code }}
        run: |
          code="${EXIT_CODE:-2}"
          if [ "$code" -ne 0 ]; then
            echo "::error::No existing governed user-token secret could enqueue both exact signed heads. No immediate merge or protection change was attempted."
            exit "$code"
          fi
          echo "Both exact signed heads entered GitHub's protected merge queue or were merged by that queue."
