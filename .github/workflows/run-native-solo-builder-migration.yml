name: Run native solo-builder governance migration

on:
  push:
    branches:
      - chore/native-solo-builder-provenance-20260831
    paths:
      - .github/workflows/run-native-solo-builder-migration.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: native-solo-builder-governance-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Execute bounded solo-builder migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout exact migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/native-solo-builder-provenance-20260831
          fetch-depth: 3
          persist-credentials: false

      - name: Assert exact staged source
        shell: bash
        env:
          EXPECTED_BRANCH: chore/native-solo-builder-provenance-20260831
          EXPECTED_PARENT_SHA: b81d109143ae2db296cdf1403e19f62a9c9ea17e
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test -f .github/workflows/apply-native-solo-builder-governance.yml
          test -f .github/workflows/inspect-central-dco-remnants.yml
          test -f .github/workflows/dco.yml
          test -f .github/workflows/reusable-dco.yml
          test -f .github/workflows/doctrine-required-dco.yml
          test -f .github/scripts/dco_check.py

      - name: Recover and execute staged migration program
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('.github/workflows/apply-native-solo-builder-governance.yml')
          source = source_path.read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Verify migrated governance locally"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('staged migration program boundaries are not exact')
          program = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          normalized = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in program.splitlines()
          ) + '\n'
          old = "updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)"
          new = "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)"
          if normalized.count(old) != 1:
              raise SystemExit('regex helper source is not exact')
          normalized = normalized.replace(old, new, 1)
          target = Path('/tmp/apply_native_solo_builder_governance.py')
          target.write_text(normalized, encoding='utf-8')
          compile(target.read_text(encoding='utf-8'), str(target), 'exec')
          PY
          python3 - <<'PY'
          from pathlib import Path

          path = Path('WORKFLOWS.md')
          text = path.read_text(encoding='utf-8')
          old = "`.github/workflows/dco.yml` is retained under its historical filename because\n"
          new = "`.github/workflows/solo-builder-provenance.yml` provides exact-head provenance because\n"
          if text.count(old) != 1:
              raise SystemExit('stale workflow documentation anchor is not exact')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 /tmp/apply_native_solo_builder_governance.py
          rm -f .github/workflows/run-native-solo-builder-migration.yml

      - name: Verify migrated governance locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/*.py
          python3 .github/scripts/test_solo_builder_provenance.py
          python3 .github/scripts/verify_forge9_governance.py
          python3 .github/scripts/run_forge9_gate.py gate/verify-all
          git diff --check
          test -f .github/workflows/solo-builder-provenance.yml
          test ! -e .github/workflows/dco.yml
          test ! -e .github/workflows/reusable-dco.yml
          test ! -e .github/workflows/doctrine-required-dco.yml
          test ! -e .github/scripts/dco_check.py
          test ! -e .github/workflows/apply-native-solo-builder-governance.yml
          test ! -e .github/workflows/inspect-central-dco-remnants.yml
          test ! -e .github/workflows/run-native-solo-builder-migration.yml

      - name: Commit exact migration to branch
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ secrets.SZL_GITHUB_TOKEN }}
          EXPECTED_BRANCH: chore/native-solo-builder-provenance-20260831
        run: |
          set -euo pipefail
          test -n "$GH_PUSH_TOKEN"
          git config user.name "SZL Governance Bot"
          git config user.email "noreply@szlholdings.ai"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "Migration produced no changes." >&2; exit 1; }
          git commit -m "ci: replace sign-off enforcement with solo-builder provenance"
          remote="https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote" "HEAD:refs/heads/${EXPECTED_BRANCH}"
