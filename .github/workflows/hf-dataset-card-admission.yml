name: HF dataset card admission

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  admission:
    name: HF dataset card offline admission
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Test fail-closed source contracts
        run: python -I -P -B .github/scripts/test_hf_dataset_card_admission.py
      - name: Test source contracts with assertions disabled
        run: python -I -P -B -O .github/scripts/test_hf_dataset_card_admission.py
      - name: Validate the actual two-card source proposal
        run: python -I -P -B .github/scripts/hf_dataset_card_admission.py --root .
