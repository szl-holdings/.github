# Branch-only exact-head operation, not a reusable controller or deployment.
name: Queue verified public-smoke candidate through native protections
"on":
  push:
    branches: [ops/queue-743-8331e2dc-20260915]
    paths: [.github/workflows/one-time-queue-745.yml]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: one-time-verified-queue-745-cf3cc8cc
  cancel-in-progress: false
jobs:
  queue:
    if: github.repository == 'szl-holdings/.github' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify signature and checks, enqueue once, then observe without resending
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p queue-evidence
          python3 - <<'PY'
          import datetime, json, os, pathlib, time, urllib.request
          REPO='szl-holdings/.github'; PR=745
          HEAD='cf3cc8cc4fea8f07447995a000111f67f301d0cc'
          BASE='60c9ce7ba56c30b5f6529c916ca55e0bad8eff3b'
          TREE='779f5fcbf77e3e875f0a1cf06f83d103175af34d'
          REQUIRED={'gate/ground-truth','gate/labels','gate/schema','gate/adversarial','gate/verify-all','gate/provenance','gate/a11y-perf','gate/lean','deploy/staging'}
          record={'schema':'szl.verified-native-queue-observation/v1','repository':REPO,'pr':PR,
                  'reviewed_head':HEAD,'reviewed_base':BASE,'reviewed_tree':TREE,
                  'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
                  'operator_sha':os.environ['GITHUB_SHA'],'state':'NOT_ATTEMPTED','enqueue_attempts':0,
                  'admin_bypass':False,'protection_changes':0,'provider_publication':False}
          out=pathlib.Path('queue-evidence/receipt.json')
          def save():
              record['observed_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
              out.write_text(json.dumps(record,indent=2)+'\n')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise RuntimeError('redirect prohibited')
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
          def api(path,payload=None):
              if not (path.startswith('/repos/'+REPO+'/') or path=='/graphql'): raise RuntimeError('unexpected API path')
              req=urllib.request.Request('https://api.github.com'+path,data=None if payload is None else json.dumps(payload).encode(),
                  method='GET' if payload is None else 'POST',headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],
                  'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'SZL-verified-native-queue/1.0'})
              with opener.open(req,timeout=25) as response: raw=response.read(4*1024*1024+1)
              if len(raw)>4*1024*1024: raise RuntimeError('response too large')
              value=json.loads(raw)
              if isinstance(value,dict) and value.get('errors'):
                  record['graphql_errors']=[{'type':str(e.get('type',''))[:80],
                      'message':str(e.get('message','')).replace(os.environ['GITHUB_TOKEN'],'[REDACTED]')[:500]} for e in value['errors'][:3]]
                  raise RuntimeError('GraphQL rejected operation')
              return value
          def observe():
              return api('/graphql',{'query':'query { repository(owner:"szl-holdings",name:".github") { pullRequest(number:745) { id number state isDraft headRefOid baseRefName mergeStateStatus mergeCommit { oid } mergeQueueEntry { id position state } reviewThreads(first:100) { nodes { isResolved } pageInfo { hasNextPage } } } } }'})['data']['repository']['pullRequest']
          def valid(pr):
              if pr['number']!=PR or pr['state']!='OPEN' or pr['isDraft'] or pr['headRefOid']!=HEAD or pr['baseRefName']!='main': raise RuntimeError('PR source/disposition changed')
              if pr['reviewThreads']['pageInfo']['hasNextPage'] or any(not r['isResolved'] for r in pr['reviewThreads']['nodes']): raise RuntimeError('unresolved or incomplete review threads')
          try:
              if os.environ['GITHUB_RUN_ATTEMPT']!='1': raise RuntimeError('rerun prohibited')
              pr=observe(); valid(pr); record['before']=pr
              if pr['mergeQueueEntry']:
                  record['state']='ALREADY_ENQUEUED'; save(); raise SystemExit(0)
              commit=api('/repos/'+REPO+'/git/commits/'+HEAD)
              if not commit['verification']['verified'] or commit['tree']['sha']!=TREE or [p['sha'] for p in commit['parents']]!=[BASE]: raise RuntimeError('reviewed signature/tree/parent mismatch')
              rules=api('/repos/'+REPO+'/rulesets/19755620')
              if rules.get('enforcement')!='active' or not any(r['type']=='merge_queue' for r in rules['rules']): raise RuntimeError('native queue must remain active')
              names={c['context'] for r in rules['rules'] if r['type']=='required_status_checks' for c in r['parameters']['required_status_checks']}
              if names!=REQUIRED: raise RuntimeError('check policy changed')
              deadline=time.monotonic()+150
              while True:
                  checks=[]
                  for page in range(1,11):
                      batch=api('/repos/'+REPO+'/commits/'+HEAD+'/check-runs?filter=latest&per_page=100&page='+str(page))['check_runs'];checks.extend(batch)
                      if len(batch)<100: break
                  else: raise RuntimeError('checks incomplete')
                  verified={}
                  for name in sorted(REQUIRED):
                      rows=[r for r in checks if r['name']==name and r['head_sha']==HEAD and r.get('app',{}).get('id')==15368]
                      if rows:
                          latest=max(rows,key=lambda r:r['id'])
                          if latest['status']=='completed' and latest['conclusion']=='success': verified[name]=latest['id']
                  if len(verified)==len(REQUIRED): break
                  if time.monotonic()>=deadline: raise RuntimeError('required checks not successful')
                  time.sleep(15)
              record['required_checks']=verified
              if api('/repos/'+REPO+'/git/ref/heads/main')['object']['sha']!=BASE: raise RuntimeError('main moved before request')
              pr=observe();valid(pr)
              if pr['mergeQueueEntry']: record['state']='ALREADY_ENQUEUED';save();raise SystemExit(0)
              record['state']='UNKNOWN_AFTER_ATTEMPT';record['enqueue_attempts']=1;save()
              result=api('/graphql',{'query':'mutation($id:ID!,$sha:GitObjectID!){ enqueuePullRequest(input:{pullRequestId:$id,expectedHeadOid:$sha,jump:false}){ mergeQueueEntry { id position state } } }','variables':{'id':pr['id'],'sha':HEAD}})
              entry=result['data']['enqueuePullRequest']['mergeQueueEntry']
              if not entry or not entry.get('id'): raise RuntimeError('queue acceptance not returned')
              record['queue_entry']=entry;record['state']='QUEUE_ACCEPTED';save()
              deadline=time.monotonic()+600
              record['readbacks']=[]
              while time.monotonic()<deadline:
                  current=observe(); record['readbacks'].append({k:current[k] for k in ('state','headRefOid','mergeStateStatus','mergeCommit','mergeQueueEntry')});save()
                  if current['headRefOid']!=HEAD: raise RuntimeError('queued source changed')
                  if current['state']=='MERGED':
                      record['state']='MERGED_BY_NATIVE_QUEUE';record['merge_commit']=current['mergeCommit']['oid'];save();break
                  if current['state']!='OPEN' or not current['mergeQueueEntry']:
                      record['state']='LEFT_QUEUE_NOT_MERGED';save();raise RuntimeError('native queue did not complete admission')
                  time.sleep(15)
              else: record['state']='QUEUE_ACCEPTED_OBSERVATION_TIMEOUT';save()
          except Exception as exc:
              record['error_type']=type(exc).__name__
              if hasattr(exc,'code'):record['http_status']=exc.code
              if record['enqueue_attempts']==0:record['state']='PRECHECK_FAILED'
              try:record['after_error_readback']=observe()
              except Exception as err:record['readback_error']=type(err).__name__
              save();print(json.dumps(record,indent=2));raise SystemExit('Native queue not complete; retain receipt, no resend or bypass.')
          finally:save()
          print(json.dumps(record,indent=2))
          PY
      - name: Retain queue admission and readback separately from deployment
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: queue-745-${{ github.run_id }}-${{ github.run_attempt }}
          path: queue-evidence/receipt.json
          if-no-files-found: error
          retention-days: 30
