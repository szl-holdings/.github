name: Frontier payload convergence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/frontier_payload/**"
      - ".github/scripts/frontier_payload_convergence.py"
      - ".github/workflows/frontier-payload-convergence.yml"
      - "tests/test_frontier_payload_convergence.py"
      - "docs/frontier/SZL_FRONTIER_PAYLOAD_2026-09-03.md"
  push:
    branches: [main]
    paths:
      - ".github/scripts/frontier_payload/**"
      - ".github/scripts/frontier_payload_convergence.py"
      - ".github/workflows/frontier-payload-convergence.yml"
      - "tests/test_frontier_payload_convergence.py"
      - "docs/frontier/SZL_FRONTIER_PAYLOAD_2026-09-03.md"
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply exact HF card, metadata, and native-workflow controls"
        required: false
        type: boolean
        default: true
      dispatch_controls:
        description: "Dispatch existing A11oy, CodeQL, and Nemo status workflows"
        required: false
        type: boolean
        default: true
      enforce_ready:
        description: "Fail unless all critical public probes and source parity pass"
        required: false
        type: boolean
        default: true

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: frontier-payload-convergence-${{ github.event_name }}
  cancel-in-progress: false

env:
  REPORT_PATH: /tmp/szl-frontier-payload-convergence-v1.json
  SUMMARY_PATH: /tmp/szl-frontier-payload-convergence-v1.md

jobs:
  contract:
    name: Prove mutation and evidence boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Compile and run network-free contracts
        shell: bash
        run: |
          set -euo pipefail
          python -I -P -m py_compile \
            .github/scripts/frontier_payload/*.py \
            .github/scripts/frontier_payload_convergence.py \
            tests/test_frontier_payload_convergence.py
          python -I -P tests/test_frontier_payload_convergence.py
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          source = Path("docs/frontier/SZL_FRONTIER_PAYLOAD_2026-09-03.md")
          observed = sha256(source.read_bytes()).hexdigest()
          expected = "55c29e76dede81ac61f51543696ec62bd05bdff6a0db829d91e0ebe32807b770"
          if observed != expected:
              raise SystemExit(f"payload digest drift: {observed}")
          print("payload digest: PASS")
          PY
          git diff --check

      - name: Verify action pins and guarded-boundary literals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path(".github/workflows/frontier-payload-convergence.yml").read_text()
          uses = re.findall(r"^\s*uses:\s*(\S+)\s*(?:#.*)?$", workflow, re.MULTILINE)
          bad = [value for value in uses if not re.fullmatch(r"[^@\s]+@[0-9a-f]{40}", value)]
          if bad:
              raise SystemExit(f"unpinned actions: {bad}")
          source = "\n".join(
              path.read_text()
              for path in Path(".github/scripts/frontier_payload").glob("*.py")
          )
          forbidden = (
              "update_repo_" + "visibility",
              "private" + "=False",
              "branches/" + "protection",
              "/actions/" + "secrets",
          )
          present = [value for value in forbidden if value in source]
          if present:
              raise SystemExit(f"guarded mutation literal present: {present}")
          print("contract literals: PASS")
          PY

  converge:
    name: Apply exact payload controls and record readback
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    env:
      SZL_ORG_TOKEN: ${{ secrets.SZL_ORG_ADMIN_TOKEN || secrets.ORG_ADMIN_TOKEN || secrets.SZL_GITHUB_TOKEN || secrets.GH_PAT || github.token }}
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_ORG_TOKEN || secrets.HF_ORG_TOKEN1 || secrets.HF_WRITE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out protected control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install exact Hugging Face control client
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "huggingface_hub==1.19.0"

      - name: Execute bounded convergence
        id: converge
        shell: bash
        env:
          INPUT_APPLY: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply) }}
          INPUT_DISPATCH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dispatch_controls) }}
          INPUT_ENFORCE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.enforce_ready) }}
        run: |
          set +e
          args=(--report "$REPORT_PATH" --summary "$SUMMARY_PATH")
          if [ "$INPUT_APPLY" = "true" ]; then args+=(--apply); fi
          if [ "$INPUT_DISPATCH" = "true" ]; then args+=(--dispatch-controls); fi
          if [ "$INPUT_ENFORCE" = "true" ]; then args+=(--enforce-ready); fi
          python -I -P .github/scripts/frontier_payload_convergence.py "${args[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify secret-free receipt contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["REPORT_PATH"])
          if not path.is_file():
              raise SystemExit("frontier operator emitted no report")
          text = path.read_text()
          payload = json.loads(text)
          if payload.get("schema") != "szl.frontier-payload-convergence/v1":
              raise SystemExit("unexpected report schema")
          if payload.get("token_values_recorded") is not False:
              raise SystemExit("token recording was not denied")
          if re.search(r"(?:gh[pousr]_|github_pat_|hf_)[A-Za-z0-9_]{20,}", text):
              raise SystemExit("credential-shaped material appeared in report")
          for key in (
              "private_space_visibility_mutated",
              "branch_protection_mutated",
              "secrets_mutated",
              "cloudflare_mutated_by_this_controller",
              "nemo_signature_attempted",
              "nemo_queue_mutated",
          ):
              if payload.get(key) is not False:
                  raise SystemExit(f"guarded boundary changed: {key}")
          print(json.dumps({
              "status": payload.get("status"),
              "public_estate": payload.get("public_estate", {}).get("ready"),
              "revision_matches": payload.get("public_estate", {}).get("revision_matches"),
              "vessels_card": payload.get("vessels_card", {}).get("state"),
          }, indent=2, sort_keys=True))
          PY

      - name: Publish exact summary
        if: always()
        shell: bash
        run: cat "$SUMMARY_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable convergence evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontier-payload-convergence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.REPORT_PATH }}
            ${{ env.SUMMARY_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Reconcile the command-center issue
        if: always()
        shell: bash
        run: |
          set +e
          gh issue comment 585 --repo szl-holdings/.github --body-file "$SUMMARY_PATH"
          exit 0

      - name: Enforce requested terminal state
        if: always()
        shell: bash
        run: |
          code="${{ steps.converge.outputs.exit_code }}"
          test -n "$code"
          if [ "$code" -ne 0 ]; then
            echo "::error::Frontier payload has an actionable block or readiness proof has not converged."
            exit "$code"
          fi
