# SZL starter workflow: sign every release.
#
# On a published GitHub Release this builds the Python sdist and wheel, then:
#   1. attests SLSA build provenance (actions/attest-build-provenance),
#   2. generates an SPDX SBOM of the source (anchore/sbom-action / Syft) and
#      attests it against the same files (actions/attest, sbom-path),
#   3. signs each file keylessly with Sigstore cosign (<file>.sigstore.json),
#   4. uploads the built files themselves plus the SBOM, Sigstore bundles and
#      attestation bundles to the release, so every verify command below has a
#      durable subject to check.
# It does not publish to PyPI or Hugging Face; keep publishing in its own
# approval-gated workflow.
#
# Verify a downloaded file with:
#   gh attestation verify <file> --repo <owner>/<repo>
#   cosign verify-blob <file> --bundle <file>.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/<owner>/<repo>/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: Release attest

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Replace with the repository's own build if it is not a Python package.
      - name: Build sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check build==1.3.0
          python -m build
      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest and sign release files
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # upload evidence to the release
      id-token: write       # Sigstore / attestation OIDC
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Build provenance attestation
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: sbom.spdx.json
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release files (keyless Sigstore)
        run: |
          set -euo pipefail
          for f in dist/*; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
      - name: Upload evidence to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${PROVENANCE_BUNDLE}" provenance.intoto.jsonl
          cp "${SBOM_BUNDLE}" sbom.intoto.jsonl
          gh release upload "${RELEASE_TAG}" dist/* provenance.intoto.jsonl sbom.intoto.jsonl sbom.spdx.json \
            --repo "${GITHUB_REPOSITORY}" --clobber
